name: SECURITY-2J1 Gates
on:
  push:
    branches: [security-2j1-maintenance-core-authority]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoerp_phase1_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      USE_PGLITE: "false"
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_HOST: 127.0.0.1
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/autoerp_phase1_test
      RECURRING_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Report gate start
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 165 --repo "$GITHUB_REPOSITORY" --body "SECURITY-2J1 GATES START | commit=$GITHUB_SHA | run_id=$GITHUB_RUN_ID | run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false
      - name: Apply migrations 0000 through 0016
        run: node migrate_test_db.cjs
      - name: SECURITY-2J1 database/API integration
        run: npx tsx src/server/__tests__/maintenanceAuthorityIntegration.ts
      - name: SECURITY-2I5 recurring regression
        run: npx tsx src/server/__tests__/recurringAuthorityIntegration.ts
      - name: Contract authority regression
        run: npx tsx src/server/__tests__/contractAuthorityIntegration.ts
      - name: Document authority regression
        run: npx tsx src/server/__tests__/documentAuthorityIntegration.ts
      - name: TypeScript gate
        run: npm run lint
      - name: Production build gate
        run: npm run build
      - name: Report gate success
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 165 --repo "$GITHUB_REPOSITORY" --body "SECURITY-2J1 GATES PASS | commit=$GITHUB_SHA | run_id=$GITHUB_RUN_ID | run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Report gate failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 165 --repo "$GITHUB_REPOSITORY" --body "SECURITY-2J1 GATES FAIL | commit=$GITHUB_SHA | run_id=$GITHUB_RUN_ID | run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
