name: FINANCE-R19 Bootstrap Seed Repair

on:
  push:
    branches:
      - finance-r19-transfer-idempotency-concurrency

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'repair R19 bootstrap financial-period seed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finance-r19-transfer-idempotency-concurrency
      - name: Repair authoritative R19 financial-period fixture and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/finance-r19-gates.yml')
          text = p.read_text()
          old = """  await db.execute(sql`INSERT INTO financial_periods(id,company_id,name,start_date,end_date,status,closed_at,closed_by_id,created_at,updated_at)\n    VALUES('r19-closed-period',${companyA},'Closed R19','2026-07-01','2026-07-31','CLOSED',NOW(),${adminA},NOW(),NOW())`);"""
          new = """  await db.execute(sql`INSERT INTO financial_periods(id,company_id,year,month,start_date,end_date,status,closed_at,closed_by)\n    VALUES('r19-closed-period',${companyA},2026,7,'2026-07-01','2026-07-31','CLOSED',NOW(),${adminA})`);"""
          if old not in text:
              raise SystemExit('FINANCE-R19 financial-period fixture anchor not found')
          p.write_text(text.replace(old, new, 1))
          Path('.github/workflows/finance-r19-bootstrap-seed-repair.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/finance-r19-gates.yml .github/workflows/finance-r19-bootstrap-seed-repair.yml
          git diff --cached --check
          git commit -m "FINANCE-R19: repair authoritative financial-period bootstrap fixture"
          git push origin HEAD:finance-r19-transfer-idempotency-concurrency
