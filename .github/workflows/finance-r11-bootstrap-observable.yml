name: FINANCE-R11 Observable Bootstrap

on:
  push:
    branches:
      - finance-r11-traffic-ticket-discount

concurrency:
  group: finance-r11-authoritative-bootstrap
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoerp_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      USE_PGLITE: "false"
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_HOST: 127.0.0.1
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/autoerp_phase1_test
      RECURRING_SCHEDULER_ENABLED: "false"
      JWT_SECRET: finance-r11-observable-test-jwt-secret-that-is-long-enough
      JWT_ISSUER: autoerp-finance-r11-observable
      JWT_AUDIENCE: autoerp-finance-r11-observable-client

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Report bootstrap start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 215 --repo "$GITHUB_REPOSITORY" --body "FINANCE-R11 BOOTSTRAP START | commit=$GITHUB_SHA | run_id=$GITHUB_RUN_ID"

      - name: Reuse prior FINANCE-R11 implementation script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output(
              ['git', 'show', 'HEAD^:.github/workflows/finance-r11-bootstrap.yml'],
              text=True,
          )
          marker = '      - name: Apply FINANCE-R11 implementation\n'
          start = source.find(marker)
          if start < 0:
              raise SystemExit('Prior FINANCE-R11 implementation step not found')
          run_marker = '        run: |\n'
          run_start = source.find(run_marker, start)
          if run_start < 0:
              raise SystemExit('Prior FINANCE-R11 run block not found')
          body_start = run_start + len(run_marker)
          next_step = source.find('\n      - name:', body_start)
          if next_step < 0:
              raise SystemExit('End of prior FINANCE-R11 implementation step not found')
          block = source[body_start:next_step]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif not line.strip():
                  lines.append('')
              else:
                  raise SystemExit(f'Unexpected indentation in prior implementation: {line!r}')
          script = '\n'.join(lines) + '\n'
          script = script.replace(
              "Path('.github/workflows/finance-r11-bootstrap.yml').unlink()",
              "Path('.github/workflows/finance-r11-bootstrap.yml').unlink(missing_ok=True)",
          )
          Path('/tmp/finance-r11-apply.sh').write_text(script)
          PY
          bash /tmp/finance-r11-apply.sh

      - name: Verify implementation scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import subprocess
          allowed = {
            'src/domain/finance/SettlementService.ts',
            'src/domain/finance/TrafficTicketSettlementDiscount.ts',
            'src/server/__tests__/financeTrafficTicketDiscountIntegration.ts',
          }
          changed = set()
          for line in subprocess.check_output(['git','status','--porcelain'], text=True).splitlines():
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.add(path)
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'Unexpected FINANCE-R11 implementation scope: {sorted(unexpected)}')
          if changed != allowed:
              raise SystemExit(f'FINANCE-R11 implementation scope mismatch: changed={sorted(changed)}')
          print('FINANCE-R11 implementation scope: PASS')
          PY

      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false

      - name: TypeScript gate
        run: npm run lint

      - name: Apply migrations
        run: node migrate_test_db.cjs

      - name: FINANCE-R11 traffic-ticket discount regression
        run: npx tsx src/server/__tests__/financeTrafficTicketDiscountIntegration.ts

      - name: Existing traffic-ticket authority regression
        run: npx tsx src/server/__tests__/trafficTicketAuthorityIntegration.ts

      - name: FINANCE-R21 settlement concurrency regression
        run: npx tsx src/server/__tests__/financeSettlementConcurrencyIntegration.ts

      - name: FINANCE-R15 financial-period regression
        run: npx tsx src/server/__tests__/financialPeriodAuthorityIntegration.ts

      - name: FINANCE-R10 NIC profitability regression
        run: npx tsx src/domain/finance/__tests__/profitabilityNicTicketClassificationTestRunner.ts

      - name: Finance settlement client regression
        run: npx tsx src/api/__tests__/financeSettlementClientTestRunner.ts

      - name: Production build gate
        run: npm run build

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finance-r11-bootstrap-observable.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'FINANCE-R11: enforce authoritative traffic-ticket discount'
          git push origin HEAD:finance-r11-traffic-ticket-discount
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            src/domain/finance/SettlementService.ts \
            src/domain/finance/TrafficTicketSettlementDiscount.ts \
            src/server/__tests__/financeTrafficTicketDiscountIntegration.ts | sort)"
          test "$changed" = "$expected"
          echo 'FINANCE-R11 validated implementation committed with exact three-file net scope.'

      - name: Report bootstrap success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 215 --repo "$GITHUB_REPOSITORY" --body "FINANCE-R11 BOOTSTRAP PASS | source=$GITHUB_SHA | run_id=$GITHUB_RUN_ID | branch=finance-r11-traffic-ticket-discount"

      - name: Report bootstrap failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 215 --repo "$GITHUB_REPOSITORY" --body "FINANCE-R11 BOOTSTRAP FAIL | source=$GITHUB_SHA | run_id=$GITHUB_RUN_ID"
