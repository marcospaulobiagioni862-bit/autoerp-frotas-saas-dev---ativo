# FINANCE-R19 durable idempotency and concurrency-safe account-transfer gate
name: FINANCE-R19 Gates

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoerp_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      USE_PGLITE: "false"
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_HOST: 127.0.0.1
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/autoerp_phase1_test
      RECURRING_SCHEDULER_ENABLED: "false"
      JWT_SECRET: finance-r19-test-jwt-secret-that-is-long-enough
      JWT_ISSUER: autoerp-finance-r19-test
      JWT_AUDIENCE: autoerp-finance-r19-test-client

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false

      - name: FINANCE-R19 source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "idempotencyKey: string" src/domain/finance/TransferService.ts
          grep -q "findFinancialAccountByIdWithLock" src/domain/finance/TransferService.ts
          grep -q "findFinancialTransactionByIdempotencyKey" src/domain/finance/TransferService.ts
          grep -q "idempotencyKey: commandKey" src/domain/finance/TransferService.ts
          grep -q "Chave de idempotência reutilizada com comando de transferência diferente" src/domain/finance/TransferService.ts
          grep -q "const idempotencyKey = typeof req.body?.idempotencyKey" server.ts
          grep -q "createTransferIdempotencyKey" src/api/financeTransactionClient.ts
          grep -q "idempotencyKey: transferCommandKey" src/components/modals/TransferModal.tsx
          if grep -q "localRepositories" src/api/financeTransactionClient.ts; then
            echo "FAIL: financial transaction client references local persistence"
            exit 1
          fi
          echo "FINANCE-R19 source invariants: PASS"

      - name: Apply migrations
        run: node migrate_test_db.cjs

      - name: FINANCE-R19 transfer concurrency and idempotency regression
        run: npx tsx src/server/__tests__/financeTransferConcurrencyIntegration.ts

      - name: Finance transaction client regression
        run: npx tsx src/api/__tests__/financeTransactionClientTestRunner.ts

      - name: FINANCE-R18 reversal concurrency regression
        run: npx tsx src/server/__tests__/financeReversalConcurrencyIntegration.ts

      - name: TypeScript gate
        run: npm run lint

      - name: Production build gate
        run: npm run build

      - name: Production bundle authority guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIl "AutoERP_DB" dist/assets >/tmp/finance_r19_bundle_hits.txt; then
            echo "FAIL: legacy browser database marker found in production bundle"
            cat /tmp/finance_r19_bundle_hits.txt
            exit 1
          fi
          echo "FINANCE-R19 production bundle authority guard: PASS"
