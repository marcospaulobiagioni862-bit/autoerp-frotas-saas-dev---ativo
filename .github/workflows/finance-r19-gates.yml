name: FINANCE-R19 Gates

on:
  push:
    branches:
      - finance-r19-transfer-idempotency-concurrency
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  implement:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, 'FINANCE-R19 implementation')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoerp_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      USE_PGLITE: "false"
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_HOST: 127.0.0.1
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/autoerp_phase1_test
      RECURRING_SCHEDULER_ENABLED: "false"
      JWT_SECRET: finance-r19-test-jwt-secret-that-is-long-enough
      JWT_ISSUER: autoerp-finance-r19-test
      JWT_AUDIENCE: autoerp-finance-r19-test-client
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finance-r19-transfer-idempotency-concurrency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply FINANCE-R19 implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'FINANCE-R19 patch anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Transaction context: serialize a logical command key independently of account choice.
          replace(
              'src/domain/finance/ITransactionContext.ts',
              "  /** Server-only settlement/reversal capability: durable lookup of a financial command idempotency key. */\n  findFinancialTransactionByIdempotencyKey?(key: string): Promise<FinancialTransaction | null>;\n",
              "  /** Server-only settlement/reversal capability: durable lookup of a financial command idempotency key. */\n  findFinancialTransactionByIdempotencyKey?(key: string): Promise<FinancialTransaction | null>;\n  /** Server-only financial-command capability: serialize reuse of one tenant-scoped idempotency key. */\n  lockFinancialCommandIdempotencyKey?(key: string): Promise<void>;\n"
          )

          replace(
              'src/db/uow.ts',
              "        findFinancialTransactionByIdempotencyKey:async(key:string)=>{\n          const rows=await tx.select().from(financialTransactions)\n            .where(and(eq(financialTransactions.companyId,companyId),eq(financialTransactions.idempotencyKey,key)))\n            .limit(1);\n          return rows[0]||null;\n        },\n",
              "        findFinancialTransactionByIdempotencyKey:async(key:string)=>{\n          const rows=await tx.select().from(financialTransactions)\n            .where(and(eq(financialTransactions.companyId,companyId),eq(financialTransactions.idempotencyKey,key)))\n            .limit(1);\n          return rows[0]||null;\n        },\n        lockFinancialCommandIdempotencyKey:async(key:string)=>{\n          await tx.execute(sql`SELECT pg_advisory_xact_lock(hashtextextended(${companyId + ':' + key}, 0))`);\n        },\n"
          )

          Path('src/domain/finance/TransferService.ts').write_text(r'''import { ITransactionContext } from './ITransactionContext';
import {
  FinancialTransactionRepository,
  FinancialAccountRepository,
} from '../../persistence/repositories/localRepositories';
import { FinancialTransaction, FinancialAccount } from '../../types/entities';
import { TransactionType, AuditAction } from '../../types/enums';
import { generateUUID } from '../../shared/utils/uuid';
import { AuditLogger } from '../../shared/utils/auditLogger';
import { FinancialPeriodService } from './FinancialPeriodService';
import { FinancialAuthorizationService } from './FinancialAuthorizationService';

export interface TransferParams {
  companyId: string;
  sourceAccountId: string;
  destinationAccountId: string;
  amount: number;
  transferDate: string;
  paymentMethodId: string;
  description: string;
  idempotencyKey: string;
  userId: string;
  userName: string;
}

export class TransferService {
  private static accountRepo = new FinancialAccountRepository();
  private static txRepo = new FinancialTransactionRepository();

  private static assertSameCommand(existing: FinancialTransaction, params: TransferParams, description: string): void {
    const same =
      existing.type === TransactionType.TRANSFER &&
      existing.financialAccountId === params.sourceAccountId &&
      existing.destinationAccountId === params.destinationAccountId &&
      Number(existing.amount) === Number(params.amount) &&
      existing.paymentMethodId === params.paymentMethodId &&
      String(existing.transactionDate).slice(0, 10) === params.transferDate.slice(0, 10) &&
      existing.description === description;
    if (!same) {
      throw new Error('Chave de idempotência reutilizada com comando de transferência diferente');
    }
  }

  public static async transferFunds(params: TransferParams, txContext?: ITransactionContext): Promise<FinancialTransaction> {
    await FinancialAuthorizationService.authorize(
      params.userId,
      params.companyId,
      'FINANCIAL_TRANSFER',
      txContext
    );

    const commandKey = typeof params.idempotencyKey === 'string' ? params.idempotencyKey.trim() : '';
    const description = (params.description || 'Transferência entre contas financeiras').trim();
    if (!params.sourceAccountId || !params.destinationAccountId || !params.paymentMethodId || !params.transferDate) {
      throw new Error('Conta de origem, conta de destino, forma de pagamento e data são obrigatórias');
    }
    if (!commandKey || commandKey.length > 200) {
      throw new Error('Chave de idempotência da transferência é obrigatória e deve ter no máximo 200 caracteres');
    }
    if (description.length > 1000) {
      throw new Error('Descrição da transferência deve ter no máximo 1000 caracteres');
    }
    if (params.sourceAccountId === params.destinationAccountId) {
      throw new Error('Conta de origem e destino devem ser diferentes');
    }
    if (!Number.isFinite(params.amount) || params.amount <= 0) {
      throw new Error('Valor da transferência deve ser maior que zero');
    }

    if (txContext) {
      if (!txContext.findFinancialTransactionByIdempotencyKey || !txContext.lockFinancialCommandIdempotencyKey) {
        throw new Error('Idempotência durável indisponível no contexto transacional');
      }
      await txContext.lockFinancialCommandIdempotencyKey(commandKey);
      const existing = await txContext.findFinancialTransactionByIdempotencyKey(commandKey);
      if (existing) {
        this.assertSameCommand(existing, params, description);
        return existing;
      }
    }

    await FinancialPeriodService.assertDateOpen(params.companyId, params.transferDate, txContext);

    let sourceAcc: FinancialAccount | null;
    let destAcc: FinancialAccount | null;

    if (txContext) {
      if (!txContext.findFinancialAccountByIdWithLock) {
        throw new Error('Lock de conta financeira indisponível no contexto transacional');
      }
      const orderedIds = [params.sourceAccountId, params.destinationAccountId].sort();
      const locked = new Map<string, FinancialAccount>();
      for (const accountId of orderedIds) {
        const account = await txContext.findFinancialAccountByIdWithLock(accountId);
        if (account) locked.set(accountId, account);
      }
      sourceAcc = locked.get(params.sourceAccountId) || null;
      destAcc = locked.get(params.destinationAccountId) || null;
    } else {
      sourceAcc = await this.accountRepo.findByIdForCompany(params.sourceAccountId, params.companyId);
      destAcc = await this.accountRepo.findByIdForCompany(params.destinationAccountId, params.companyId);
    }

    if (!sourceAcc || !destAcc) {
      throw new Error('Conta financeira de origem ou destino não encontrada');
    }
    if (
      !sourceAcc.companyId ||
      sourceAcc.companyId !== params.companyId ||
      !destAcc.companyId ||
      destAcc.companyId !== params.companyId ||
      sourceAcc.companyId !== destAcc.companyId
    ) {
      throw new Error('Acesso negado: Transferência entre contas de empresas diferentes ou não autorizadas');
    }
    if (sourceAcc.status !== 'ACTIVE') throw new Error('Conta financeira de origem inativa');
    if (destAcc.status !== 'ACTIVE') throw new Error('Conta financeira de destino inativa');

    if (txContext) {
      const paymentMethodRepo = txContext.getPaymentMethodRepo?.();
      if (!paymentMethodRepo) throw new Error('Forma de pagamento indisponível no contexto transacional');
      const paymentMethod = await paymentMethodRepo.findById(params.paymentMethodId);
      if (!paymentMethod) throw new Error('Forma de pagamento não encontrada');
      if (!paymentMethod.companyId || paymentMethod.companyId !== params.companyId) {
        throw new Error('Acesso negado: Forma de pagamento pertence a outra empresa ou tenant inválido');
      }
      if (paymentMethod.active === false) throw new Error('Forma de pagamento inativa');
    }

    if (txContext) {
      await txContext.getAccountRepo().updateBalance(params.sourceAccountId, -params.amount);
      await txContext.getAccountRepo().updateBalance(params.destinationAccountId, params.amount);
    } else {
      await this.accountRepo.updateBalanceForCompany(params.companyId, params.sourceAccountId, -params.amount);
      await this.accountRepo.updateBalanceForCompany(params.companyId, params.destinationAccountId, params.amount);
    }

    try {
      const transaction: FinancialTransaction = {
        id: generateUUID(),
        companyId: params.companyId,
        financialAccountId: params.sourceAccountId,
        destinationAccountId: params.destinationAccountId,
        type: TransactionType.TRANSFER,
        amount: params.amount,
        paymentMethodId: params.paymentMethodId,
        transactionDate: params.transferDate,
        competenceDate: params.transferDate,
        description,
        idempotencyKey: commandKey,
        isReversed: false,
        createdById: params.userId,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
      };

      const savedTx = txContext
        ? await txContext.getTransactionRepo().create(transaction)
        : await this.txRepo.createForCompany(params.companyId, transaction);

      await AuditLogger.logAction(
        params.companyId,
        'FinancialTransaction',
        savedTx.id,
        AuditAction.CREATE,
        params.userId,
        params.userName,
        null,
        savedTx,
        txContext
      );
      return savedTx;
    } catch (error) {
      if (!txContext) {
        await this.accountRepo.updateBalanceForCompany(params.companyId, params.sourceAccountId, params.amount);
        await this.accountRepo.updateBalanceForCompany(params.companyId, params.destinationAccountId, -params.amount);
      }
      throw error;
    }
  }
}
''')

          replace(
