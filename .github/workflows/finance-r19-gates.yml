          server_old = """  app.post('/api/finance/transfers', async (req: Request, res: Response) => {\n    const principal = requireFinancePrincipal(req, res);\n    if (!principal) return;\n\n    try {\n      const item = await UnitOfWork.run(\n        principal.companyId,\n        async (txContext) =>\n          await TransferService.transferFunds(\n            {\n              companyId: principal.companyId,\n              sourceAccountId: req.body?.sourceAccountId,\n              destinationAccountId: req.body?.destinationAccountId,\n              amount: Number(req.body?.amount),\n              transferDate: req.body?.transferDate,\n              paymentMethodId: req.body?.paymentMethodId,\n              description: typeof req.body?.description === 'string' ? req.body.description : '',\n              userId: principal.userId,\n              userName: principal.name,\n            },\n            txContext\n          ),\n        { financialPeriodLock: 'SHARED' }\n      );\n      res.status(201).json({ item });\n    } catch (error) {\n      sendFinanceCommandError(res, error);\n    }\n  });\n"""
          server_new = """  app.post('/api/finance/transfers', async (req: Request, res: Response) => {\n    const principal = requireFinancePrincipal(req, res);\n    if (!principal) return;\n\n    const sourceAccountId = typeof req.body?.sourceAccountId === 'string' ? req.body.sourceAccountId.trim() : '';\n    const destinationAccountId = typeof req.body?.destinationAccountId === 'string' ? req.body.destinationAccountId.trim() : '';\n    const amount = Number(req.body?.amount);\n    const transferDate = typeof req.body?.transferDate === 'string' ? req.body.transferDate.trim() : '';\n    const paymentMethodId = typeof req.body?.paymentMethodId === 'string' ? req.body.paymentMethodId.trim() : '';\n    const description = typeof req.body?.description === 'string' ? req.body.description.trim() : '';\n    const idempotencyKey = typeof req.body?.idempotencyKey === 'string' ? req.body.idempotencyKey.trim() : '';\n    if (!sourceAccountId || !destinationAccountId || !Number.isFinite(amount) || amount <= 0 ||\n        !transferDate || !paymentMethodId || !idempotencyKey || idempotencyKey.length > 200 || description.length > 1000) {\n      res.status(400).json({ error: 'Invalid financial transfer request' });\n      return;\n    }\n\n    try {\n      const item = await UnitOfWork.run(\n        principal.companyId,\n        async (txContext) =>\n          await TransferService.transferFunds(\n            {\n              companyId: principal.companyId,\n              sourceAccountId,\n              destinationAccountId,\n              amount,\n              transferDate,\n              paymentMethodId,\n              description,\n              idempotencyKey,\n              userId: principal.userId,\n              userName: principal.name,\n            },\n            txContext\n          ),\n        { financialPeriodLock: 'SHARED' }\n      );\n      res.status(201).json({ item });\n    } catch (error) {\n      sendFinanceCommandError(res, error);\n    }\n  });\n"""
          replace('server.ts', server_old, server_new)

          # Client regression: require the logical transfer key at the browser/server contract.
          replace(
