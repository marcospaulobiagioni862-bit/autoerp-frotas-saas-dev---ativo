name: FINANCE-R22 Patch Diagnostic

on:
  push:
    branches:
      - finance-r22-deposit-receipt-idempotency

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finance-r22-deposit-receipt-idempotency
      - name: Report patch anchor counts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          movement_interface=$(grep -Fc "export interface ITransactionSecurityDepositMovementRepository {" src/domain/finance/ITransactionContext.ts || true)
          movement_create=$(grep -Fc "async create(item: SecurityDepositMovement)" src/db/repositories/postgresRepositories.ts || true)
          public_signature=$(grep -Fc "txContext?: ITransactionContext" src/domain/finance/DepositService.ts || true)
          private_signature=$(grep -Fc "txContext: ITransactionContext" src/domain/finance/DepositService.ts || true)
          contract_repo=$(grep -Fc "const contractRepo = txContext.getContractRepo();" src/domain/finance/DepositService.ts || true)
          new_received=$(grep -Fc "const newReceived = roundCurrency(deposit.receivedAmount + amount);" src/domain/finance/DepositService.ts || true)
          account_find=$(grep -Fc "const account = await accountRepo.findById(financialAccountId);" src/domain/finance/DepositService.ts || true)
          deposit_description=$(grep -Fc 'description: `Recebimento de Caução (Contrato: ${contractId})`' src/domain/finance/DepositService.ts || true)
          created_now=$(grep -Fc "createdById: userId," src/domain/finance/DepositService.ts || true)
          server_payment=$(grep -Fc "const paymentMethodId = typeof req.body?.paymentMethodId === 'string' ? req.body.paymentMethodId.trim() : '';" server.ts || true)
          server_principal=$(grep -Fc "principal.name," server.ts || true)
          ui_import=$(grep -Fc "import { FinanceDepositClient } from '../../api/financeDepositClient';" src/components/contracts/ContractDetailsModal.tsx || true)
          ui_amount=$(grep -Fc "onChange={(event) => setDepositAmount(event.target.value)}" src/components/contracts/ContractDetailsModal.tsx || true)
          body="R22 PATCH DIAGNOSTIC | commit=$GITHUB_SHA | movement_interface=$movement_interface movement_create=$movement_create public_signature=$public_signature private_signature=$private_signature contract_repo=$contract_repo new_received=$new_received account_find=$account_find deposit_description=$deposit_description createdById_total=$created_now server_payment=$server_payment server_principal_total=$server_principal ui_import=$ui_import ui_amount=$ui_amount"
          gh issue comment 226 --repo "$GITHUB_REPOSITORY" --body "$body"
