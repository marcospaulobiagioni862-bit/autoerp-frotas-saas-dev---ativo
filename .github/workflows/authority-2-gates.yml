name: AUTHORITY-2 Gates

on:
  push:
    branches:
      - authority-2-explicit-runtime-server-read-model
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoerp_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      USE_PGLITE: "false"
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_HOST: 127.0.0.1
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/autoerp_phase1_test
      RECURRING_SCHEDULER_ENABLED: "false"
      JWT_SECRET: authority-2-test-jwt-secret-that-is-long-enough
      JWT_ISSUER: autoerp-authority-2-test
      JWT_AUDIENCE: autoerp-authority-2-test-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report gate start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 189 --repo "$GITHUB_REPOSITORY" --body "AUTHORITY-2 GATES START | commit=$GITHUB_SHA | run_id=$GITHUB_RUN_ID | run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false
      - name: AUTHORITY-2 explicit runtime source invariant
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/App.tsx
            src/components/dashboard/OverviewDashboard.tsx
            src/components/dashboard/PerformanceMetricsWidget.tsx
            src/components/operations/PendingCenterView.tsx
            src/components/operations/DailyOperationsView.tsx
            src/components/rental/RentalLifecycleView.tsx
            src/components/operations/RentalControlCenterView.tsx
            src/components/reports/ManagementReportsView.tsx
          )
          for file in "${files[@]}"; do
            if grep -q 'persistence/repositories/localRepositories' "$file"; then
              echo "FAIL: legacy repository alias remains in $file"
              exit 1
            fi
            grep -q 'serverReadModelRepositories' "$file"
          done
          ! grep -qE 'seedAutoERPTestData|persistence/seed/seedData|handleResetSeedData' src/App.tsx
          grep -q 'serverOperationalPendingProjection' src/App.tsx
          grep -q 'serverOperationalPendingProjection' src/components/dashboard/OverviewDashboard.tsx
          grep -q 'serverOperationalPendingProjection' src/components/operations/PendingCenterView.tsx
          grep -q 'companyId: companyIdSnapshot' src/components/dashboard/OverviewDashboard.tsx
          test ! -e .github/workflows/authority-2-source-refactor.yml
          echo 'AUTHORITY-2 explicit runtime source invariant: PASS'
      - name: SECURITY-2N runtime read-model regression
        run: npx tsx src/server/__tests__/runtimeReadModelAuthority.ts
      - name: SECURITY-2P source trust-boundary regression
        run: npx tsx src/server/__tests__/productionTrustBoundary.ts
      - name: Apply migrations 0000 through 0022
        run: node migrate_test_db.cjs
      - name: AUTHORITY-1 detail authority regression
        run: npx tsx src/server/__tests__/detailAuthorityIntegration.ts
      - name: Finance obligation client regression
        run: npx tsx src/api/__tests__/financeObligationClientTestRunner.ts
      - name: Finance overview client regression
        run: npx tsx src/api/__tests__/financeOverviewClientTestRunner.ts
      - name: Finance transaction client regression
        run: npx tsx src/api/__tests__/financeTransactionClientTestRunner.ts
      - name: Maintenance and vehicle/KM regression
        run: npx tsx src/server/__tests__/maintenanceAuthorityIntegration.ts
      - name: Traffic ticket regression
        run: npx tsx src/server/__tests__/trafficTicketAuthorityIntegration.ts
      - name: Insurance regression
        run: npx tsx src/server/__tests__/insuranceAuthorityIntegration.ts
      - name: Tracker regression
        run: npx tsx src/server/__tests__/trackerAuthorityIntegration.ts
      - name: Driver authority regression
        run: npx tsx src/server/__tests__/driverAuthorityIntegration.ts
      - name: Document authority regression
        run: npx tsx src/server/__tests__/documentAuthorityIntegration.ts
      - name: Contract authority regression
        run: npx tsx src/server/__tests__/contractAuthorityIntegration.ts
      - name: Authentication regression
        run: npx tsx src/server/__tests__/authTestRunner.ts
      - name: Session login regression
        run: npx tsx src/server/__tests__/sessionLoginTestRunner.ts
      - name: TypeScript gate
        run: npm run lint
      - name: Production build gate
        run: npm run build
      - name: Production bundle authority guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIl 'AutoERP_DB' dist/assets >/tmp/authority2_bundle_hits.txt; then
            echo 'FAIL: legacy browser database marker found in production bundle'
            cat /tmp/authority2_bundle_hits.txt
            exit 1
          fi
          echo 'AUTHORITY-2 production bundle authority guard: PASS'
      - name: Report gate success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 189 --repo "$GITHUB_REPOSITORY" --body "AUTHORITY-2 GATES PASS | commit=$GITHUB_SHA | run_id=$GITHUB_RUN_ID | run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Report gate failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 189 --repo "$GITHUB_REPOSITORY" --body "AUTHORITY-2 GATES FAIL | commit=$GITHUB_SHA | run_id=$GITHUB_RUN_ID | run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
