name: SECURITY-2G6 implementation gate

on:
  pull_request:
    branches:
      - ci-implement-security-2g6

permissions:
  contents: write
  pull-requests: read

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production candidate
        uses: actions/checkout@v4
        with:
          ref: security-2g6-renegotiation-server-authority
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout CI control
        uses: actions/checkout@v4
        with:
          ref: ci-implement-security-2g6
          path: .ci-control
          sparse-checkout: |
            ci/security-2g6-apply.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Apply controlled G6 patch
        run: python .ci-control/ci/security-2g6-apply.py
      - name: Scope gate
        shell: bash
        run: |
          {
            git diff --name-only origin/main
            git ls-files --others --exclude-standard | grep -v '^.ci-control/' || true
          } | sort -u > /tmp/changed.txt
          cat >/tmp/expected.txt <<'EOF'
          server.ts
          src/api/__tests__/financeRenegotiationClientTestRunner.ts
          src/api/financeRenegotiationClient.ts
          src/components/modals/RenegotiationModal.tsx
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          ! grep -Eq 'FinanceEngine|useAuth' src/components/modals/RenegotiationModal.tsx
          grep -F "credentials: 'include'" src/api/financeRenegotiationClient.ts >/dev/null
          ! grep -Eq 'companyId[[:space:]]*:|userId[[:space:]]*:|userName[[:space:]]*:' src/api/financeRenegotiationClient.ts
          grep -F "app.post('/api/finance/receivables/renegotiate'" server.ts >/dev/null
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Renegotiation client tests
        run: npx tsx src/api/__tests__/financeRenegotiationClientTestRunner.ts
      - name: Diff safety
        run: git diff --check
      - name: Publish validated patch
        shell: bash
        run: |
          git config user.name "chatgpt-codex-connector"
          git config user.email "noreply@openai.com"
          git add server.ts src/components/modals/RenegotiationModal.tsx
          git diff --cached --check
          git commit -m "feat(security): move receivable renegotiation to server authority"
          git push origin HEAD:security-2g6-renegotiation-server-authority
