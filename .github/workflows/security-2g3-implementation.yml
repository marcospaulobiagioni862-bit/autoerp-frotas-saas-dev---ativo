          test_runner = r'''import { FinanceObligationApiError, FinanceObligationClient } from '../financeObligationClient';

function assert(condition: unknown, message: string): asserts condition {
  if (!condition) throw new Error(message);
}

const originalFetch = globalThis.fetch;
let calls: Array<{ url: string; init?: RequestInit }> = [];
let responder: (url: string, init?: RequestInit) => Promise<Response>;

globalThis.fetch = async (input: string | URL | Request, init?: RequestInit) => {
  const url = typeof input === 'string' ? input : input instanceof URL ? input.toString() : input.url;
  calls.push({ url, init });
  return await responder(url, init);
};

const financeRow = {
  id: 'ar-1', companyId: 'tenant-a', originType: 'MANUAL', originId: 'origin-1',
  categoryId: 'cat-1', description: 'Teste', originalAmount: '100.50', discountAmount: '0',
  fineAmount: '0', interestAmount: '0', updatedAmount: '100.50', paidAmount: '0',
  balanceAmount: '100.50', dueDate: '2026-08-20T00:00:00.000Z', competenceDate: '2026-08-18T00:00:00.000Z',
  status: 'PENDING', idempotencyKey: 'idem-1'
};

async function run() {
  let passed = 0;
  try {
    responder = async () => new Response(JSON.stringify({ items: [financeRow] }), { status: 200, headers: { 'Content-Type': 'application/json' } });
    calls = [];
    const receivables = await FinanceObligationClient.listReceivables();
    assert(calls[0].url === '/api/finance/receivables', 'list receivables URL');
    assert(calls[0].init?.credentials === 'include', 'list receivables credentials');
    assert(receivables[0].originalAmount === 100.5, 'receivable numeric normalization');
    assert(receivables[0].dueDate === '2026-08-20', 'receivable date normalization');
    passed++;

    responder = async () => new Response(JSON.stringify({ items: [financeRow] }), { status: 201, headers: { 'Content-Type': 'application/json' } });
    calls = [];
    await FinanceObligationClient.createReceivable({ originType: 'MANUAL', originId: 'o', categoryId: 'c', description: 'd', totalAmount: 10, dueDate: '2026-08-20' });
    const createReceivableBody = JSON.parse(String(calls[0].init?.body)) as Record<string, unknown>;
    assert(calls[0].init?.credentials === 'include', 'create receivable credentials');
    assert(!('companyId' in createReceivableBody) && !('userId' in createReceivableBody) && !('userName' in createReceivableBody), 'create receivable must not send identity');
    passed++;

    responder = async () => new Response(JSON.stringify({ item: financeRow }), { status: 200, headers: { 'Content-Type': 'application/json' } });
    calls = [];
    await FinanceObligationClient.cancelReceivable('ar/1', 'reason');
    assert(calls[0].url === '/api/finance/receivables/ar%2F1/cancel', 'cancel receivable URL encoding');
    assert(calls[0].init?.credentials === 'include', 'cancel receivable credentials');
    passed++;

    responder = async () => new Response(JSON.stringify({ items: [financeRow] }), { status: 200, headers: { 'Content-Type': 'application/json' } });
    calls = [];
    const payables = await FinanceObligationClient.listPayables();
    assert(calls[0].url === '/api/finance/payables', 'list payables URL');
    assert(payables[0].balanceAmount === 100.5, 'payable numeric normalization');
    passed++;

    responder = async () => new Response(JSON.stringify({ items: [financeRow] }), { status: 201, headers: { 'Content-Type': 'application/json' } });
    calls = [];
    await FinanceObligationClient.createPayable({ originType: 'MANUAL', originId: 'o', categoryId: 'c', description: 'd', totalAmount: 10, dueDate: '2026-08-20' });
    const createPayableBody = JSON.parse(String(calls[0].init?.body)) as Record<string, unknown>;
    assert(!('companyId' in createPayableBody) && !('userId' in createPayableBody) && !('userName' in createPayableBody), 'create payable must not send identity');
    passed++;

    responder = async () => new Response(JSON.stringify({ item: financeRow }), { status: 200, headers: { 'Content-Type': 'application/json' } });
    calls = [];
    await FinanceObligationClient.cancelPayable('ap-1', 'reason');
    assert(calls[0].url === '/api/finance/payables/ap-1/cancel', 'cancel payable URL');
    assert(calls[0].init?.credentials === 'include', 'cancel payable credentials');
    passed++;

    responder = async () => new Response(JSON.stringify({ error: 'Unauthorized' }), { status: 401, headers: { 'Content-Type': 'application/json' } });
    let failedClosed = false;
    try {
      await FinanceObligationClient.listReceivables();
    } catch (error) {
      failedClosed = error instanceof FinanceObligationApiError && error.status === 401;
    }
    assert(failedClosed, '401 must fail closed without fallback');
    passed++;

    console.log(`FinanceObligationClient ${passed}/7 PASS`);
  } finally {
    globalThis.fetch = originalFetch;
  }
}

run().catch((error) => {
  console.error(error);
  process.exit(1);
});
