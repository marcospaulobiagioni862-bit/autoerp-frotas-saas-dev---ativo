name: SECURITY-2G3 implementation gate

on:
  push:
    branches:
      - ci-implement-security-2g3
  pull_request:
    branches:
      - ci-implement-security-2g3

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production candidate
        uses: actions/checkout@v4
        with:
          ref: security-2g3-finance-server-authority
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout CI control files
        uses: actions/checkout@v4
        with:
          ref: ci-implement-security-2g3
          path: .ci-control
          sparse-checkout: |
            ci/security-2g3-apply.py
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Apply exact SECURITY-2G3 patch
        run: python .ci-control/ci/security-2g3-apply.py

      - name: Scope gate
        shell: bash
        run: |
          git diff --name-only | sort > /tmp/changed.txt
          cat >/tmp/expected.txt <<'EOF'
          server.ts
          src/api/__tests__/financeObligationClientTestRunner.ts
          src/api/financeObligationClient.ts
          src/components/finance/PayablesView.tsx
          src/components/finance/ReceivablesView.tsx
          src/domain/finance/ITransactionContext.ts
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          ! grep -Eq "localRepositories|FinanceEngine|useAuth" src/components/finance/ReceivablesView.tsx
          ! grep -Eq "localRepositories|FinanceEngine|useAuth" src/components/finance/PayablesView.tsx
          grep -q "credentials: 'include'" src/api/financeObligationClient.ts
          grep -q "app.get('/api/finance/receivables'" server.ts
          grep -q "app.get('/api/finance/payables'" server.ts

      - name: Lint and typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Explicit tsc
        run: npx tsc --noEmit

      - name: Finance obligation client tests
        run: npx tsx src/api/__tests__/financeObligationClientTestRunner.ts

      - name: Diff safety
        run: git diff --check

      - name: Commit validated production candidate
        shell: bash
        run: |
          git config user.name "chatgpt-codex-connector"
          git config user.email "noreply@openai.com"
          git add server.ts src/domain/finance/ITransactionContext.ts src/api/financeObligationClient.ts src/api/__tests__/financeObligationClientTestRunner.ts src/components/finance/ReceivablesView.tsx src/components/finance/PayablesView.tsx
          git diff --cached --check
          git commit -m "feat(security): move CR/AP frontend to server authority"
          git push origin HEAD:security-2g3-finance-server-authority
