          new = """      const item = payables.find((p) => p.id === cancelTargetId);\n      if (!item) {\n        alert('Título a pagar não encontrado na lista atual.');\n        setCancelTargetId(null);\n        return;\n      }\n      await FinanceObligationClient.cancelPayable(\n        cancelTargetId,\n        'Cancelamento manual via interface'\n      );\n"""
