name: AUTHORITY-1 Gates

on:
  push:
    branches:
      - authority-1-detail-views-server-authority
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  authority2_source_refactor:
    if: github.event_name == 'pull_request' && github.head_ref == 'authority-2-explicit-runtime-server-read-model'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: authority-2-explicit-runtime-server-read-model
          fetch-depth: 0
      - name: Apply AUTHORITY-2 scoped source refactor and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          runtime_files = [
              Path('src/components/dashboard/OverviewDashboard.tsx'),
              Path('src/components/dashboard/PerformanceMetricsWidget.tsx'),
              Path('src/components/operations/PendingCenterView.tsx'),
              Path('src/components/operations/DailyOperationsView.tsx'),
              Path('src/components/rental/RentalLifecycleView.tsx'),
              Path('src/components/operations/RentalControlCenterView.tsx'),
              Path('src/components/reports/ManagementReportsView.tsx'),
          ]
          for path in runtime_files:
              path.write_text(path.read_text().replace(
                  'persistence/repositories/localRepositories',
                  'persistence/repositories/serverReadModelRepositories',
              ))

          overview = Path('src/components/dashboard/OverviewDashboard.tsx')
          text = overview.read_text().replace(
              '../../domain/operations/OperationalPendingService',
              '../../domain/operations/serverOperationalPendingProjection',
          )
          marker = 'const opPendings = generateOperationalPendings({\n        vehicles: vehs,'
          replacement = 'const opPendings = generateOperationalPendings({\n        companyId: companyIdSnapshot,\n        vehicles: vehs,'
          if marker not in text and replacement not in text:
              raise SystemExit('Overview pending projection marker not found')
          overview.write_text(text.replace(marker, replacement))

          pending = Path('src/components/operations/PendingCenterView.tsx')
          pending.write_text(pending.read_text().replace(
              '../../domain/operations/OperationalPendingService',
              '../../domain/operations/serverOperationalPendingProjection',
          ))

          test = Path('src/server/__tests__/runtimeReadModelAuthority.ts')
          text = test.read_text()
          old = """for (const path of migratedRuntimeFiles) {\n  const source = read(path);\n  assert.doesNotMatch(source, /StorageAdapter|indexedDB|localStorage/i, `${path} must not directly access browser persistence`);\n}\n"""
          new = """for (const path of migratedRuntimeFiles) {\n  const source = read(path);\n  assert.doesNotMatch(source, /StorageAdapter|indexedDB|localStorage/i, `${path} must not directly access browser persistence`);\n  assert.doesNotMatch(source, /persistence\\/repositories\\/localRepositories/, `${path} must not depend on the legacy repository alias`);\n  assert.match(source, /serverReadModelRepositories/, `${path} must import the explicit authenticated server read-model adapter`);\n}\n\nconst appSource = read('src/App.tsx');\nassert.doesNotMatch(appSource, /persistence\\/seed\\/seedData|seedAutoERPTestData|handleResetSeedData/, 'App runtime must not depend on browser seed/reset authority');\nassert.match(appSource, /domain\\/operations\\/serverOperationalPendingProjection/, 'App must import the tenant-safe pending projection explicitly');\nconst overviewSource = read('src/components/dashboard/OverviewDashboard.tsx');\nassert.match(overviewSource, /domain\\/operations\\/serverOperationalPendingProjection/, 'Overview must import the tenant-safe pending projection explicitly');\nassert.match(overviewSource, /companyId:\\s*companyIdSnapshot/, 'Overview must pass the authenticated company snapshot into the pending projection');\nconst pendingSource = read('src/components/operations/PendingCenterView.tsx');\nassert.match(pendingSource, /domain\\/operations\\/serverOperationalPendingProjection/, 'Pending center must import the tenant-safe pending projection explicitly');\n"""
          if old not in text:
              raise SystemExit('runtimeReadModelAuthority loop marker not found')
          test.write_text(text.replace(old, new))
          PY

          runtime=(
            src/App.tsx
            src/components/dashboard/OverviewDashboard.tsx
            src/components/dashboard/PerformanceMetricsWidget.tsx
            src/components/operations/PendingCenterView.tsx
            src/components/operations/DailyOperationsView.tsx
            src/components/rental/RentalLifecycleView.tsx
            src/components/operations/RentalControlCenterView.tsx
            src/components/reports/ManagementReportsView.tsx
          )
          for file in "${runtime[@]}"; do
            ! grep -q 'persistence/repositories/localRepositories' "$file"
            grep -q 'serverReadModelRepositories' "$file"
          done
          ! grep -qE 'seedAutoERPTestData|persistence/seed/seedData|handleResetSeedData' src/App.tsx
          grep -q 'serverOperationalPendingProjection' src/App.tsx
          grep -q 'serverOperationalPendingProjection' src/components/dashboard/OverviewDashboard.tsx
          grep -q 'serverOperationalPendingProjection' src/components/operations/PendingCenterView.tsx
          grep -q 'companyId: companyIdSnapshot' src/components/dashboard/OverviewDashboard.tsx

          git show origin/main:.github/workflows/authority-1-gates.yml > .github/workflows/authority-1-gates.yml
          rm -f .github/workflows/authority-2-source-refactor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/authority-1-gates.yml \
            .github/workflows/authority-2-source-refactor.yml \
            src/components/dashboard/OverviewDashboard.tsx \
            src/components/operations/PendingCenterView.tsx \
            src/components/operations/DailyOperationsView.tsx \
            src/components/rental/RentalLifecycleView.tsx \
            src/components/operations/RentalControlCenterView.tsx \
            src/components/reports/ManagementReportsView.tsx \
            src/server/__tests__/runtimeReadModelAuthority.ts
          git commit -m 'AUTHORITY-2: complete explicit runtime source refactor'
          git push origin HEAD:authority-2-explicit-runtime-server-read-model

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoerp_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      USE_PGLITE: "false"
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_HOST: 127.0.0.1
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/autoerp_phase1_test
      RECURRING_SCHEDULER_ENABLED: "false"
      JWT_SECRET: authority-1-test-jwt-secret-that-is-long-enough
      JWT_ISSUER: autoerp-authority-1-test
      JWT_AUDIENCE: autoerp-authority-1-test-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report gate start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 187 --repo "$GITHUB_REPOSITORY" --body "AUTHORITY-1 GATES START | commit=$GITHUB_SHA | run_id=$GITHUB_RUN_ID | run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false
      - name: AUTHORITY-1 detail trust-boundary invariant
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            src/components/drivers/DriverLegacyDetailsBridge.ts
            src/components/contracts/ContractLegacyDetailsBridge.ts
            src/domain/services/VehicleLegacyDetailsBridge.ts
          )
          for file in "${FILES[@]}"; do
            if grep -q "persistence/repositories/localRepositories" "$file"; then
              echo "FAIL: localRepositories authority remains in $file"
              exit 1
            fi
          done
          grep -q "DetailAuthorityClient" src/components/drivers/DriverLegacyDetailsBridge.ts
          grep -q "DetailAuthorityClient" src/components/contracts/ContractLegacyDetailsBridge.ts
          grep -q "DriverClient" src/domain/services/VehicleLegacyDetailsBridge.ts
          grep -q "ContractClient" src/domain/services/VehicleLegacyDetailsBridge.ts
          grep -q "DocumentClient" src/domain/services/VehicleLegacyDetailsBridge.ts
          grep -q "FinanceObligationClient" src/domain/services/VehicleLegacyDetailsBridge.ts
          grep -q "registerDetailAuthorityRoutes(app)" src/server/recurringRoutes.ts
          grep -q "authority_1_communication_tenant" drizzle/0022_detail_view_authority.sql
          echo "AUTHORITY-1 detail trust-boundary invariant: PASS"
      - name: SECURITY-2P source trust-boundary regression
        run: npx tsx src/server/__tests__/productionTrustBoundary.ts
      - name: Apply migrations 0000 through 0022
        run: node migrate_test_db.cjs
      - name: AUTHORITY-1 detail authority integration
        run: npx tsx src/server/__tests__/detailAuthorityIntegration.ts
      - name: Finance obligation client regression
        run: npx tsx src/api/__tests__/financeObligationClientTestRunner.ts
      - name: Maintenance and vehicle/KM regression
        run: npx tsx src/server/__tests__/maintenanceAuthorityIntegration.ts
      - name: Traffic ticket regression
        run: npx tsx src/server/__tests__/trafficTicketAuthorityIntegration.ts
      - name: Insurance regression
        run: npx tsx src/server/__tests__/insuranceAuthorityIntegration.ts
      - name: Tracker regression
        run: npx tsx src/server/__tests__/trackerAuthorityIntegration.ts
      - name: Driver authority regression
        run: npx tsx src/server/__tests__/driverAuthorityIntegration.ts
      - name: Document authority regression
        run: npx tsx src/server/__tests__/documentAuthorityIntegration.ts
      - name: Contract authority regression
        run: npx tsx src/server/__tests__/contractAuthorityIntegration.ts
      - name: Authentication regression
        run: npx tsx src/server/__tests__/authTestRunner.ts
      - name: Session login regression
        run: npx tsx src/server/__tests__/sessionLoginTestRunner.ts
      - name: TypeScript gate
        run: npm run lint
      - name: Production build gate
        run: npm run build
      - name: Production bundle legacy-authority guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIl "AutoERP_DB" dist/assets >/tmp/authority1_bundle_hits.txt; then
            echo "FAIL: legacy browser database marker found in production bundle"
            cat /tmp/authority1_bundle_hits.txt
            exit 1
          fi
          echo "AUTHORITY-1 production bundle legacy-authority guard: PASS"
      - name: Report gate success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 187 --repo "$GITHUB_REPOSITORY" --body "AUTHORITY-1 GATES PASS | commit=$GITHUB_SHA | run_id=$GITHUB_RUN_ID | run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Report gate failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 187 --repo "$GITHUB_REPOSITORY" --body "AUTHORITY-1 GATES FAIL | commit=$GITHUB_SHA | run_id=$GITHUB_RUN_ID | run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
