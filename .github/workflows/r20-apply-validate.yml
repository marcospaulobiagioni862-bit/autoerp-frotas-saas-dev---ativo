name: FINANCE-R20 Isolated Apply Validate

on:
  push:
    branches:
      - finance-r20-cancellation-metadata
    paths:
      - .github/workflows/r20-apply-validate.yml
      - .github/r20_apply_v2.py

permissions:
  contents: write
  issues: write

jobs:
  apply-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoerp_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      USE_PGLITE: "false"
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_HOST: 127.0.0.1
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/autoerp_phase1_test
      RECURRING_SCHEDULER_ENABLED: "false"
      JWT_SECRET: finance-r20-test-secret-that-is-long-enough
      JWT_ISSUER: autoerp-finance-r20
      JWT_AUDIENCE: autoerp-finance-r20-client

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Report apply start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 224 --repo "$GITHUB_REPOSITORY" --body "FINANCE-R20 APPLY V3 START | run_id=$GITHUB_RUN_ID | commit=$GITHUB_SHA"

      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false

      - name: Apply exact R20 patch
        run: python3 .github/r20_apply_v2.py

      - name: Scope gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          expected="$(printf '%s\n' server.ts src/domain/finance/PayableService.ts src/domain/finance/ReceivableService.ts src/server/__tests__/financeCancellationMetadataIntegration.ts | sort)"
          test "$changed" = "$expected"
          echo "FINANCE-R20 scope gate: 4/4 expected files"

      - name: Server cancellation boundary invariant
        shell: bash
        run: |
          set -euo pipefail
          grep -F "Invalid receivable cancellation request" server.ts
          grep -F "Invalid payable cancellation request" server.ts
          test "$(grep -F -c "const reason = typeof req.body?.reason === 'string' ? req.body.reason.trim() : '';" server.ts)" -ge 2

      - name: TypeScript gate
        run: npm run lint

      - name: Apply migrations
        run: node migrate_test_db.cjs

      - name: FINANCE-R20 PostgreSQL regression
        run: npx tsx src/server/__tests__/financeCancellationMetadataIntegration.ts

      - name: FINANCE-R21 settlement regression
        run: npx tsx src/server/__tests__/financeSettlementConcurrencyIntegration.ts

      - name: FINANCE-R19 transfer regression
        run: npx tsx src/server/__tests__/financeTransferConcurrencyIntegration.ts

      - name: Production build gate
        run: npm run build

      - name: Commit exact validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- server.ts src/domain/finance/PayableService.ts src/domain/finance/ReceivableService.ts src/server/__tests__/financeCancellationMetadataIntegration.ts
          git diff --cached --check
          git commit -m "FINANCE-R20 persist cancellation reason and timestamp"
          git push origin HEAD:finance-r20-cancellation-metadata

      - name: Report apply success
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 224 --repo "$GITHUB_REPOSITORY" --body "FINANCE-R20 APPLY V3 PASS | run_id=$GITHUB_RUN_ID"

      - name: Report apply failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 224 --repo "$GITHUB_REPOSITORY" --body "FINANCE-R20 APPLY V3 FAIL | run_id=$GITHUB_RUN_ID"
