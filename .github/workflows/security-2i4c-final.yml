name: SECURITY-2I4C final independent validation

on:
  pull_request:
    branches:
      - ci-validate-security-2i4c-final

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoerp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d autoerp_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoerp_ci
      NODE_ENV: test
      ALLOW_MOCK_AUTH: 'true'
      ATTACHMENT_STORAGE_DIR: /tmp/autoerp-i4c-final-attachments
    steps:
      - name: Checkout exact consolidated candidate
        uses: actions/checkout@v4
        with:
          ref: 2288ee011415f69f011f6b21fb16db96d1e24196
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run independent final validation
        run: |
          git show origin/ci-validate-security-2i4c-final:.ci/security-2i4c-final-validation.sh > /tmp/i4c-final.sh
          chmod +x /tmp/i4c-final.sh
          /tmp/i4c-final.sh
