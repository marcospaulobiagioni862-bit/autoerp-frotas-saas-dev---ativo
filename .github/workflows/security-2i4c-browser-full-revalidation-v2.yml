name: SECURITY-2I4C full browser revalidation v2

on:
  pull_request:
    branches:
      - ci-validate-security-2i4c-browser

permissions:
  contents: read

jobs:
  browser-full-flow-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoerp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d autoerp_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoerp_ci
      NODE_ENV: test
      ALLOW_MOCK_AUTH: 'true'
      ATTACHMENT_STORAGE_DIR: /tmp/autoerp-i4c-browser-attachments
      CANDIDATE_SHA: 3dd1f1a14973defb8b352e707bad3e14ab8b7e83
      CANDIDATE_TREE: a165a21d66f6c2e7500880f6e857272a0ebd2080
      PRODUCTION_BASE: 68b2ab0315bfb9e77cacb760b8f1bffdb4034357
      PRIOR_CANDIDATE: 2288ee011415f69f011f6b21fb16db96d1e24196
      BROWSER_COMPANY_ID: browser-i4c-company
      BROWSER_USER_ID: browser-i4c-admin
    steps:
      - name: Checkout exact corrected candidate
        uses: actions/checkout@v4
        with:
          ref: 3dd1f1a14973defb8b352e707bad3e14ab8b7e83
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Candidate identity and lineage
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git rev-parse HEAD^)" = "$PRIOR_CANDIDATE"
          git merge-base --is-ancestor "$PRODUCTION_BASE" HEAD
          test -z "$(git status --porcelain)"

      - name: Install application and browser driver only
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
          command -v google-chrome
          npm run lint
          npm run build
          test -z "$(git status --porcelain)"

      - name: Apply migrations and seed principal
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for file in $(find drizzle -maxdepth 1 -name '*.sql' | sort); do
            psql -h localhost -U postgres -d autoerp_ci -v ON_ERROR_STOP=1 -f "$file" >/dev/null
          done
          psql -h localhost -U postgres -d autoerp_ci -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO companies (id, document, name, status, created_at, updated_at)
          VALUES ('browser-i4c-company', 'BROWSER-I4C', 'Browser I4C Company', 'ACTIVE', NOW(), NOW())
          ON CONFLICT (id) DO UPDATE SET document=EXCLUDED.document, name=EXCLUDED.name, status='ACTIVE', updated_at=NOW();
          INSERT INTO users (id, company_id, name, email, role, active, created_at, updated_at)
          VALUES ('browser-i4c-admin', 'browser-i4c-company', 'Browser I4C Admin', 'browser-i4c-admin@example.test', 'ADMIN', true, NOW(), NOW())
          ON CONFLICT (id) DO UPDATE SET company_id=EXCLUDED.company_id, name=EXCLUDED.name, email=EXCLUDED.email, role='ADMIN', active=true, updated_at=NOW();
          SQL

      - name: Start exact corrected candidate server
        run: |
          set -euo pipefail
          rm -rf "$ATTACHMENT_STORAGE_DIR" /tmp/i4c-browser
          mkdir -p "$ATTACHMENT_STORAGE_DIR" /tmp/i4c-browser
          nohup npm run dev > /tmp/i4c-browser/server.log 2>&1 &
          echo $! > /tmp/i4c-browser/server.pid
          for i in $(seq 1 90); do
            if curl -fsS -H "x-company-id: $BROWSER_COMPANY_ID" -H "x-user-id: $BROWSER_USER_ID" http://127.0.0.1:3000/api/auth/me >/tmp/i4c-browser/auth-me.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/i4c-browser/server.log
          exit 1

      - name: Seed vehicle and driver through authoritative APIs
        run: |
          set -euo pipefail
          curl -fsS -X POST http://127.0.0.1:3000/api/fleet/vehicles \
            -H "x-company-id: $BROWSER_COMPANY_ID" -H "x-user-id: $BROWSER_USER_ID" -H 'content-type: application/json' \
            --data '{"plate":"BRW1A01","renavam":"BRW-RENAVAM-001","brand":"Toyota","model":"Yaris","version":"XL","yearFabrication":2025,"yearModel":2026,"color":"Prata","chassis":"BRWCHASSIS001","currentKm":10000,"fuelType":"Flex","category":"Sedan","acquisitionValue":80000,"currentValue":70000,"rentalValueBase":800}' \
            | tee /tmp/i4c-browser/vehicle.json
          curl -fsS -X POST http://127.0.0.1:3000/api/drivers \
            -H "x-company-id: $BROWSER_COMPANY_ID" -H "x-user-id: $BROWSER_USER_ID" -H 'content-type: application/json' \
            --data '{"fullName":"Browser Driver I4C","cpf":"11144477735","birthDate":"1990-01-01","phone":"11999999999","whatsapp":"11999999999","email":"browser-driver@example.test","address":{"street":"Rua Browser","number":"100","neighborhood":"Centro","city":"São Paulo","state":"SP","zipCode":"01001000"},"cnhNumber":"02650306461","cnhCategory":"B","cnhExpiration":"2035-01-01","appPlatforms":["Uber"]}' \
            | tee /tmp/i4c-browser/driver.json
          echo "BROWSER_VEHICLE_ID=$(jq -r '.item.id' /tmp/i4c-browser/vehicle.json)" >> "$GITHUB_ENV"
          echo "BROWSER_DRIVER_ID=$(jq -r '.item.id' /tmp/i4c-browser/driver.json)" >> "$GITHUB_ENV"
          test "$(jq -r '.item.status' /tmp/i4c-browser/vehicle.json)" = "AVAILABLE"
          test "$(jq -r '.item.status' /tmp/i4c-browser/driver.json)" = "ACTIVE"

      - name: Create PDF fixtures
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { PDFDocument, StandardFonts } from 'pdf-lib';
          import { writeFile } from 'node:fs/promises';
          async function create(path, text) {
            const doc = await PDFDocument.create();
            const page = doc.addPage([595, 842]);
            const font = await doc.embedFont(StandardFonts.Helvetica);
            page.drawText(text, { x: 50, y: 780, size: 14, font });
            await writeFile(path, await doc.save());
          }
          await create('/tmp/i4c-browser/signed-browser.pdf', 'Evidencia assinada - browser runtime I4C');
          await create('/tmp/i4c-browser/generic-browser.pdf', 'Anexo generico - browser runtime I4C');
          NODE

      - name: Materialize robust full browser script
        run: |
          set -euo pipefail
          git fetch origin ci-validate-security-2i4c-browser --quiet
          git show origin/ci-validate-security-2i4c-browser:.ci/security-2i4c-browser-runtime.mjs \
            | sed "s/chromium.launch({ headless: true })/chromium.launch({ headless: true, channel: 'chrome' })/" \
            | sed "s#if (/websocket|\\\\\[vite\\\\\].*connect/i.test(text)) return;#if (/websocket|\\\\\[vite\\\\\].*connect|Failed to load resource: the server responded with a status of (404|409)/i.test(text)) return;#" \
            | sed "s#await detailsHeading.locator('xpath=../following-sibling::button').click();#await page.getByRole('button', { name: 'Fechar modal' }).click();#" \
            > .git/i4c-browser-runtime.mjs
          test -s .git/i4c-browser-runtime.mjs
          grep -F "channel: 'chrome'" .git/i4c-browser-runtime.mjs
          grep -F "name: 'Fechar modal'" .git/i4c-browser-runtime.mjs
          test -z "$(git status --porcelain)"

      - name: Full browser runtime and UX flow
        run: node .git/i4c-browser-runtime.mjs

      - name: Final immutable corrected candidate
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git rev-parse HEAD^)" = "$PRIOR_CANDIDATE"
          test -z "$(git status --porcelain)"

      - name: Upload full browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-2i4c-browser-full-revalidation-v2
          path: /tmp/i4c-browser
          if-no-files-found: warn
          retention-days: 7
