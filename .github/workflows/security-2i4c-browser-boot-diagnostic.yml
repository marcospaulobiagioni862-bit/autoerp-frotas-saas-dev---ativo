name: SECURITY-2I4C browser boot diagnostic

on:
  pull_request:
    branches:
      - ci-diagnose-security-2i4c-browser-boot

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoerp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d autoerp_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoerp_ci
      NODE_ENV: test
      ALLOW_MOCK_AUTH: 'true'
      ATTACHMENT_STORAGE_DIR: /tmp/autoerp-i4c-browser-attachments
      CANDIDATE_SHA: 2288ee011415f69f011f6b21fb16db96d1e24196
      CANDIDATE_TREE: 036909fab49f8532aa8b83cc2576b51f7d9e2004
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 2288ee011415f69f011f6b21fb16db96d1e24196
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install app and Playwright package only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          npm install --no-package-lock --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          echo "BROWSER_EXECUTABLE=$BROWSER" >> "$GITHUB_ENV"
          npm run lint
          npm run build
          test -z "$(git status --porcelain)"

      - name: Migrate DB and seed development embedded identity
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for file in $(find drizzle -maxdepth 1 -name '*.sql' | sort); do
            psql -h localhost -U postgres -d autoerp_ci -v ON_ERROR_STOP=1 -f "$file" >/dev/null
          done
          psql -h localhost -U postgres -d autoerp_ci -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO companies (id, document, name, status, created_at, updated_at)
          VALUES ('company-main-uuid', 'DEV-COMPANY', 'Development Company', 'ACTIVE', NOW(), NOW())
          ON CONFLICT (id) DO UPDATE SET status='ACTIVE', updated_at=NOW();
          INSERT INTO users (id, company_id, name, email, role, active, created_at, updated_at)
          VALUES ('user-admin-1', 'company-main-uuid', 'Admin User', 'admin@example.test', 'ADMIN', true, NOW(), NOW())
          ON CONFLICT (id) DO UPDATE SET company_id='company-main-uuid', role='ADMIN', active=true, updated_at=NOW();
          SQL

      - name: Start exact candidate server
        run: |
          set -euo pipefail
          rm -rf /tmp/i4c-boot "$ATTACHMENT_STORAGE_DIR"
          mkdir -p /tmp/i4c-boot "$ATTACHMENT_STORAGE_DIR"
          nohup npm run dev > /tmp/i4c-boot/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/i4c-boot/server.log
          exit 1

      - name: Browser boot diagnostic
        run: |
          cat > .git/i4c-boot.mjs <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const consoleMessages = [];
          const pageErrors = [];
          const responses = [];
          const browser = await chromium.launch({ headless: true, executablePath: process.env.BROWSER_EXECUTABLE, args: ['--no-sandbox','--disable-dev-shm-usage'] });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          page.on('console', m => consoleMessages.push({ type: m.type(), text: m.text() }));
          page.on('pageerror', e => pageErrors.push(String(e)));
          page.on('response', r => { if (r.status() >= 400) responses.push({ status:r.status(), method:r.request().method(), url:r.url() }); });
          await page.goto('http://127.0.0.1:3000', { waitUntil:'domcontentloaded', timeout:30000 });
          await page.waitForTimeout(7000);
          const bodyText = await page.locator('body').innerText().catch(() => '');
          const html = await page.content();
          await page.screenshot({ path:'/tmp/i4c-boot/boot.png', fullPage:true });
          const result = { url:page.url(), title:await page.title(), bodyText, consoleMessages, pageErrors, responses };
          console.log(JSON.stringify(result,null,2));
          await writeFile('/tmp/i4c-boot/result.json', JSON.stringify(result,null,2));
          await writeFile('/tmp/i4c-boot/page.html', html);
          await browser.close();
          NODE
          node .git/i4c-boot.mjs

      - name: Final candidate immutability
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test -z "$(git status --porcelain)"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-2i4c-browser-boot-diagnostic
          path: /tmp/i4c-boot
          if-no-files-found: warn
          retention-days: 7
