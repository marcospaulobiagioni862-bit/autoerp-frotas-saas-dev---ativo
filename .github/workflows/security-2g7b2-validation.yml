name: SECURITY-2G7B2 validation

on:
  pull_request:
    branches:
      - ci-validate-security-2g7b2

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoerp_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d autoerp_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Source integrity
        run: git diff --exit-code c4dd06d6a9819e5ef57a4c942feedbea91e11c46 -- . ':(exclude).github/**' ':(exclude).ci/**'

      - name: G7B2 authority static gate
        shell: bash
        run: |
          grep -F "app.get('/api/finance/reports/vehicle-profitability'" server.ts >/dev/null
          grep -F 'ProfitabilityService.getVehicleProfitability' server.ts >/dev/null
          grep -F 'UnitOfWork.run(principal.companyId' server.ts >/dev/null
          grep -F 'FinanceReportingClient.getVehicleProfitability' src/components/finance/DREReportView.tsx >/dev/null
          ! grep -F 'FinanceEngine.getVehicleProfitability' src/components/finance/DREReportView.tsx
          grep -F 'txContext.getTransactionRepo().findAll()' src/domain/finance/ProfitabilityService.ts >/dev/null
          grep -F 'txContext.getReceivableRepo().findAll()' src/domain/finance/ProfitabilityService.ts >/dev/null
          grep -F 'txContext.getPayableRepo().findAll()' src/domain/finance/ProfitabilityService.ts >/dev/null
          grep -F "credentials: 'include'" src/api/financeReportingClient.ts >/dev/null
          grep -F "const dateKey = (value?: string) => (value || '').slice(0, 10);" src/domain/finance/ProfitabilityService.ts >/dev/null
          ! grep -Eq 'companyId[[:space:]]*:|userId[[:space:]]*:|userName[[:space:]]*:' src/api/financeReportingClient.ts

      - name: Install
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit

      - name: Finance reporting and prior transport tests
        shell: bash
        run: |
          npx tsx src/api/__tests__/financeReportingClientTestRunner.ts
          npx tsx src/api/__tests__/financeOverviewClientTestRunner.ts
          npx tsx src/api/__tests__/financeObligationClientTestRunner.ts
          npx tsx src/api/__tests__/financeSettlementClientTestRunner.ts
          npx tsx src/api/__tests__/financeTransactionClientTestRunner.ts
          npx tsx src/api/__tests__/financeRenegotiationClientTestRunner.ts

      - name: Seed real PostgreSQL
        env:
          ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/autoerp_ci
        shell: bash
        run: |
          mkdir -p .ci-tmp
          cat > .ci-tmp/g7b2-seed.ts <<'EOF'
          import fs from 'node:fs';
          import { Pool } from 'pg';
          import { hashPassword } from '../src/server/password';
          const p=new Pool({connectionString:process.env.ADMIN_DATABASE_URL!});
          async function main(){
            for(const f of [
              'drizzle/0000_milky_invisible_woman.sql',
              'drizzle/0001_rls_and_audit.sql',
              'drizzle/0002_phase1_final_hardening.sql',
              'drizzle/0003_auth_credentials.sql',
              'drizzle/0004_payment_methods_rls_permissive.sql',
              'drizzle/0005_financial_periods_rls_permissive.sql'
            ]) await p.query(fs.readFileSync(f,'utf8'));

            await p.query(`INSERT INTO companies(id,document,name,status) VALUES
              ('company-g7b2-a','91919191000191','Tenant G7B2 A','ACTIVE'),
              ('company-g7b2-b','92929292000192','Tenant G7B2 B','ACTIVE')`);
            await p.query(`INSERT INTO users(id,company_id,name,email,role,active,permissions) VALUES
              ('g7b2-admin-a','company-g7b2-a','Admin G7B2 A','admin-a@g7b2.test','ADMIN',true,ARRAY['*']),
              ('g7b2-admin-b','company-g7b2-b','Admin G7B2 B','admin-b@g7b2.test','ADMIN',true,ARRAY['*'])`);
            const [ha,hb]=await Promise.all(['StrongPass123!','StrongPass123!'].map(hashPassword));
            await p.query(`INSERT INTO user_credentials(company_id,user_id,password_hash) VALUES ($1,$2,$3),($4,$5,$6)`,['company-g7b2-a','g7b2-admin-a',ha,'company-g7b2-b','g7b2-admin-b',hb]);

            await p.query(`INSERT INTO account_receivables(id,company_id,origin_type,origin_id,vehicle_id,category_id,description,original_amount,updated_amount,balance_amount,due_date,competence_date,status) VALUES
              ('g7b2-ar-rent-a','company-g7b2-a','CONTRACT_RENT','rent-a','veh-a','cat-income','Aluguel A','1000.00','1000.00','1000.00','2026-09-10','2026-09-10','PENDING'),
              ('g7b2-ar-rent-end-a','company-g7b2-a','CONTRACT_RENT','rent-end-a','veh-a','cat-income','Aluguel ultimo dia A','200.00','200.00','200.00','2026-09-30','2026-09-30','PENDING'),
              ('g7b2-ar-km-a','company-g7b2-a','KM_EXCESS','km-a','veh-a','cat-income','Excesso KM A','150.00','150.00','150.00','2026-09-15','2026-09-15','PENDING'),
              ('g7b2-ar-ticket-a','company-g7b2-a','TRAFFIC_TICKET_DRIVER','ticket-a','veh-a','cat-income','Reembolso de multa A','50.00','50.00','50.00','2026-09-16','2026-09-16','PENDING'),
              ('g7b2-ar-deposit-a','company-g7b2-a','SECURITY_DEPOSIT','deposit-a','veh-a','cat-income','Caução recebida A','400.00','400.00','400.00','2026-09-17','2026-09-17','PENDING'),
              ('g7b2-ar-cancel-a','company-g7b2-a','MANUAL','cancel-a','veh-a','cat-income','Receita cancelada A','300.00','300.00','300.00','2026-09-18','2026-09-18','CANCELLED'),
              ('g7b2-ar-b','company-g7b2-b','CONTRACT_RENT','rent-b','veh-b','cat-income','Aluguel B','9000.00','9000.00','9000.00','2026-09-10','2026-09-10','PENDING')`);

            await p.query(`INSERT INTO account_payables(id,company_id,origin_type,origin_id,vehicle_id,category_id,description,original_amount,updated_amount,balance_amount,due_date,competence_date,status) VALUES
              ('g7b2-ap-maint-a','company-g7b2-a','MAINTENANCE','maint-a','veh-a','cat-expense','Manutenção A','200.00','200.00','200.00','2026-09-10','2026-09-10','PENDING'),
              ('g7b2-ap-ins-a','company-g7b2-a','INSURANCE','ins-a','veh-a','cat-expense','Seguro A','100.00','100.00','100.00','2026-09-11','2026-09-11','PENDING'),
              ('g7b2-ap-track-a','company-g7b2-a','TRACKER','track-a','veh-a','cat-expense','Rastreador A','50.00','50.00','50.00','2026-09-12','2026-09-12','PENDING'),
              ('g7b2-ap-doc-a','company-g7b2-a','DOCUMENTATION','doc-a','veh-a','cat-expense','IPVA A','40.00','40.00','40.00','2026-09-13','2026-09-13','PENDING'),
              ('g7b2-ap-fine-a','company-g7b2-a','TRAFFIC_TICKET_COMPANY','fine-a','veh-a','cat-expense','Multa empresa A','30.00','30.00','30.00','2026-09-14','2026-09-14','PENDING'),
              ('g7b2-ap-fin-a','company-g7b2-a','FINANCING','fin-a','veh-a','cat-expense','Financiamento A','20.00','20.00','20.00','2026-09-15','2026-09-15','PENDING'),
              ('g7b2-ap-other-a','company-g7b2-a','ADMINISTRATIVE','other-a','veh-a','cat-expense','Outra despesa ultimo dia A','25.00','25.00','25.00','2026-09-30','2026-09-30','PENDING'),
              ('g7b2-ap-deposit-a','company-g7b2-a','SECURITY_DEPOSIT','dep-pay-a','veh-a','cat-expense','Caução devolvida A','500.00','500.00','500.00','2026-09-20','2026-09-20','PENDING'),
              ('g7b2-ap-b','company-g7b2-b','MAINTENANCE','maint-b','veh-b','cat-expense','Manutenção B','1000.00','1000.00','1000.00','2026-09-10','2026-09-10','PENDING')`);

            await p.query(`INSERT INTO financial_transactions(id,company_id,financial_account_id,receivable_id,payable_id,type,amount,payment_method_id,transaction_date,competence_date,description,is_reversed,vehicle_id,created_by_id) VALUES
              ('g7b2-tx-rent-a','company-g7b2-a','acc-a','g7b2-ar-rent-a',NULL,'INCOME','800.00','pm-a','2026-09-10','2026-09-10','Aluguel A',false,'veh-a','g7b2-admin-a'),
              ('g7b2-tx-rent-end-a','company-g7b2-a','acc-a','g7b2-ar-rent-end-a',NULL,'INCOME','200.00','pm-a','2026-09-30','2026-09-30','Aluguel ultimo dia A',false,'veh-a','g7b2-admin-a'),
              ('g7b2-tx-km-a','company-g7b2-a','acc-a','g7b2-ar-km-a',NULL,'INCOME','100.00','pm-a','2026-09-15','2026-09-15','Excesso KM A',false,'veh-a','g7b2-admin-a'),
              ('g7b2-tx-ticket-a','company-g7b2-a','acc-a','g7b2-ar-ticket-a',NULL,'INCOME','50.00','pm-a','2026-09-16','2026-09-16','Reembolso de multa A',false,'veh-a','g7b2-admin-a'),
              ('g7b2-tx-deposit-a','company-g7b2-a','acc-a','g7b2-ar-deposit-a',NULL,'INCOME','300.00','pm-a','2026-09-17','2026-09-17','Caução recebida A',false,'veh-a','g7b2-admin-a'),
              ('g7b2-tx-reversed-a','company-g7b2-a','acc-a',NULL,NULL,'INCOME','500.00','pm-a','2026-09-18','2026-09-18','Receita estornada A',true,'veh-a','g7b2-admin-a'),
              ('g7b2-tx-transfer-a','company-g7b2-a','acc-a',NULL,NULL,'TRANSFER','999.00','pm-a','2026-09-19','2026-09-19','Transferência A',false,'veh-a','g7b2-admin-a'),
              ('g7b2-tx-maint-a','company-g7b2-a','acc-a',NULL,'g7b2-ap-maint-a','EXPENSE','120.00','pm-a','2026-09-10','2026-09-10','Manutenção A',false,'veh-a','g7b2-admin-a'),
              ('g7b2-tx-maint-end-a','company-g7b2-a','acc-a',NULL,'g7b2-ap-maint-a','EXPENSE','10.00','pm-a','2026-09-30','2026-09-30','Manutenção ultimo dia A',false,'veh-a','g7b2-admin-a'),
              ('g7b2-tx-ins-a','company-g7b2-a','acc-a',NULL,'g7b2-ap-ins-a','EXPENSE','60.00','pm-a','2026-09-11','2026-09-11','Seguro A',false,'veh-a','g7b2-admin-a'),
              ('g7b2-tx-track-a','company-g7b2-a','acc-a',NULL,'g7b2-ap-track-a','EXPENSE','30.00','pm-a','2026-09-12','2026-09-12','Rastreador A',false,'veh-a','g7b2-admin-a'),
              ('g7b2-tx-doc-a','company-g7b2-a','acc-a',NULL,'g7b2-ap-doc-a','EXPENSE','20.00','pm-a','2026-09-13','2026-09-13','IPVA A',false,'veh-a','g7b2-admin-a'),
              ('g7b2-tx-fine-a','company-g7b2-a','acc-a',NULL,'g7b2-ap-fine-a','EXPENSE','10.00','pm-a','2026-09-14','2026-09-14','Multa empresa A',false,'veh-a','g7b2-admin-a'),
              ('g7b2-tx-fin-a','company-g7b2-a','acc-a',NULL,'g7b2-ap-fin-a','EXPENSE','15.00','pm-a','2026-09-15','2026-09-15','Financiamento A',false,'veh-a','g7b2-admin-a'),
              ('g7b2-tx-other-a','company-g7b2-a','acc-a',NULL,'g7b2-ap-other-a','EXPENSE','5.00','pm-a','2026-09-16','2026-09-16','Outra despesa A',false,'veh-a','g7b2-admin-a'),
              ('g7b2-tx-rent-b','company-g7b2-b','acc-b','g7b2-ar-b',NULL,'INCOME','9000.00','pm-b','2026-09-10','2026-09-10','Aluguel B',false,'veh-b','g7b2-admin-b'),
              ('g7b2-tx-maint-b','company-g7b2-b','acc-b',NULL,'g7b2-ap-b','EXPENSE','1000.00','pm-b','2026-09-10','2026-09-10','Manutenção B',false,'veh-b','g7b2-admin-b')`);

            await p.query(`CREATE ROLE autoerp_g7b2_app LOGIN PASSWORD 'autoerp_g7b2_pass'`);
            await p.query(`GRANT USAGE ON SCHEMA public TO autoerp_g7b2_app`);
            await p.query(`GRANT SELECT ON companies,users,user_credentials,account_receivables,account_payables,financial_transactions TO autoerp_g7b2_app`);
            await p.end();
          }
          main().catch(e=>{console.error(e);process.exit(2)});
          EOF
          npx tsx .ci-tmp/g7b2-seed.ts

      - name: Start production server
        env:
          NODE_ENV: production
          USE_PGLITE: 'false'
          ALLOW_MOCK_AUTH: 'false'
          DATABASE_URL: postgres://autoerp_g7b2_app:autoerp_g7b2_pass@127.0.0.1:5432/autoerp_ci
          JWT_SECRET: security-2g7b2-ci-secret-at-least-32-bytes
          JWT_ISSUER: autoerp-ci
          JWT_AUDIENCE: autoerp-users
        shell: bash
        run: |
          node dist/server.mjs > .ci-tmp/server.log 2>&1 & echo $! > .ci-tmp/server.pid
          for i in {1..30}; do code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/auth/me || true); [ "$code" = 401 ] && exit 0; sleep 1; done
          cat .ci-tmp/server.log; exit 1

      - name: Production vehicle profitability PostgreSQL/RLS parity
        shell: bash
        run: |
          cat > .ci-tmp/g7b2-http.ts <<'EOF'
          const base='http://127.0.0.1:3000'; const password='StrongPass123!';
          async function login(doc:string,email:string){const r=await fetch(base+'/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({companyDocument:doc,email,password})});if(r.status!==200)throw Error(`login ${email} ${r.status} ${await r.text()}`);const c=r.headers.get('set-cookie');if(!c)throw Error('cookie missing');return c.split(';')[0]}
          async function get(cookie:string|null,vehicleId:string,regime:string,start='2026-09-01',end='2026-09-30',forged?:string){const q=new URLSearchParams({vehicleId,start,end,regime});return fetch(`${base}/api/finance/reports/vehicle-profitability?${q}`,{headers:{...(cookie?{cookie}:{}),...(forged?{'x-company-id':forged}:{})}})}
          function eq(actual:any,expected:number,label:string){if(Math.abs(Number(actual)-expected)>0.005)throw Error(`${label}: ${actual} != ${expected}`)}
          async function main(){
            let r=await get(null,'veh-a','CASH'); if(r.status!==401)throw Error(`no-session ${r.status}`); console.log('G7B2_NO_SESSION=PASS');
            const ca=await login('91919191000191','admin-a@g7b2.test'); const cb=await login('92929292000192','admin-b@g7b2.test'); console.log('G7B2_LOGIN=PASS');
            r=await get(ca,'','CASH'); if(r.status!==400)throw Error(`empty vehicle ${r.status}`); r=await get(ca,'veh-a','BAD'); if(r.status!==400)throw Error(`bad regime ${r.status}`); console.log('G7B2_INVALID_PARAMS=PASS');

            r=await get(ca,'veh-a','ACCRUAL','2026-09-01','2026-09-30','company-g7b2-b'); if(r.status!==200)throw Error(`accrual A ${r.status} ${await r.text()}`); let d=(await r.json()).report;
            eq(d.rentalIncome,1200,'accrual rental'); eq(d.kmExcessIncome,150,'accrual km'); eq(d.finesReimbursedIncome,50,'accrual reimbursed'); eq(d.totalIncome,1400,'accrual income');
            eq(d.maintenanceExpense,200,'accrual maintenance'); eq(d.insuranceExpense,100,'accrual insurance'); eq(d.trackerExpense,50,'accrual tracker'); eq(d.documentationExpense,40,'accrual documentation'); eq(d.finesCompanyExpense,30,'accrual fines'); eq(d.financingExpense,20,'accrual financing'); eq(d.otherExpense,25,'accrual other'); eq(d.totalExpense,465,'accrual expense'); eq(d.netProfit,935,'accrual net'); eq(d.marginPercentage,66.79,'accrual margin'); console.log('G7B2_ACCRUAL_EXACT=PASS');

            r=await get(ca,'veh-a','CASH','2026-09-01','2026-09-30','company-g7b2-b'); if(r.status!==200)throw Error(`cash A ${r.status} ${await r.text()}`); d=(await r.json()).report;
            eq(d.rentalIncome,1000,'cash rental'); eq(d.kmExcessIncome,100,'cash km'); eq(d.finesReimbursedIncome,50,'cash reimbursed'); eq(d.totalIncome,1150,'cash income');
            eq(d.maintenanceExpense,130,'cash maintenance'); eq(d.insuranceExpense,60,'cash insurance'); eq(d.trackerExpense,30,'cash tracker'); eq(d.documentationExpense,20,'cash documentation'); eq(d.finesCompanyExpense,10,'cash fines'); eq(d.financingExpense,15,'cash financing'); eq(d.otherExpense,5,'cash other'); eq(d.totalExpense,270,'cash expense'); eq(d.netProfit,880,'cash net'); eq(d.marginPercentage,76.52,'cash margin'); console.log('G7B2_CASH_EXACT=PASS');

            r=await get(ca,'veh-b','ACCRUAL'); if(r.status!==200)throw Error(`foreign A ${r.status}`); d=(await r.json()).report; eq(d.totalIncome,0,'foreign income'); eq(d.totalExpense,0,'foreign expense'); eq(d.netProfit,0,'foreign net'); console.log('G7B2_FOREIGN_VEHICLE_NO_LEAK=PASS');
            r=await get(cb,'veh-b','ACCRUAL'); if(r.status!==200)throw Error(`tenant B ${r.status}`); d=(await r.json()).report; eq(d.totalIncome,9000,'B income'); eq(d.totalExpense,1000,'B expense'); eq(d.netProfit,8000,'B net'); console.log('G7B2_TENANT_B=PASS');
            console.log('G7B2_FORGED_TENANT_HEADER=IGNORED');
          }
          main().catch(e=>{console.error('G7B2_HTTP_FATAL',e);process.exit(2)});
          EOF
          npx tsx .ci-tmp/g7b2-http.ts

      - name: Regression suites
        env:
          NODE_ENV: test
          USE_PGLITE: 'true'
          ALLOW_MOCK_AUTH: 'false'
          JWT_SECRET: security-2g7b2-ci-secret-at-least-32-bytes
          JWT_ISSUER: autoerp-ci
          JWT_AUDIENCE: autoerp-users
        shell: bash
        run: |
          cat > .ci-tmp/regression.ts <<'EOF'
          import{pathToFileURL}from'node:url';import path from'node:path';class M{private s=new Map<string,string>();clear(){this.s.clear()}getItem(k:string){return this.s.get(k)??null}removeItem(k:string){this.s.delete(k)}setItem(k:string,v:string){this.s.set(k,String(v))}key(i:number){return[...this.s.keys()][i]??null}get length(){return this.s.size}}
          async function main(){const st=new M();Object.defineProperty(globalThis,'localStorage',{value:st,configurable:true});Object.defineProperty(globalThis,'window',{value:globalThis,configurable:true});const u=(p:string)=>pathToFileURL(path.join(process.cwd(),p)).href;const ss:[string,string,string,number][]=[['AuthSession','src/auth/__tests__/authSessionTestRunner.ts','AuthSessionTestRunner',8],['Bootstrap','src/server/__tests__/bootstrapTestRunner.ts','BootstrapTestRunner',5],['SessionLogin','src/server/__tests__/sessionLoginTestRunner.ts','SessionLoginTestRunner',12],['Password','src/server/__tests__/passwordTestRunner.ts','PasswordSecurityTestRunner',6],['ServerAuth','src/server/__tests__/authTestRunner.ts','ServerAuthTestRunner',8],['Admin','src/domain/admin/SecurityAdministrationService.test.ts','SecurityAdministrationTestRunner',4],['Tenant','src/domain/admin/TenantConfigurationService.test.ts','TenantConfigurationTestRunner',4]];for(const[n,f,k,e]of ss){const m:any=await import(u(f)),r=await m[k].runAllTests();if(r.passed!==e||r.total!==e||r.failed)throw Error(`${n} ${r.passed}/${r.total}`)}const a=process.argv;process.argv=[];const{ContractTestRunner}=await import(u('src/domain/services/__tests__/contractTestRunner.ts'));const{FinanceTestRunner}=await import(u('src/domain/finance/__tests__/financeTestRunner.ts'));const{SecurityTestRunner}=await import(u('src/domain/services/__tests__/securityTestRunner.ts'));process.argv=a;for(const[n,f,e]of [['Contract',()=>ContractTestRunner.runAllTests(),20],['Finance',()=>FinanceTestRunner.runAllTests(),46],['Security',()=>SecurityTestRunner.runAllTests(),35]]as any){st.clear();const r=await f();if(r.passed!==e||r.total!==e||r.failed)throw Error(`${n} ${r.passed}/${r.total}`)}console.log('G7B2_REGRESSIONS=PASS')}main().catch(e=>{console.error(e);process.exit(2)});
          EOF
          npx tsx .ci-tmp/regression.ts

      - name: Stop server
        if: always()
        run: |
          [ ! -f .ci-tmp/server.pid ] || kill "$(cat .ci-tmp/server.pid)" || true
          cat .ci-tmp/server.log 2>/dev/null || true

      - name: Tracked immutability
        run: test -z "$(git status --porcelain --untracked-files=no)"

      - name: CI report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body=['AUTOERP_SECURITY_2G7B2_CI_REPORT',`VALIDATION_STATUS=${{ job.status }}`,`RUN_ID=${context.runId}`,'CANDIDATE=c4dd06d6a9819e5ef57a4c942feedbea91e11c46','Profitability CASH+ACCRUAL exact PostgreSQL16/RLS parity required','FinanceReportingClient 8/8 required','Contract=20/20 required','Finance=46/46 required','Security=35/35 required'].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
