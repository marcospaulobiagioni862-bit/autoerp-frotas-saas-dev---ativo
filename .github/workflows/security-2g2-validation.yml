name: SECURITY-2G2 validation

on:
  pull_request:
    branches:
      - ci-validate-security-2g2
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoerp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d autoerp_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      JWT_SECRET: security-2g2-ci-secret-at-least-32-bytes
      JWT_ISSUER: autoerp-ci
      JWT_AUDIENCE: autoerp-users

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify source equals SECURITY-2G2 candidate
        run: git diff --exit-code 2483c94bc04206707ee764f420561948a1a5a9e5 -- . ':(exclude).github/**'

      - name: Verify finance API trust-boundary wiring
        shell: bash
        run: |
          grep -F "app.post('/api/finance/receivables'" server.ts >/dev/null
          grep -F "app.post('/api/finance/receivables/:id/cancel'" server.ts >/dev/null
          grep -F "app.post('/api/finance/payables'" server.ts >/dev/null
          grep -F "app.post('/api/finance/payables/:id/cancel'" server.ts >/dev/null
          grep -F 'UnitOfWork.run(principal.companyId' server.ts >/dev/null
          grep -F 'companyId: principal.companyId' server.ts >/dev/null
          grep -F 'userId: principal.userId' server.ts >/dev/null
          grep -F 'userName: principal.name' server.ts >/dev/null
          ! grep -E 'companyId: req\.body.*companyId|userId: req\.body.*userId|userName: req\.body.*userName' server.ts

      - name: Install declared dependencies
        run: npm install --no-audit --no-fund

      - name: Lint / typecheck
        run: npm run lint

      - name: Build production frontend and server
        run: npm run build

      - name: TypeScript noEmit
        run: npx tsc --noEmit

      - name: Seed PostgreSQL for production API integration
        env:
          ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/autoerp_ci
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci-tmp"
          cat > "$GITHUB_WORKSPACE/.ci-tmp/security-2g2-seed.ts" <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import { Pool } from 'pg';
          import { hashPassword } from '../src/server/password';

          async function main() {
            const workspace = process.env.GITHUB_WORKSPACE!;
            const admin = new Pool({ connectionString: process.env.ADMIN_DATABASE_URL! });
            for (const migration of [
              'drizzle/0000_milky_invisible_woman.sql',
              'drizzle/0001_rls_and_audit.sql',
              'drizzle/0002_phase1_final_hardening.sql',
              'drizzle/0003_auth_credentials.sql',
            ]) {
              await admin.query(fs.readFileSync(path.join(workspace, migration), 'utf8'));
            }

            await admin.query(`
              INSERT INTO companies (id, document, name, status)
              VALUES
                ('company-g2-a', '11111111000111', 'Tenant G2 A', 'ACTIVE'),
                ('company-g2-b', '22222222000122', 'Tenant G2 B', 'ACTIVE')
            `);
            await admin.query(`
              INSERT INTO users (id, company_id, name, email, role, active, permissions)
              VALUES
                ('g2-admin-a', 'company-g2-a', 'Admin G2 A', 'admin-a@g2.test', 'ADMIN', true, ARRAY['*']),
                ('g2-readonly-a', 'company-g2-a', 'Readonly G2 A', 'readonly-a@g2.test', 'READONLY', true, ARRAY[]::text[]),
                ('g2-admin-b', 'company-g2-b', 'Admin G2 B', 'admin-b@g2.test', 'ADMIN', true, ARRAY['*'])
            `);

            const password = 'StrongPass123!';
            const hashes = await Promise.all([hashPassword(password), hashPassword(password), hashPassword(password)]);
            await admin.query(
              `INSERT INTO user_credentials (company_id, user_id, password_hash) VALUES ($1,$2,$3),($4,$5,$6),($7,$8,$9)`,
              ['company-g2-a','g2-admin-a',hashes[0],'company-g2-a','g2-readonly-a',hashes[1],'company-g2-b','g2-admin-b',hashes[2]]
            );

            await admin.query(`CREATE ROLE autoerp_g2_app LOGIN PASSWORD 'autoerp_g2_pass'`);
            await admin.query(`GRANT USAGE ON SCHEMA public TO autoerp_g2_app`);
            await admin.query(`GRANT SELECT ON TABLE companies, users, user_credentials, financial_periods TO autoerp_g2_app`);
            await admin.query(`GRANT SELECT, INSERT, UPDATE ON TABLE account_receivables, account_payables TO autoerp_g2_app`);
            await admin.query(`GRANT SELECT, INSERT ON TABLE audit_logs TO autoerp_g2_app`);
            await admin.end();
          }

          main().catch((error) => { console.error(error); process.exitCode = 2; });
          EOF
          npx tsx "$GITHUB_WORKSPACE/.ci-tmp/security-2g2-seed.ts"

      - name: Start production server
        env:
          NODE_ENV: production
          USE_PGLITE: "false"
          ALLOW_MOCK_AUTH: "false"
          DATABASE_URL: postgres://autoerp_g2_app:autoerp_g2_pass@127.0.0.1:5432/autoerp_ci
          JWT_SECRET: security-2g2-ci-secret-at-least-32-bytes
          JWT_ISSUER: autoerp-ci
          JWT_AUDIENCE: autoerp-users
        shell: bash
        run: |
          node dist/server.mjs > "$GITHUB_WORKSPACE/.ci-tmp/server.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/.ci-tmp/server.pid"
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/auth/me || true)
            if [ "$code" = "401" ]; then exit 0; fi
            sleep 1
          done
          cat "$GITHUB_WORKSPACE/.ci-tmp/server.log"
          exit 1

      - name: Run production finance API integration
        env:
          ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/autoerp_ci
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/.ci-tmp/security-2g2-http.ts" <<'EOF'
          import { Pool } from 'pg';

          const base = 'http://127.0.0.1:3000';
          const password = 'StrongPass123!';
          const admin = new Pool({ connectionString: process.env.ADMIN_DATABASE_URL! });

          async function login(companyDocument: string, email: string): Promise<string> {
            const response = await fetch(`${base}/api/auth/login`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ companyDocument, email, password }),
            });
            if (response.status !== 200) throw new Error(`login failed ${email}: ${response.status}`);
            const setCookie = response.headers.get('set-cookie');
            if (!setCookie || !setCookie.includes('autoerp_session=')) throw new Error('session cookie missing');
            return setCookie.split(';')[0];
          }

          async function command(path: string, cookie: string | null, body: unknown) {
            return await fetch(`${base}${path}`, {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                ...(cookie ? { cookie } : {}),
              },
              body: JSON.stringify(body),
            });
          }

          async function main() {
            const unauth = await command('/api/finance/receivables', null, {});
            if (unauth.status !== 401) throw new Error(`unauth expected 401 got ${unauth.status}`);
            console.log('G2_NO_SESSION=401_PASS');

            const cookieA = await login('11111111000111', 'admin-a@g2.test');
            const cookieB = await login('22222222000122', 'admin-b@g2.test');
            const cookieReadonly = await login('11111111000111', 'readonly-a@g2.test');
            console.log('G2_REAL_LOGIN=PASS');

            const arPayload = {
              companyId: 'company-g2-b',
              userId: 'g2-admin-b',
              userName: 'FORGED USER',
              originType: 'MANUAL',
              originId: 'g2-ar-main',
              categoryId: 'cat-g2-income',
              description: 'G2 AR HTTP',
              totalAmount: 610,
              dueDate: '2026-09-10',
              competenceDate: '2026-09-01',
            };
            const arResponse = await command('/api/finance/receivables', cookieA, arPayload);
            if (arResponse.status !== 201) throw new Error(`AR create ${arResponse.status}: ${await arResponse.text()}`);
            const arBody: any = await arResponse.json();
            const ar = arBody.items?.[0];
            if (!ar || ar.companyId !== 'company-g2-a') throw new Error('AR principal tenant not authoritative');

            const arDb = await admin.query(`SELECT company_id FROM account_receivables WHERE id=$1`, [ar.id]);
            if (arDb.rows[0]?.company_id !== 'company-g2-a') throw new Error('AR persisted under forged tenant');
            const arAudit = await admin.query(`SELECT user_id, changes FROM audit_logs WHERE entity_id=$1 AND action='CREATE'`, [ar.id]);
            const arChanges = JSON.parse(arAudit.rows[0]?.changes || '{}');
            if (arAudit.rows[0]?.user_id !== 'g2-admin-a' || arChanges.userName !== 'Admin G2 A') throw new Error('AR forged audit identity accepted');
            console.log('G2_AR_PRINCIPAL_AUTHORITY=PASS');

            const arRepeat = await command('/api/finance/receivables', cookieA, arPayload);
            if (arRepeat.status !== 201) throw new Error(`AR repeat ${arRepeat.status}`);
            const arRepeatBody: any = await arRepeat.json();
            if (arRepeatBody.items?.[0]?.id !== ar.id) throw new Error('AR HTTP idempotency returned different id');
            const arCount = await admin.query(`SELECT count(*)::int AS c FROM account_receivables WHERE company_id='company-g2-a' AND origin_id='g2-ar-main'`);
            if (arCount.rows[0].c !== 1) throw new Error('AR HTTP idempotency duplicated');
            console.log('G2_AR_HTTP_IDEMPOTENCY=PASS');

            const apPayload = {
              companyId: 'company-g2-b',
              userId: 'g2-admin-b',
              userName: 'FORGED USER',
              originType: 'MANUAL',
              originId: 'g2-ap-main',
              categoryId: 'cat-g2-expense',
              description: 'G2 AP HTTP',
              totalAmount: 470,
              dueDate: '2026-09-12',
              competenceDate: '2026-09-01',
              idempotencyKey: 'g2-ap-http-key',
            };
            const apResponse = await command('/api/finance/payables', cookieA, apPayload);
            if (apResponse.status !== 201) throw new Error(`AP create ${apResponse.status}: ${await apResponse.text()}`);
            const apBody: any = await apResponse.json();
            const ap = apBody.items?.[0];
            if (!ap || ap.companyId !== 'company-g2-a') throw new Error('AP principal tenant not authoritative');
            const apAudit = await admin.query(`SELECT user_id, changes FROM audit_logs WHERE entity_id=$1 AND action='CREATE'`, [ap.id]);
            const apChanges = JSON.parse(apAudit.rows[0]?.changes || '{}');
            if (apAudit.rows[0]?.user_id !== 'g2-admin-a' || apChanges.userName !== 'Admin G2 A') throw new Error('AP forged audit identity accepted');
            console.log('G2_AP_PRINCIPAL_AUTHORITY=PASS');

            const apRepeat = await command('/api/finance/payables', cookieA, apPayload);
            if (apRepeat.status !== 201) throw new Error(`AP repeat ${apRepeat.status}`);
            const apRepeatBody: any = await apRepeat.json();
            if (apRepeatBody.items?.[0]?.id !== ap.id) throw new Error('AP HTTP idempotency returned different id');
            const apCount = await admin.query(`SELECT count(*)::int AS c FROM account_payables WHERE company_id='company-g2-a' AND origin_id='g2-ap-main'`);
            if (apCount.rows[0].c !== 1) throw new Error('AP HTTP idempotency duplicated');
            console.log('G2_AP_HTTP_IDEMPOTENCY=PASS');

            const readonlyAttempt = await command('/api/finance/receivables', cookieReadonly, { ...arPayload, originId: 'g2-readonly-denied' });
            if (readonlyAttempt.status !== 403) throw new Error(`READONLY expected 403 got ${readonlyAttempt.status}: ${await readonlyAttempt.text()}`);
            const readonlyCount = await admin.query(`SELECT count(*)::int AS c FROM account_receivables WHERE origin_id='g2-readonly-denied'`);
            if (readonlyCount.rows[0].c !== 0) throw new Error('READONLY mutated finance data');
            console.log('G2_READONLY=403_PASS');

            const bCreate = await command('/api/finance/receivables', cookieB, { ...arPayload, companyId: 'company-g2-b', userId: 'g2-admin-b', userName: 'Admin G2 B', originId: 'g2-ar-b' });
            if (bCreate.status !== 201) throw new Error(`tenant B create ${bCreate.status}: ${await bCreate.text()}`);
            const bBody: any = await bCreate.json();
            const bAr = bBody.items[0];
            if (bAr.companyId !== 'company-g2-b') throw new Error('tenant B create wrong tenant');

            const crossCancel = await command(`/api/finance/receivables/${bAr.id}/cancel`, cookieA, { reason: 'attack', companyId: 'company-g2-b', userId: 'g2-admin-b' });
            if (crossCancel.status !== 404) throw new Error(`cross cancel expected 404 got ${crossCancel.status}`);
            const bStatus = await admin.query(`SELECT status FROM account_receivables WHERE id=$1`, [bAr.id]);
            if (bStatus.rows[0]?.status !== 'PENDING') throw new Error('cross-tenant cancel mutated B row');
            console.log('G2_CROSS_TENANT_CANCEL=BLOCKED');

            const arCancel = await command(`/api/finance/receivables/${ar.id}/cancel`, cookieA, { reason: 'valid cancel', companyId: 'company-g2-b', userId: 'g2-admin-b', userName: 'FORGED USER' });
            if (arCancel.status !== 200) throw new Error(`AR cancel ${arCancel.status}: ${await arCancel.text()}`);
            const arCancelBody: any = await arCancel.json();
            if (arCancelBody.item?.status !== 'CANCELLED') throw new Error('AR cancel did not cancel');

            const apCancel = await command(`/api/finance/payables/${ap.id}/cancel`, cookieA, { reason: 'valid cancel', companyId: 'company-g2-b', userId: 'g2-admin-b', userName: 'FORGED USER' });
            if (apCancel.status !== 200) throw new Error(`AP cancel ${apCancel.status}: ${await apCancel.text()}`);
            const apCancelBody: any = await apCancel.json();
            if (apCancelBody.item?.status !== 'CANCELLED') throw new Error('AP cancel did not cancel');
            const cancelAudits = await admin.query(`SELECT entity_id, user_id, changes FROM audit_logs WHERE entity_id = ANY($1::text[]) AND action='CANCEL'`, [[ar.id, ap.id]]);
            if (cancelAudits.rowCount !== 2) throw new Error('cancel audit rows missing');
            for (const row of cancelAudits.rows) {
              const changes = JSON.parse(row.changes);
              if (row.user_id !== 'g2-admin-a' || changes.userName !== 'Admin G2 A') throw new Error('cancel forged audit identity accepted');
            }
            console.log('G2_CANCEL_AND_AUDIT=PASS');

            await admin.end();
          }

          main().catch((error) => { console.error('AUTOERP_SECURITY_2G2_HTTP_FATAL'); console.error(error); process.exitCode = 2; });
          EOF
          npx tsx "$GITHUB_WORKSPACE/.ci-tmp/security-2g2-http.ts"

      - name: Create strict regression harness
        shell: bash
        env:
          NODE_ENV: test
          USE_PGLITE: "true"
          ALLOW_MOCK_AUTH: "false"
          JWT_SECRET: security-2g2-ci-secret-at-least-32-bytes
          JWT_ISSUER: autoerp-ci
          JWT_AUDIENCE: autoerp-users
        run: |
          cat > "$GITHUB_WORKSPACE/.ci-tmp/security-2g2-regression.ts" <<'EOF'
          import { pathToFileURL } from 'node:url';
          import path from 'node:path';
          class MemoryStorage { private s=new Map<string,string>(); clear(){this.s.clear()} getItem(k:string){return this.s.has(k)?this.s.get(k)!:null} removeItem(k:string){this.s.delete(k)} setItem(k:string,v:string){this.s.set(String(k),String(v))} key(i:number){return Array.from(this.s.keys())[i]??null} get length(){return this.s.size} }
          async function main(){
            const storage=new MemoryStorage(); Object.defineProperty(globalThis,'localStorage',{value:storage,configurable:true}); Object.defineProperty(globalThis,'window',{value:globalThis,configurable:true});
            const w=process.env.GITHUB_WORKSPACE!; const u=(p:string)=>pathToFileURL(path.join(w,p)).href;
            const suites:[string,string,string,number][]=[
              ['AuthSession','src/auth/__tests__/authSessionTestRunner.ts','AuthSessionTestRunner',8],
              ['Bootstrap','src/server/__tests__/bootstrapTestRunner.ts','BootstrapTestRunner',5],
              ['SessionLogin','src/server/__tests__/sessionLoginTestRunner.ts','SessionLoginTestRunner',12],
              ['Password','src/server/__tests__/passwordTestRunner.ts','PasswordSecurityTestRunner',6],
              ['ServerAuth','src/server/__tests__/authTestRunner.ts','ServerAuthTestRunner',8],
              ['AdminSecurity','src/domain/admin/SecurityAdministrationService.test.ts','SecurityAdministrationTestRunner',4],
              ['TenantConfig','src/domain/admin/TenantConfigurationService.test.ts','TenantConfigurationTestRunner',4],
            ];
            for(const [name,file,key,total] of suites){ const mod:any=await import(u(file)); const r=await mod[key].runAllTests(); if(r.total!==total||r.passed!==total||r.failed!==0) throw new Error(`${name} ${r.passed}/${r.total}`); }
            const original=process.argv; process.argv=[]; const {ContractTestRunner}=await import(u('src/domain/services/__tests__/contractTestRunner.ts')); const {FinanceTestRunner}=await import(u('src/domain/finance/__tests__/financeTestRunner.ts')); const {SecurityTestRunner}=await import(u('src/domain/services/__tests__/securityTestRunner.ts')); process.argv=original;
            const run=async(n:string,f:()=>Promise<any>,e:number)=>{storage.clear();const r=await f();if(!r||r.total!==e||r.passed!==e||r.failed!==0)throw new Error(`${n} ${r?.passed}/${r?.total}`)};
            await run('Contract',()=>ContractTestRunner.runAllTests(),20); await run('Finance',()=>FinanceTestRunner.runAllTests(),46); await run('Security',()=>SecurityTestRunner.runAllTests(),35); console.log('G2_REGRESSION_SUITE=PASS');
          }
          main().catch(e=>{console.error('AUTOERP_SECURITY_2G2_REGRESSION_FATAL');console.error(e);process.exitCode=2});
          EOF
          npx tsx "$GITHUB_WORKSPACE/.ci-tmp/security-2g2-regression.ts"

      - name: Stop production server and inspect log
        if: always()
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/.ci-tmp/server.pid" ]; then kill "$(cat "$GITHUB_WORKSPACE/.ci-tmp/server.pid")" || true; fi
          cat "$GITHUB_WORKSPACE/.ci-tmp/server.log" || true

      - name: Verify tracked repository remained unchanged
        run: test -z "$(git status --porcelain --untracked-files=no)"

      - name: Publish validation identity
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body=['AUTOERP_SECURITY_2G2_CI_REPORT',`VALIDATION_STATUS=${{ job.status }}`,`RUN_ID=${context.runId}`,'CANDIDATE=2483c94bc04206707ee764f420561948a1a5a9e5','STRICT_ACCEPTANCE=Production server + PostgreSQL16 finance API PASS; no-session 401; real login PASS; principal tenant/audit identity authoritative; forged identity ignored; AR/AP HTTP idempotency PASS; READONLY 403; cross-tenant cancel BLOCKED; AR/AP cancel+audit PASS; AuthSession 8/8; Bootstrap 5/5; SessionLogin 12/12; PasswordSecurity 6/6; ServerAuth 8/8; AdminSecurity 4/4; TenantConfig 4/4; Contract 20/20; Finance 46/46; Security 35/35; lint/build/tsc/source-integrity/tracked-immutability PASS'].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
