name: SECURITY-2G5 implementation gate

on:
  pull_request:
    branches:
      - ci-implement-security-2g5

permissions:
  contents: write
  pull-requests: read

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production candidate
        uses: actions/checkout@v4
        with:
          ref: security-2g5-transfer-reversal-server-authority
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout CI control
        uses: actions/checkout@v4
        with:
          ref: ci-implement-security-2g5
          path: .ci-control
          sparse-checkout: |
            ci/security-2g5-server-apply.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Apply controlled G5 server patch
        run: python .ci-control/ci/security-2g5-server-apply.py

      - name: Scope gate
        shell: bash
        run: |
          {
            git diff --name-only origin/main
            git ls-files --others --exclude-standard | grep -v '^.ci-control/' || true
          } | sort -u > /tmp/changed.txt
          cat >/tmp/expected.txt <<'EOF'
          server.ts
          src/api/__tests__/financeTransactionClientTestRunner.ts
          src/api/financeTransactionClient.ts
          src/components/finance/TransactionsView.tsx
          src/components/modals/TransferModal.tsx
          src/domain/finance/ReversalService.ts
          src/domain/finance/TransferService.ts
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          ! grep -Eq 'FinanceEngine|localRepositories|useAuth' src/components/modals/TransferModal.tsx
          ! grep -Eq 'FinanceEngine|localRepositories|useAuth' src/components/finance/TransactionsView.tsx
          grep -F "credentials: 'include'" src/api/financeTransactionClient.ts >/dev/null
          ! grep -Eq 'companyId[[:space:]]*:|userId[[:space:]]*:|userName[[:space:]]*:' src/api/financeTransactionClient.ts
          grep -F "app.get('/api/finance/transactions'" server.ts >/dev/null
          grep -F "app.post('/api/finance/transfers'" server.ts >/dev/null
          grep -F "app.post('/api/finance/transactions/:id/reverse'" server.ts >/dev/null

      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Transaction client tests
        run: npx tsx src/api/__tests__/financeTransactionClientTestRunner.ts
      - name: Diff safety
        run: git diff --check

      - name: Publish validated server patch
        shell: bash
        run: |
          git config user.name "chatgpt-codex-connector"
          git config user.email "noreply@openai.com"
          git add server.ts
          git diff --cached --check
          git commit -m "feat(security): expose transfer and reversal server authority"
          git push origin HEAD:security-2g5-transfer-reversal-server-authority
