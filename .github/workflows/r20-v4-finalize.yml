name: FINANCE-R20 Final Isolated Validation V4

on:
  push:
    branches:
      - finance-r20-cancellation-metadata
    paths:
      - .github/workflows/r20-v4-finalize.yml

permissions:
  contents: write
  issues: write

jobs:
  validate-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoerp_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      USE_PGLITE: "false"
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_HOST: 127.0.0.1
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/autoerp_phase1_test
      RECURRING_SCHEDULER_ENABLED: "false"
      JWT_SECRET: finance-r20-v4-test-secret-that-is-long-enough
      JWT_ISSUER: autoerp-finance-r20-v4
      JWT_AUDIENCE: autoerp-finance-r20-v4-client

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Report validation start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 224 --repo "$GITHUB_REPOSITORY" --body "FINANCE-R20 FINAL V4 START | run_id=$GITHUB_RUN_ID | commit=$GITHUB_SHA"

      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false

      - name: Apply exact R20 production patch
        run: python3 .github/r20_apply_v2.py

      - name: Repair audit regression against authoritative schema
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/server/__tests__/financeCancellationMetadataIntegration.ts')
          s = p.read_text()
          old_ar = """  const arAudit = await row(sql`SELECT new_state FROM audit_logs WHERE company_id=${companyA} AND entity_id='r20-rec-manual' AND action='CANCEL' ORDER BY timestamp DESC LIMIT 1`);\n  const arAuditState = typeof arAudit?.new_state === 'string' ? JSON.parse(arAudit.new_state) : arAudit?.new_state;"""
          new_ar = """  const arAudit = await row(sql`SELECT changes FROM audit_logs WHERE company_id=${companyA} AND entity_id='r20-rec-manual' AND action='CANCEL' ORDER BY timestamp DESC LIMIT 1`);\n  const arChanges = typeof arAudit?.changes === 'string' ? JSON.parse(arAudit.changes) : arAudit?.changes;\n  const arAuditState = typeof arChanges?.newState === 'string' ? JSON.parse(arChanges.newState) : arChanges?.newState;"""
          old_ap = """  const apAudit = await row(sql`SELECT new_state FROM audit_logs WHERE company_id=${companyA} AND entity_id='r20-pay-manual' AND action='CANCEL' ORDER BY timestamp DESC LIMIT 1`);\n  const apAuditState = typeof apAudit?.new_state === 'string' ? JSON.parse(apAudit.new_state) : apAudit?.new_state;"""
          new_ap = """  const apAudit = await row(sql`SELECT changes FROM audit_logs WHERE company_id=${companyA} AND entity_id='r20-pay-manual' AND action='CANCEL' ORDER BY timestamp DESC LIMIT 1`);\n  const apChanges = typeof apAudit?.changes === 'string' ? JSON.parse(apAudit.changes) : apAudit?.changes;\n  const apAuditState = typeof apChanges?.newState === 'string' ? JSON.parse(apChanges.newState) : apChanges?.newState;"""
          if s.count(old_ar) != 1 or s.count(old_ap) != 1:
              raise SystemExit('FINANCE-R20 audit regression anchors not found exactly once')
          p.write_text(s.replace(old_ar, new_ar, 1).replace(old_ap, new_ap, 1))
          print('FINANCE-R20 audit regression repaired: changes -> newState')
          PY

      - name: Create permanent read-only R20 gate
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/finance-r20-gates.yml <<'YAML'
          # FINANCE-R20 durable AR/AP cancellation metadata gate
          name: FINANCE-R20 Gates

          on:
            pull_request:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              timeout-minutes: 45
              services:
                postgres:
                  image: postgres:16
                  env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: autoerp_phase1_test
                  ports:
                    - 5432:5432
                  options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
              env:
                NODE_ENV: test
                USE_PGLITE: "false"
                SQL_USER: postgres
                SQL_PASSWORD: postgres
                SQL_HOST: 127.0.0.1
                DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/autoerp_phase1_test
                RECURRING_SCHEDULER_ENABLED: "false"
                JWT_SECRET: finance-r20-test-jwt-secret-that-is-long-enough
                JWT_ISSUER: autoerp-finance-r20-test
                JWT_AUDIENCE: autoerp-finance-r20-test-client

              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0

                - uses: actions/setup-node@v4
                  with:
                    node-version: 22

                - name: Install dependencies
                  run: npm install --ignore-scripts --package-lock=false

                - name: FINANCE-R20 source invariants
                  shell: bash
                  run: |
                    set -euo pipefail
                    test "$(grep -F -c "const cancellationReason = typeof reason === 'string' ? reason.trim() : '';" src/domain/finance/ReceivableService.ts)" -eq 1
                    test "$(grep -F -c "const cancellationReason = typeof reason === 'string' ? reason.trim() : '';" src/domain/finance/PayableService.ts)" -eq 1
                    grep -F "cancelReason: cancellationReason" src/domain/finance/ReceivableService.ts
                    grep -F "cancelReason: cancellationReason" src/domain/finance/PayableService.ts
                    grep -F "cancelledAt," src/domain/finance/ReceivableService.ts
                    grep -F "cancelledAt," src/domain/finance/PayableService.ts
                    grep -F "Invalid receivable cancellation request" server.ts
                    grep -F "Invalid payable cancellation request" server.ts
                    echo "FINANCE-R20 source invariants: PASS"

                - name: TypeScript gate
                  run: npm run lint

                - name: Apply migrations
                  run: node migrate_test_db.cjs

                - name: FINANCE-R20 cancellation metadata regression
                  run: npx tsx src/server/__tests__/financeCancellationMetadataIntegration.ts

                - name: FINANCE-R21 settlement concurrency regression
                  run: npx tsx src/server/__tests__/financeSettlementConcurrencyIntegration.ts

                - name: FINANCE-R19 transfer concurrency regression
                  run: npx tsx src/server/__tests__/financeTransferConcurrencyIntegration.ts

                - name: FINANCE-R18 reversal concurrency regression
                  run: npx tsx src/server/__tests__/financeReversalConcurrencyIntegration.ts

                - name: Production build gate
                  run: npm run build

                - name: Production bundle authority guard
                  shell: bash
                  run: |
                    set -euo pipefail
                    if grep -RIl "AutoERP_DB" dist/assets >/tmp/finance_r20_bundle_hits.txt; then
                      echo "FAIL: legacy browser database marker found in production bundle"
                      cat /tmp/finance_r20_bundle_hits.txt
                      exit 1
                    fi
                    echo "FINANCE-R20 production bundle authority guard: PASS"
          YAML

      - name: Final working-tree scope gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          expected="$(printf '%s\n' \
            .github/workflows/finance-r20-gates.yml \
            server.ts \
            src/domain/finance/PayableService.ts \
            src/domain/finance/ReceivableService.ts \
            src/server/__tests__/financeCancellationMetadataIntegration.ts | sort)"
          test "$changed" = "$expected"
          echo "FINANCE-R20 working-tree scope: 5/5 expected final files"

      - name: TypeScript gate
        run: npm run lint

      - name: Apply migrations
        run: node migrate_test_db.cjs

      - name: FINANCE-R20 PostgreSQL regression
        run: npx tsx src/server/__tests__/financeCancellationMetadataIntegration.ts

      - name: FINANCE-R21 settlement regression
        run: npx tsx src/server/__tests__/financeSettlementConcurrencyIntegration.ts

      - name: FINANCE-R19 transfer regression
        run: npx tsx src/server/__tests__/financeTransferConcurrencyIntegration.ts

      - name: FINANCE-R18 reversal regression
        run: npx tsx src/server/__tests__/financeReversalConcurrencyIntegration.ts

      - name: Production build gate
        run: npm run build

      - name: Finalize exact candidate and remove temporary executors
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -- .github/r20_apply.py
          git rm -- .github/r20_apply_v2.py
          git rm -- .github/workflows/r20-apply-validate.yml
          git rm -- .github/workflows/r20-run-diagnostic.yml
          git rm -- .github/workflows/r20-v4-finalize.yml

          git add -- \
            .github/workflows/finance-r20-gates.yml \
            server.ts \
            src/domain/finance/PayableService.ts \
            src/domain/finance/ReceivableService.ts \
            src/server/__tests__/financeCancellationMetadataIntegration.ts

          git diff --cached --check
          final_changed="$(git diff --cached --name-only origin/main | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/finance-r20-gates.yml \
            server.ts \
            src/domain/finance/PayableService.ts \
            src/domain/finance/ReceivableService.ts \
            src/server/__tests__/financeCancellationMetadataIntegration.ts | sort)"
          test "$final_changed" = "$expected"
          echo "FINANCE-R20 final candidate vs main: 5/5 files, zero executor residue"

          git commit -m "FINANCE-R20 persist cancellation reason and timestamp"
          git push origin HEAD:finance-r20-cancellation-metadata

      - name: Report validation success
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 224 --repo "$GITHUB_REPOSITORY" --body "FINANCE-R20 FINAL V4 PASS | run_id=$GITHUB_RUN_ID"

      - name: Report validation failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 224 --repo "$GITHUB_REPOSITORY" --body "FINANCE-R20 FINAL V4 FAIL | run_id=$GITHUB_RUN_ID"
