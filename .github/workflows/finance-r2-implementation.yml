name: FINANCE-R2 Temporary Implementation

on:
  push:
    branches:
      - finance-r2-canonical-manual-categories

permissions:
  contents: write
  issues: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoerp_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      USE_PGLITE: "false"
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_HOST: 127.0.0.1
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/autoerp_phase1_test
      RECURRING_SCHEDULER_ENABLED: "false"
      JWT_SECRET: finance-r2-test-jwt-secret-that-is-long-enough
      JWT_ISSUER: autoerp-finance-r2-test
      JWT_AUDIENCE: autoerp-finance-r2-test-client
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false
      - name: Apply FINANCE-R2 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, got {count}')
              p.write_text(text.replace(old, new, 1))

          Path('src/domain/finance/FinancialCategoryAuthority.ts').write_text("""import { sql } from 'drizzle-orm';
import type { ITransactionContext } from './ITransactionContext';

export type FinancialCategoryUsage = 'RECEIVABLE' | 'PAYABLE';

export interface CanonicalFinancialCategory {
  id: string;
  name: string;
  type: 'INCOME' | 'EXPENSE' | 'BOTH';
}

function rows(result: any): any[] {
  return Array.isArray(result?.rows) ? result.rows : [];
}

function rawTransaction(txContext: ITransactionContext): any {
  const raw = txContext.getRawTransaction?.();
  if (!raw) throw new Error('Financial category authority unavailable');
  return raw;
}

function isAllowed(type: string, usage: FinancialCategoryUsage): boolean {
  return type === 'BOTH' || (usage === 'RECEIVABLE' ? type === 'INCOME' : type === 'EXPENSE');
}

export async function listActiveFinancialCategories(
  companyId: string,
  txContext: ITransactionContext
): Promise<CanonicalFinancialCategory[]> {
  const raw = rawTransaction(txContext);
  const result = await raw.execute(sql`
    SELECT id, name, type
    FROM financial_categories
    WHERE company_id = ${companyId}
      AND active = true
      AND type IN ('INCOME', 'EXPENSE', 'BOTH')
    ORDER BY name, id
  `);
  return rows(result).map((row) => ({
    id: String(row.id),
    name: String(row.name),
    type: String(row.type) as CanonicalFinancialCategory['type'],
  }));
}

export async function assertFinancialCategoryForObligation(
  companyId: string,
  categoryId: string,
  usage: FinancialCategoryUsage,
  txContext: ITransactionContext
): Promise<void> {
  const normalizedId = typeof categoryId === 'string' ? categoryId.trim() : '';
  if (!normalizedId) throw new Error('Categoria financeira não encontrada');
  const raw = rawTransaction(txContext);
  const result = await raw.execute(sql`
    SELECT id, type, active
    FROM financial_categories
    WHERE company_id = ${companyId}
      AND id = ${normalizedId}
    LIMIT 1
  `);
  const category = rows(result)[0];
  if (!category) throw new Error('Categoria financeira não encontrada');
  if (category.active !== true) throw new Error('Categoria financeira inativa');
  const type = String(category.type);
  if (!isAllowed(type, usage)) {
    throw new Error(
      usage === 'RECEIVABLE'
        ? 'Categoria financeira incompatível com Conta a Receber'
        : 'Categoria financeira incompatível com Conta a Pagar'
    );
  }
}
""")

          for path, usage in [
              ('src/domain/finance/ReceivableService.ts', 'RECEIVABLE'),
              ('src/domain/finance/PayableService.ts', 'PAYABLE'),
          ]:
              replace_once(
                  path,
                  "import { ITransactionContext } from './ITransactionContext';",
                  "import { ITransactionContext } from './ITransactionContext';\nimport { assertFinancialCategoryForObligation } from './FinancialCategoryAuthority';"
              )
              permission = 'RECEIVABLE_CREATE' if usage == 'RECEIVABLE' else 'PAYABLE_CREATE'
              old = f"""    await FinancialAuthorizationService.authorize(\n      params.userId,\n      params.companyId,\n      '{permission}',\n      txContext\n    );\n\n    const installments"""
              new = f"""    await FinancialAuthorizationService.authorize(\n      params.userId,\n      params.companyId,\n      '{permission}',\n      txContext\n    );\n\n    if (txContext?.getRawTransaction) {{\n      await assertFinancialCategoryForObligation(params.companyId, params.categoryId, '{usage}', txContext);\n    }}\n\n    const installments"""
              replace_once(path, old, new)

          replace_once(
              'server.ts',
