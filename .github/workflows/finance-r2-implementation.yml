              "import { DepositService } from './src/domain/finance/DepositService';\nimport { listActiveFinancialCategories } from './src/domain/finance/FinancialCategoryAuthority';"
          )
          overview_anchor = """  // SECURITY-2G7B1: DRE is server-authoritative and tenant-scoped.\n"""
          categories_route = """  // FINANCE-R2: canonical active financial categories are server-authoritative.\n  app.get('/api/finance/categories', async (req: Request, res: Response) => {\n    const principal = requireFinancePrincipal(req, res);\n    if (!principal) return;\n\n    try {\n      const items = await UnitOfWork.run(principal.companyId, async (txContext) =>\n        await listActiveFinancialCategories(principal.companyId, txContext)\n      );\n      res.json({ items });\n    } catch (error) {\n      sendFinanceCommandError(res, error);\n    }\n  });\n\n"""
