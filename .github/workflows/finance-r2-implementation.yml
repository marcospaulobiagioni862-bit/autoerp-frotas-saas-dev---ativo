          normalizer = """function normalizeCategory(value: unknown): FinanceCategoryOption {\n  const record = asRecord(value);\n  const id = typeof record.id === 'string' ? record.id.trim() : '';\n  const name = typeof record.name === 'string' ? record.name.trim() : '';\n  const type = record.type;\n  if (!id || !name || (type !== 'INCOME' && type !== 'EXPENSE' && type !== 'BOTH')) {\n    throw new Error('Invalid finance category response');\n  }\n  return { id, name, type };\n}\n\n"""
          if text.count(marker) != 1: raise SystemExit('client normalizer anchor mismatch')
          text = text.replace(marker, normalizer + marker, 1)
          method_anchor = "export class FinanceObligationClient {\n"
          method = """export class FinanceObligationClient {\n  static async listFinancialCategories(): Promise<FinanceCategoryOption[]> {\n    return itemsFromPayload(await requestJson('/api/finance/categories')).map(normalizeCategory);\n  }\n\n"""
          if text.count(method_anchor) != 1: raise SystemExit('client class anchor mismatch')
          text = text.replace(method_anchor, method, 1)
          client.write_text(text)

          test = Path('src/api/__tests__/financeObligationClientTestRunner.ts')
          text = test.read_text()
          anchor = """    responder = async () => new Response(JSON.stringify({ items: [row] }), { status: 200, headers: { 'Content-Type': 'application/json' } });\n    calls = [];\n    const receivables = await FinanceObligationClient.listReceivables();\n"""
          addition = """    responder = async () => new Response(JSON.stringify({ items: [{ id: 'cat-income', name: 'Receitas', type: 'INCOME' }, { id: 'cat-both', name: 'Mista', type: 'BOTH' }] }), { status: 200, headers: { 'Content-Type': 'application/json' } });\n    calls = [];\n    const categories = await FinanceObligationClient.listFinancialCategories();\n    assert(calls[0].url === '/api/finance/categories', 'category list URL');\n    assert(calls[0].init?.credentials === 'include', 'category list credentials');\n    assert(categories.length === 2 && categories[0].type === 'INCOME', 'category normalization');\n    passed++;\n\n"""
          if text.count(anchor) != 1: raise SystemExit('client test anchor mismatch')
          text = text.replace(anchor, addition + anchor, 1)
          text = text.replace('FinanceObligationClient ${passed}/7 PASS', 'FinanceObligationClient ${passed}/8 PASS', 1)
          test.write_text(text)

          # Receivables UI
          p = Path('src/components/finance/ReceivablesView.tsx')
          text = p.read_text()
          text = text.replace(
              "import { FinanceObligationClient } from '../../api/financeObligationClient';",
              "import { FinanceObligationClient, type FinanceCategoryOption } from '../../api/financeObligationClient';", 1)
          text = text.replace(
              "  const [actionMessage, setActionMessage] = useState<string | null>(null);",
              "  const [actionMessage, setActionMessage] = useState<string | null>(null);\n  const [categories, setCategories] = useState<FinanceCategoryOption[]>([]);", 1)
          text = text.replace("useState<string>('cat-manual')", "useState<string>('')", 1)
          old_load = """      const list = await FinanceObligationClient.listReceivables();\n      setReceivables(list.sort((a, b) => new Date(b.dueDate).getTime() - new Date(a.dueDate).getTime()));"""
          new_load = """      const [list, categoryList] = await Promise.all([\n        FinanceObligationClient.listReceivables(),\n        FinanceObligationClient.listFinancialCategories(),\n      ]);\n      const incomeCategories = categoryList.filter((category) => category.type === 'INCOME' || category.type === 'BOTH');\n      setCategories(incomeCategories);\n      setCategoryId((current) => incomeCategories.some((category) => category.id === current) ? current : (incomeCategories[0]?.id || ''));\n      setReceivables(list.sort((a, b) => new Date(b.dueDate).getTime() - new Date(a.dueDate).getTime()));"""
          if text.count(old_load) != 1: raise SystemExit('receivable load anchor mismatch')
          text = text.replace(old_load, new_load, 1)
          text = text.replace("if (!description.trim() || !totalAmount || !dueDate) {", "if (!description.trim() || !totalAmount || !dueDate || !categoryId) {", 1)
          text = text.replace("setCategoryId('cat-manual');", "setCategoryId('');", 1)
          old_options = """                  <option value=\"cat-rent\">Aluguel / Locação</option>\n                  <option value=\"cat-deposit\">Caução / Depósito</option>\n                  <option value=\"cat-ticket\">Multa de Trânsito</option>\n                  <option value=\"cat-manual\">Outros Recebimentos</option>"""
          new_options = """                  <option value=\"\">Selecione uma categoria de receita</option>\n                  {categories.map((category) => (\n                    <option key={category.id} value={category.id}>{category.name}</option>\n                  ))}"""
          if text.count(old_options) != 1: raise SystemExit('receivable options anchor mismatch')
          text = text.replace(old_options, new_options, 1)
          p.write_text(text)

          # Payables UI
          p = Path('src/components/finance/PayablesView.tsx')
          text = p.read_text()
          text = text.replace(
              "import { FinanceObligationClient } from '../../api/financeObligationClient';",
              "import { FinanceObligationClient, type FinanceCategoryOption } from '../../api/financeObligationClient';", 1)
          text = text.replace(
              "  const [actionMessage, setActionMessage] = useState<string | null>(null);",
              "  const [actionMessage, setActionMessage] = useState<string | null>(null);\n  const [categories, setCategories] = useState<FinanceCategoryOption[]>([]);", 1)
          text = text.replace("useState<string>('cat-manual-payable')", "useState<string>('')", 1)
          old_load = """      const list = await FinanceObligationClient.listPayables();\n      setPayables(list.sort((a, b) => new Date(b.dueDate).getTime() - new Date(a.dueDate).getTime()));"""
          new_load = """      const [list, categoryList] = await Promise.all([\n        FinanceObligationClient.listPayables(),\n        FinanceObligationClient.listFinancialCategories(),\n      ]);\n      const expenseCategories = categoryList.filter((category) => category.type === 'EXPENSE' || category.type === 'BOTH');\n      setCategories(expenseCategories);\n      setCategoryId((current) => expenseCategories.some((category) => category.id === current) ? current : (expenseCategories[0]?.id || ''));\n      setPayables(list.sort((a, b) => new Date(b.dueDate).getTime() - new Date(a.dueDate).getTime()));"""
