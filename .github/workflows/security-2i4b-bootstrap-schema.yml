name: SECURITY-2I4B bootstrap schema gate

on:
  pull_request:
    branches:
      - ci-implement-security-2i4b-bootstrap-schema

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoerp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d autoerp_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoerp_ci
      NODE_ENV: test
      ALLOW_MOCK_AUTH: 'true'
      ATTACHMENT_STORAGE_DIR: /tmp/autoerp-attachments-ci
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: bfafc5868a80d4711f83796b357d0eadc049909b
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch bootstrap and canonical schema
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          routes = Path('src/server/vehicleRoutes.ts')
          text = routes.read_text()
          old = "import { registerAttachmentRoutes } from './attachmentRoutes';"
          new = old + "\nimport { registerDocumentRoutes } from './documentRoutes';"
          assert text.count(old) == 1 and 'registerDocumentRoutes' not in text
          text = text.replace(old, new)
          old_call = "  registerAttachmentRoutes(app);"
          new_call = old_call + "\n  registerDocumentRoutes(app);"
          assert text.count(old_call) == 1
          text = text.replace(old_call, new_call)
          routes.write_text(text)

          schema = Path('src/db/schema.ts')
          text = schema.read_text()
          marker = "export const communicationLogs = pgTable('communication_logs', {"
          assert text.count(marker) == 1
          assert "export const documents = pgTable('documents'" not in text
          block = """export const documents = pgTable('documents', {
  id: text('id').primaryKey(),
  companyId: text('company_id').notNull(),
  subjectType: text('subject_type').notNull(),
  subjectId: text('subject_id').notNull(),
  documentType: text('document_type').notNull(),
  documentNumber: text('document_number'),
  referenceYear: integer('reference_year'),
  issueDate: text('issue_date'),
  expirationDate: text('expiration_date'),
  attachmentId: text('attachment_id'),
  versionNumber: integer('version_number').notNull().default(1),
  supersedesDocumentId: text('supersedes_document_id'),
  isCurrent: boolean('is_current').notNull().default(true),
  isArchived: boolean('is_archived').notNull().default(false),
  cost: numeric('cost', { precision: 12, scale: 2 }).notNull().default('0'),
  payableId: text('payable_id'),
  notes: text('notes'),
  createdBy: text('created_by').notNull(),
  createdAt: timestamp('created_at', { mode: 'string' }).notNull().defaultNow(),
  updatedAt: timestamp('updated_at', { mode: 'string' }).notNull().defaultNow(),
}, (t) => ({
  idxCompanySubjectCurrent: index('idx_documents_company_subject_current').on(t.companyId, t.subjectType, t.subjectId, t.isCurrent, t.isArchived),
  idxCompanyTypeCurrent: index('idx_documents_company_type_current').on(t.companyId, t.documentType, t.isCurrent, t.isArchived),
  idxCompanyExpiration: index('idx_documents_company_expiration').on(t.companyId, t.expirationDate, t.isCurrent, t.isArchived),
  idxAttachment: index('idx_documents_attachment').on(t.companyId, t.attachmentId),
}));

"""
          text = text.replace(marker, block + marker)
          schema.write_text(text)
          PY
      - name: Exact patch scope
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/db/schema.ts src/server/vehicleRoutes.ts | sort)"
          test "$changed" = "$expected"
          grep -F "registerDocumentRoutes(app);" src/server/vehicleRoutes.ts >/dev/null
          grep -F "export const documents = pgTable('documents'" src/db/schema.ts >/dev/null
          git diff --check
      - name: Install
        run: npm install --no-package-lock --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Apply migrations and document integration
        env:
          PGPASSWORD: postgres
        run: |
          for file in $(find drizzle -maxdepth 1 -name '*.sql' | sort); do psql -h localhost -U postgres -d autoerp_ci -v ON_ERROR_STOP=1 -f "$file"; done
          npx tsx src/server/__tests__/documentAuthorityIntegration.ts
      - name: Publish after green
        run: |
          git config user.name 'autoerp-security-controller'
          git config user.email 'actions@users.noreply.github.com'
          git add src/db/schema.ts src/server/vehicleRoutes.ts
          git commit -m 'feat(server): register document authority and align Drizzle schema'
          git push origin HEAD:security-2i4b-document-semantics
