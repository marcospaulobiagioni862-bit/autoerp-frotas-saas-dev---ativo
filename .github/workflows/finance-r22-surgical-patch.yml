name: FINANCE-R22 Surgical Implementation Patch

on:
  push:
    branches:
      - finance-r22-deposit-receipt-idempotency
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finance-r22-deposit-receipt-idempotency
          fetch-depth: 0

      - name: Patch FINANCE-R22 authoritative deposit receipt path
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_s, old, new):
              path = Path(path_s)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'FAIL {path_s}: anchor count={count}, expected=1\nANCHOR={old[:160]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Transaction context: recover the original deposit movement by tx id.
          replace_once(
              'src/domain/finance/ITransactionContext.ts',
              "export interface ITransactionSecurityDepositMovementRepository {\n  create(item: SecurityDepositMovement): Promise<SecurityDepositMovement>;\n}",
              "export interface ITransactionSecurityDepositMovementRepository {\n  findByFinancialTransactionId(financialTransactionId: string): Promise<SecurityDepositMovement | null>;\n  create(item: SecurityDepositMovement): Promise<SecurityDepositMovement>;\n}"
          )

          # PostgreSQL movement lookup remains inside tenant-scoped UOW/RLS.
          replace_once(
              'src/db/repositories/postgresRepositories.ts',
              "  async create(item: SecurityDepositMovement): Promise<SecurityDepositMovement> {\n    const rows = await this.tx.insert(securityDepositMovements).values({",
              "  async findByFinancialTransactionId(financialTransactionId: string): Promise<SecurityDepositMovement | null> {\n    const rows = await this.tx.select().from(securityDepositMovements)\n      .where(eq(securityDepositMovements.financialTransactionId, financialTransactionId))\n      .limit(1);\n    return rows[0] ? this.map(rows[0]) : null;\n  }\n\n  async create(item: SecurityDepositMovement): Promise<SecurityDepositMovement> {\n    const rows = await this.tx.insert(securityDepositMovements).values({"
          )

          # Public service keeps legacy call compatibility; authoritative UOW requires the key.
          replace_once(
              'src/domain/finance/DepositService.ts',
              "    userName: string,\n    txContext?: ITransactionContext\n  ): Promise<{ deposit: SecurityDeposit; movement: SecurityDepositMovement }> {",
              "    userName: string,\n    txContext?: ITransactionContext,\n    idempotencyKey?: string\n  ): Promise<{ deposit: SecurityDeposit; movement: SecurityDepositMovement }> {"
          )
          replace_once(
              'src/domain/finance/DepositService.ts',
              "        userName,\n        txContext\n      );",
              "        userName,\n        txContext,\n        idempotencyKey\n      );"
          )
          replace_once(
              'src/domain/finance/DepositService.ts',
              "    userName: string,\n    txContext: ITransactionContext\n  ): Promise<{ deposit: SecurityDeposit; movement: SecurityDepositMovement }> {",
              "    userName: string,\n    txContext: ITransactionContext,\n    idempotencyKey?: string\n  ): Promise<{ deposit: SecurityDeposit; movement: SecurityDepositMovement }> {"
          )

          replace_once(
              'src/domain/finance/DepositService.ts',
              "    const contractRepo = txContext.getContractRepo();\n\n    await depositRepo.lockContract(companyId, contractId);",
              "    const contractRepo = txContext.getContractRepo();\n\n    const commandKey = typeof idempotencyKey === 'string' ? idempotencyKey.trim() : '';\n    if (!commandKey || commandKey.length > 200) {\n      throw new Error('Chave de idempotência do recebimento de caução é obrigatória e deve ter até 200 caracteres');\n    }\n    if (!txContext.findFinancialTransactionByIdempotencyKey || !txContext.findFinancialAccountByIdWithLock || !movementRepo.findByFinancialTransactionId) {\n      throw new Error('Autoridade transacional idempotente da caução indisponível');\n    }\n\n    await depositRepo.lockContract(companyId, contractId);"
          )

          replace_once(
              'src/domain/finance/DepositService.ts',
              "    const newReceived = roundCurrency(deposit.receivedAmount + amount);\n    if (newReceived > originalAmount) {",
              "    const description = `Recebimento de Caução (Contrato: ${contractId})`;\n    const existingTx = await txContext.findFinancialTransactionByIdempotencyKey(commandKey);\n    if (existingTx) {\n      const sameCommand =\n        existingTx.companyId === companyId &&\n        existingTx.type === TransactionType.INCOME &&\n        !existingTx.receivableId &&\n        !existingTx.payableId &&\n        existingTx.financialAccountId === financialAccountId &&\n        existingTx.paymentMethodId === paymentMethodId &&\n        roundCurrency(Number(existingTx.amount)) === roundCurrency(amount) &&\n        existingTx.description === description &&\n        existingTx.vehicleId === canonicalVehicleId &&\n        existingTx.driverId === canonicalDriverId;\n      if (!sameCommand) {\n        throw new Error('Chave de idempotência reutilizada com recebimento de caução diferente');\n      }\n\n      const originalMovement = await movementRepo.findByFinancialTransactionId(existingTx.id);\n      if (\n        !originalMovement ||\n        originalMovement.companyId !== companyId ||\n        originalMovement.securityDepositId !== deposit.id ||\n        originalMovement.type !== SecurityDepositMovementType.RECEIPT ||\n        originalMovement.financialTransactionId !== existingTx.id ||\n        roundCurrency(Number(originalMovement.amount)) !== roundCurrency(amount)\n      ) {\n        throw new Error('Evidência idempotente do recebimento de caução está inconsistente');\n      }\n      return { deposit, movement: originalMovement };\n    }\n\n    const newReceived = roundCurrency(deposit.receivedAmount + amount);\n    if (newReceived > originalAmount) {"
          )

          replace_once(
              'src/domain/finance/DepositService.ts',
              "    const account = await accountRepo.findById(financialAccountId);\n    if (!account || account.companyId !== companyId || account.status !== 'ACTIVE') {",
              "    const account = await txContext.findFinancialAccountByIdWithLock(financialAccountId);\n    if (!account || account.companyId !== companyId || account.status !== 'ACTIVE') {"
          )

          replace_once(
              'src/domain/finance/DepositService.ts',
              "      description: `Recebimento de Caução (Contrato: ${contractId})`,\n      isReversed: false,",
              "      description,\n      isReversed: false,"
          )
          replace_once(
              'src/domain/finance/DepositService.ts',
              "      createdById: userId,\n      createdAt: now,",
              "      createdById: userId,\n      idempotencyKey: commandKey,\n      createdAt: now,"
          )

          # Server boundary requires and forwards the logical command key.
          replace_once(
              'server.ts',
              "    const paymentMethodId = typeof req.body?.paymentMethodId === 'string' ? req.body.paymentMethodId.trim() : '';\n\n    if (!contractId || !Number.isFinite(amount) || amount <= 0 || !financialAccountId || !paymentMethodId) {",
              "    const paymentMethodId = typeof req.body?.paymentMethodId === 'string' ? req.body.paymentMethodId.trim() : '';\n    const idempotencyKey = typeof req.body?.idempotencyKey === 'string' ? req.body.idempotencyKey.trim() : '';\n\n    if (!contractId || !Number.isFinite(amount) || amount <= 0 || !financialAccountId || !paymentMethodId || !idempotencyKey || idempotencyKey.length > 200) {"
          )
          replace_once(
              'server.ts',
              "          principal.name,\n          txContext\n        );",
              "          principal.name,\n          txContext,\n          idempotencyKey\n        );"
          )

          # UI follows the R21 retry contract: rotate only when the command changes or succeeds.
          replace_once(
              'src/components/contracts/ContractDetailsModal.tsx',
              "import { FinanceDepositClient } from '../../api/financeDepositClient';",
              "import { FinanceDepositClient, createDepositReceiptIdempotencyKey } from '../../api/financeDepositClient';"
          )
          replace_once(
              'src/components/contracts/ContractDetailsModal.tsx',
              "  const [depositPaymentMethodId, setDepositPaymentMethodId] = useState('');\n  const [loading, setLoading] = useState(false);",
              "  const [depositPaymentMethodId, setDepositPaymentMethodId] = useState('');\n  const [depositIdempotencyKey, setDepositIdempotencyKey] = useState(() => createDepositReceiptIdempotencyKey());\n  const [loading, setLoading] = useState(false);"
          )
          replace_once(
              'src/components/contracts/ContractDetailsModal.tsx',
              "    setSettlementOptions(EMPTY_SETTLEMENT_OPTIONS); setDepositAmount(''); setDepositAccountId(''); setDepositPaymentMethodId('');\n    setError(null); setSuccess(null);",
              "    setSettlementOptions(EMPTY_SETTLEMENT_OPTIONS); setDepositAmount(''); setDepositAccountId(''); setDepositPaymentMethodId('');\n    setDepositIdempotencyKey(createDepositReceiptIdempotencyKey());\n    setError(null); setSuccess(null);"
          )
          replace_once(
              'src/components/contracts/ContractDetailsModal.tsx',
              "    void action(() => FinanceDepositClient.receive({\n      contractId: contract.id,\n      amount,\n      financialAccountId: depositAccountId,\n      paymentMethodId: depositPaymentMethodId,\n    }), 'Caução recebida com sucesso.');",
              "    void action(async () => {\n      await FinanceDepositClient.receive({\n        contractId: contract.id,\n        amount,\n        financialAccountId: depositAccountId,\n        paymentMethodId: depositPaymentMethodId,\n        idempotencyKey: depositIdempotencyKey,\n      });\n      setDepositIdempotencyKey(createDepositReceiptIdempotencyKey());\n    }, 'Caução recebida com sucesso.');"
          )

          # Rotate deposit command key whenever a user edits the logical payload.
          path = Path('src/components/contracts/ContractDetailsModal.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ("onChange={(event) => setDepositAmount(event.target.value)}", "onChange={(event) => { setDepositAmount(event.target.value); setDepositIdempotencyKey(createDepositReceiptIdempotencyKey()); }}"),
              ("onChange={(event) => setDepositAccountId(event.target.value)}", "onChange={(event) => { setDepositAccountId(event.target.value); setDepositIdempotencyKey(createDepositReceiptIdempotencyKey()); }}"),
              ("onChange={(event) => setDepositPaymentMethodId(event.target.value)}", "onChange={(event) => { setDepositPaymentMethodId(event.target.value); setDepositIdempotencyKey(createDepositReceiptIdempotencyKey()); }}"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'FAIL ContractDetails input anchor {old}: count={count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Existing R4 direct UOW calls now provide unique authoritative command keys.
          path = Path('src/server/__tests__/securityDepositAuthorityIntegration.ts')
          text = path.read_text(encoding='utf-8')
          anchors = [
              ("'Finance R4 Admin A',\n      tx\n    )", "'Finance R4 Admin A',\n      tx,\n      'finance-r4-receipt-1'\n    )", 1),
              ("'Finance R4 Admin A',\n      tx\n    )", "'Finance R4 Admin A',\n      tx,\n      'finance-r4-receipt-2'\n    )", 1),
              ("companyA, contractA1, 'ignored', 'ignored', 0.01, accountA, paymentA, adminA, 'Finance R4 Admin A', tx", "companyA, contractA1, 'ignored', 'ignored', 0.01, accountA, paymentA, adminA, 'Finance R4 Admin A', tx, 'finance-r4-over'", 1),
              ("companyA, contractA2, 'ignored', 'ignored', 100, accountB, paymentA, adminA, 'Finance R4 Admin A', tx", "companyA, contractA2, 'ignored', 'ignored', 100, accountB, paymentA, adminA, 'Finance R4 Admin A', tx, 'finance-r4-foreign-account'", 1),
              ("companyA, contractA2, 'ignored', 'ignored', 100, accountA, paymentB, adminA, 'Finance R4 Admin A', tx", "companyA, contractA2, 'ignored', 'ignored', 100, accountA, paymentB, adminA, 'Finance R4 Admin A', tx, 'finance-r4-foreign-method'", 1),
              ("companyA, 'finance-r4-contract-b1', 'ignored', 'ignored', 100, accountA, paymentA, adminA, 'Finance R4 Admin A', tx", "companyA, 'finance-r4-contract-b1', 'ignored', 'ignored', 100, accountA, paymentA, adminA, 'Finance R4 Admin A', tx, 'finance-r4-foreign-contract'", 1),
          ]
          for old, new, expected in anchors:
              count = text.count(old)
              if count < expected:
                  raise SystemExit(f'FAIL R4 anchor count={count}: {old[:100]!r}')
              text = text.replace(old, new, expected)
          path.write_text(text, encoding='utf-8')

      - name: Prove scope and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | wc -l)" -eq 6
          grep -q "findByFinancialTransactionId" src/domain/finance/ITransactionContext.ts
          grep -q "idempotencyKey: commandKey" src/domain/finance/DepositService.ts
          grep -q "findFinancialAccountByIdWithLock" src/domain/finance/DepositService.ts
          grep -q "idempotencyKey: depositIdempotencyKey" src/components/contracts/ContractDetailsModal.tsx
          grep -q "idempotencyKey.length > 200" server.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/finance/ITransactionContext.ts src/db/repositories/postgresRepositories.ts src/domain/finance/DepositService.ts server.ts src/components/contracts/ContractDetailsModal.tsx src/server/__tests__/securityDepositAuthorityIntegration.ts
          git commit -m "FINANCE-R22 make deposit receipt durably idempotent"
          git push origin HEAD:finance-r22-deposit-receipt-idempotency
