name: SECURITY-2I3 implementation gate

on:
  pull_request:
    branches:
      - ci-implement-security-2i3

permissions:
  contents: write
  pull-requests: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoerp_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d autoerp_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoerp_ci
      NODE_ENV: test
      ALLOW_MOCK_AUTH: 'true'

    steps:
      - name: Checkout exact materialized candidate
        uses: actions/checkout@v4
        with:
          ref: 41c846f0c07a7831dd9e9056faf02672e90effa9
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Exact base and materialized scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "41c846f0c07a7831dd9e9056faf02672e90effa9"
          test "$(git merge-base b4ded6b5fb726cb3983f73b8323f3957a779a343 HEAD)" = "b4ded6b5fb726cb3983f73b8323f3957a779a343"
          changed="$(git diff --name-only b4ded6b5fb726cb3983f73b8323f3957a779a343..HEAD | sort)"
          expected="$(printf '%s\n' \
            drizzle/0011_contract_core_authority.sql \
            drizzle/meta/_journal.json \
            src/api/__tests__/contractClientTestRunner.ts \
            src/api/contractClient.ts \
            src/components/contracts/ContractDetailsModal.tsx \
            src/components/contracts/ContractFormModal.tsx \
            src/components/contracts/ContractLegacyDetailsBridge.ts \
            src/components/contracts/ContractsManagement.tsx \
            src/db/repositories/postgresContractRepository.ts \
            src/db/repositories/postgresDriverRepository.ts \
            src/db/uow.ts \
            src/domain/finance/ITransactionContext.ts \
            src/server/__tests__/contractAuthorityIntegration.ts \
            src/server/contractRoutes.ts | sort)"
          printf 'MATERIALIZED_I3_DIFF:\n%s\n' "$changed"
          test "$changed" = "$expected"

      - name: Apply exact final wiring and hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          vehicle = Path('src/server/vehicleRoutes.ts')
          text = vehicle.read_text()
          old = "import { registerDriverRoutes } from './driverRoutes';"
          assert text.count(old) == 1, f'vehicle import count={text.count(old)}'
          text = text.replace(old, old + "\nimport { registerContractRoutes } from './contractRoutes';")
          old_call = '  registerDriverRoutes(app);'
          assert text.count(old_call) == 1, f'driver registration count={text.count(old_call)}'
          text = text.replace(old_call, old_call + "\n  registerContractRoutes(app);")
          vehicle.write_text(text)

          routes = Path('src/server/contractRoutes.ts')
          text = routes.read_text()
          old = "  if (driver.cnhStatus === DocumentStatus.EXPIRED) throw new ContractConflictError('Driver CNH expired');"
          assert text.count(old) == 1, f'CNH gate count={text.count(old)}'
          new = "  if (![DocumentStatus.VALID, DocumentStatus.EXPIRING_SOON].includes(driver.cnhStatus)) throw new ContractConflictError('Driver CNH invalid');"
          text = text.replace(old, new)

          old = '          originId: active.id,'
          assert text.count(old) == 1, f'activation origin count={text.count(old)}'
          text = text.replace(old, '          originId: `${active.id}:${active.startDate}`,')

          old = '          originId: contract.id,'
          assert text.count(old) == 1, f'billing origin count={text.count(old)}'
          text = text.replace(old, '          originId: `${contract.id}:${competenceDate}`,')
          routes.write_text(text)
          PY

      - name: Final implementation scope
        shell: bash
        run: |
          changed="$({ git diff --name-only b4ded6b5fb726cb3983f73b8323f3957a779a343..HEAD; git diff --name-only; } | sort -u)"
          expected="$(printf '%s\n' \
            drizzle/0011_contract_core_authority.sql \
            drizzle/meta/_journal.json \
            src/api/__tests__/contractClientTestRunner.ts \
            src/api/contractClient.ts \
            src/components/contracts/ContractDetailsModal.tsx \
            src/components/contracts/ContractFormModal.tsx \
            src/components/contracts/ContractLegacyDetailsBridge.ts \
            src/components/contracts/ContractsManagement.tsx \
            src/db/repositories/postgresContractRepository.ts \
            src/db/repositories/postgresDriverRepository.ts \
            src/db/uow.ts \
            src/domain/finance/ITransactionContext.ts \
            src/server/__tests__/contractAuthorityIntegration.ts \
            src/server/contractRoutes.ts \
            src/server/vehicleRoutes.ts | sort)"
          printf 'FINAL_I3_SCOPE:\n%s\n' "$changed"
          test "$changed" = "$expected"

      - name: Static authority gate
        shell: bash
        run: |
          grep -F '0011_contract_core_authority' drizzle/meta/_journal.json >/dev/null
          grep -F 'ALTER TABLE contracts FORCE ROW LEVEL SECURITY' drizzle/0011_contract_core_authority.sql >/dev/null
          grep -F 'AS PERMISSIVE' drizzle/0011_contract_core_authority.sql >/dev/null
          grep -F 'WITH CHECK' drizzle/0011_contract_core_authority.sql >/dev/null
          grep -F 'uq_contract_active_vehicle' drizzle/0011_contract_core_authority.sql >/dev/null
          grep -F 'uq_contract_active_driver' drizzle/0011_contract_core_authority.sql >/dev/null
          grep -F 'getDriverRepo().findByIdForCompanyWithLock' src/server/contractRoutes.ts >/dev/null
          grep -F 'getVehicleRepo().findByIdForCompanyWithLock' src/server/contractRoutes.ts >/dev/null
          grep -F 'ReceivableService.create' src/server/contractRoutes.ts >/dev/null
          grep -F 'originId: `${active.id}:${active.startDate}`' src/server/contractRoutes.ts >/dev/null
          grep -F 'originId: `${contract.id}:${competenceDate}`' src/server/contractRoutes.ts >/dev/null
          grep -F 'registerContractRoutes(app)' src/server/vehicleRoutes.ts >/dev/null
          grep -F 'static async activate' src/api/contractClient.ts >/dev/null
          grep -F 'static async bill' src/api/contractClient.ts >/dev/null
          if grep -E 'ContractRepository|VehicleRepository|DriverRepository|ContractService' src/components/contracts/ContractsManagement.tsx; then exit 1; fi
          if grep -E 'ContractRepository|VehicleRepository|DriverRepository|ContractService|usr-admin|Administrador' src/components/contracts/ContractFormModal.tsx; then exit 1; fi
          if grep -E 'ContractRepository|VehicleRepository|DriverRepository|ContractService' src/components/contracts/ContractDetailsModal.tsx; then exit 1; fi
          if grep -E 'new (ContractRepository|VehicleRepository|DriverRepository)' src/components/contracts/ContractLegacyDetailsBridge.ts; then exit 1; fi
          if grep -F "app.delete('/api/contracts" src/server/contractRoutes.ts; then exit 1; fi

      - name: Install
        run: npm install --no-package-lock --no-audit --no-fund

      - name: TypeScript
        run: npm run lint

      - name: Build
        run: npm run build

      - name: ContractClient transport
        run: npx tsx -e "import('./src/api/__tests__/contractClientTestRunner.ts').then(async (m) => { await m.ContractClientTestRunner.runAllTests(); console.log('ContractClient PASS'); })"

      - name: PostgreSQL16 migrations 0000 through 0010
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          for file in $(find drizzle -maxdepth 1 -name '*.sql' ! -name '0011_contract_core_authority.sql' | sort); do
            echo "Applying $file"
            psql -h localhost -U postgres -d autoerp_ci -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Seed legacy Contract before 0011
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          psql -h localhost -U postgres -d autoerp_ci -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO contracts (id, company_id, driver_id, vehicle_id, status, created_at, updated_at)
          VALUES ('legacy-contract-i3', 'legacy-company-i3', 'legacy-driver-i3', 'legacy-vehicle-i3', 'DRAFT', '2026-08-01T12:00:00Z', '2026-08-01T12:00:00Z');
          SQL

      - name: Apply 0011 and prove schema backfill RLS indexes
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          psql -h localhost -U postgres -d autoerp_ci -v ON_ERROR_STOP=1 -f drizzle/0011_contract_core_authority.sql
          psql -h localhost -U postgres -d autoerp_ci -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            r record;
            rls_enabled boolean;
            rls_forced boolean;
            policy_using text;
            policy_check text;
            index_count integer;
          BEGIN
            SELECT contract_number, start_date, rental_amount, is_archived INTO r
            FROM contracts WHERE id='legacy-contract-i3';
            IF r.contract_number NOT LIKE 'LEGACY-%' OR r.start_date <> '2026-08-01' OR r.rental_amount <> 0 OR r.is_archived IS DISTINCT FROM false THEN
              RAISE EXCEPTION 'legacy Contract backfill failed: %', row_to_json(r);
            END IF;

            SELECT relrowsecurity, relforcerowsecurity INTO rls_enabled, rls_forced
            FROM pg_class WHERE oid='public.contracts'::regclass;
            IF NOT rls_enabled OR NOT rls_forced THEN RAISE EXCEPTION 'contracts RLS/FORCE failed'; END IF;

            SELECT qual, with_check INTO policy_using, policy_check
            FROM pg_policies WHERE schemaname='public' AND tablename='contracts' AND policyname='tenant_isolation_ct';
            IF policy_using IS NULL OR policy_using NOT LIKE '%app.current_tenant%' THEN RAISE EXCEPTION 'Contract USING failed'; END IF;
            IF policy_check IS NULL OR policy_check NOT LIKE '%app.current_tenant%' THEN RAISE EXCEPTION 'Contract WITH CHECK failed'; END IF;

            SELECT count(*) INTO index_count FROM pg_indexes
            WHERE schemaname='public' AND tablename='contracts'
              AND indexname IN ('uq_contract_company_number','uq_contract_active_vehicle','uq_contract_active_driver');
            IF index_count <> 3 THEN RAISE EXCEPTION 'Contract unique indexes missing: %', index_count; END IF;
          END $$;
          SQL

      - name: Contract authority PostgreSQL integration
        run: npx tsx src/server/__tests__/contractAuthorityIntegration.ts

      - name: Required regressions
        env:
          NODE_ENV: test
          USE_PGLITE: 'true'
          ALLOW_MOCK_AUTH: 'false'
          JWT_SECRET: security-2i3-regression-secret-at-least-32-bytes
          JWT_ISSUER: autoerp-ci
          JWT_AUDIENCE: autoerp-users
        shell: bash
        run: |
          npx tsx src/api/__tests__/contractClientTestRunner.ts
          npx tsx src/api/__tests__/driverClientTestRunner.ts
          npx tsx src/api/__tests__/vehicleClientTestRunner.ts
          npx tsx src/api/__tests__/driverHealthClientTestRunner.ts
          npx tsx src/api/__tests__/financeDepositClientTestRunner.ts
          npx tsx src/api/__tests__/financeReportingClientTestRunner.ts
          npx tsx src/api/__tests__/financeOverviewClientTestRunner.ts
          npx tsx src/api/__tests__/financeObligationClientTestRunner.ts
          npx tsx src/api/__tests__/financeSettlementClientTestRunner.ts
          npx tsx src/api/__tests__/financeTransactionClientTestRunner.ts
          npx tsx src/api/__tests__/financeRenegotiationClientTestRunner.ts
          npx tsx src/domain/services/__tests__/contractTestRunner.ts
          npx tsx src/domain/finance/__tests__/financeTestRunner.ts
          npx tsx src/domain/services/__tests__/securityTestRunner.ts
          npx tsx src/auth/__tests__/authSessionTestRunner.ts
          npx tsx src/server/__tests__/bootstrapTestRunner.ts
          npx tsx src/server/__tests__/sessionLoginTestRunner.ts
          npx tsx src/server/__tests__/passwordTestRunner.ts
          npx tsx src/server/__tests__/authTestRunner.ts

      - name: Diff safety
        shell: bash
        run: |
          git diff --check
          ! git diff --name-only | grep -E '^package(-lock)?\.json$'
          ! git diff | grep -E '@ts-ignore|ts-ignore'

      - name: Commit validated final wiring
        shell: bash
        run: |
          git config user.name 'autoerp-security-controller'
          git config user.email 'actions@users.noreply.github.com'
          git add src/server/vehicleRoutes.ts src/server/contractRoutes.ts
          git commit -m 'fix(security): wire Contract routes and period-scope billing'
          git push origin HEAD:security-2i3-contract-binding-authority
          echo "PUBLISHED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: CI report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'AUTOERP_SECURITY_2I3_IMPLEMENTATION_REPORT',
              `STATUS=${{ job.status }}`,
              `RUN_ID=${context.runId}`,
              `PUBLISHED_SHA=${process.env.PUBLISHED_SHA || 'not-published'}`,
              'BASE=b4ded6b5fb726cb3983f73b8323f3957a779a343',
              'SCOPE=Contract core + atomic Driver/Vehicle binding + initial receivable',
              'BILLING_ORIGIN=contract+competence to satisfy legacy installment uniqueness',
              'PostgreSQL16/RLS/RBAC/rollback/idempotency required',
              'ContractClient + Driver/Vehicle/Finance/Security/auth regressions required'
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });