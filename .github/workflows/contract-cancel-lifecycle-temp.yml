name: Contract Cancel Lifecycle Temporary Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-contract-cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoerp_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autoerp_phase1_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      USE_PGLITE: "false"
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_HOST: 127.0.0.1
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/autoerp_phase1_test
      RECURRING_SCHEDULER_ENABLED: "false"
      JWT_SECRET: autoerp-contract-cancel-test-jwt-secret-that-is-long-enough
      JWT_ISSUER: autoerp-contract-cancel-test
      JWT_AUDIENCE: autoerp-contract-cancel-test-client

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false
      - name: TypeScript
        run: npm run lint
      - name: Apply migrations
        run: node migrate_test_db.cjs
      - name: ACTIVE cancellation integration regression
        run: npx tsx src/server/__tests__/contractCancelLifecycleRegression.ts
