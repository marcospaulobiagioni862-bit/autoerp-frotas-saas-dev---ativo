name: TEMP FINANCE-R15 Authority Patch

on:
  push:
    branches:
      - finance-r15-financial-period-authority

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finance-r15-financial-period-authority
          fetch-depth: 0

      - name: Apply exact R15 authority patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 anchor, found {count}')
              return text.replace(old, new, 1)

          engine_path = Path('src/domain/finance/FinanceEngine.ts')
          engine = engine_path.read_text()
          engine = replace_once(
              engine,
              "  public static uowRunner: ((companyId: string, callback: (txContext: ITransactionContext) => Promise<any>) => Promise<any>) | null = null;",
              "  public static uowRunner: ((companyId: string, callback: (txContext: ITransactionContext) => Promise<any>, options?: { financialPeriodLock?: 'SHARED' | 'EXCLUSIVE' }) => Promise<any>) | null = null;",
              'FinanceEngine.uowRunner signature',
          )
          old_period_block = """  // 13. Financial Period Closing
          public static async closeFinancialPeriod(params: ClosePeriodParams): Promise<FinancialPeriod> {
            return FinancialPeriodService.closePeriod(params);
          }

          public static async reopenFinancialPeriod(params: ReopenPeriodParams): Promise<FinancialPeriod> {
            return FinancialPeriodService.reopenPeriod(params);
          }

          public static async getFinancialPeriods(companyId: string): Promise<FinancialPeriod[]> {
            return FinancialPeriodService.getPeriods(companyId);
          }

          public static async assertFinancialPeriodOpen(companyId: string, date: string): Promise<void> {
            return FinancialPeriodService.assertDateOpen(companyId, date);
          }
"""
          new_period_block = """  // 13. Financial Period Closing
          public static async closeFinancialPeriod(params: ClosePeriodParams): Promise<FinancialPeriod> {
            if (this.uowRunner) {
              return this.uowRunner(
                params.companyId,
                async (txContext) => FinancialPeriodService.closePeriod(params, txContext),
                { financialPeriodLock: 'EXCLUSIVE' }
              );
            }
            return FinancialPeriodService.closePeriod(params);
          }

          public static async reopenFinancialPeriod(params: ReopenPeriodParams): Promise<FinancialPeriod> {
            if (this.uowRunner) {
              return this.uowRunner(
                params.companyId,
                async (txContext) => FinancialPeriodService.reopenPeriod(params, txContext),
                { financialPeriodLock: 'EXCLUSIVE' }
              );
            }
            return FinancialPeriodService.reopenPeriod(params);
          }

          public static async getFinancialPeriods(companyId: string): Promise<FinancialPeriod[]> {
            if (this.uowRunner) {
              return this.uowRunner(companyId, async (txContext) =>
                FinancialPeriodService.getPeriods(companyId, txContext)
              );
            }
            return FinancialPeriodService.getPeriods(companyId);
          }

          public static async assertFinancialPeriodOpen(companyId: string, date: string): Promise<void> {
            if (this.uowRunner) {
              return this.uowRunner(
                companyId,
                async (txContext) => FinancialPeriodService.assertDateOpen(companyId, date, txContext),
                { financialPeriodLock: 'SHARED' }
              );
            }
            return FinancialPeriodService.assertDateOpen(companyId, date);
          }
"""
          engine = replace_once(engine, old_period_block, new_period_block, 'FinanceEngine financial period block')
          engine_path.write_text(engine)

          server_path = Path('server.ts')
          server = server_path.read_text()
          server = replace_once(
              server,
              "import { DepositService } from './src/domain/finance/DepositService';\n",
              "import { DepositService } from './src/domain/finance/DepositService';\nimport { FinancialPeriodService } from './src/domain/finance/FinancialPeriodService';\nimport { FinancialAuthorizationService } from './src/domain/finance/FinancialAuthorizationService';\n",
              'server period imports',
          )

          period_routes = r"""
          // FINANCE-R15: financial-period administration uses the same PostgreSQL
          // source and advisory lock boundary enforced by money-moving commands.
          app.get('/api/finance/periods', async (req: Request, res: Response) => {
            const principal = requireFinancePrincipal(req, res);
            if (!principal) return;

            try {
              const items = await UnitOfWork.run(principal.companyId, async (txContext) => {
                await FinancialAuthorizationService.authorize(
                  principal.userId,
                  principal.companyId,
                  'VIEW_FINANCIAL',
                  txContext
                );
                return FinancialPeriodService.getPeriods(principal.companyId, txContext);
              });
              res.json({ items });
            } catch (error) {
              sendFinanceCommandError(res, error);
            }
          });

          app.post('/api/finance/periods/close', async (req: Request, res: Response) => {
            const principal = requireFinancePrincipal(req, res);
            if (!principal) return;

            const startDate = typeof req.body?.startDate === 'string' ? req.body.startDate.trim() : '';
            const endDate = typeof req.body?.endDate === 'string' ? req.body.endDate.trim() : '';
            const datePattern = /^\d{4}-\d{2}-\d{2}$/;
            if (!datePattern.test(startDate) || !datePattern.test(endDate) || startDate > endDate) {
              res.status(400).json({ error: 'Invalid financial period close request' });
              return;
            }

            try {
              const item = await UnitOfWork.run(
                principal.companyId,
                async (txContext) => FinancialPeriodService.closePeriod(
                  {
                    companyId: principal.companyId,
                    startDate,
                    endDate,
                    userId: principal.userId,
                    userName: principal.name,
                  },
                  txContext
                ),
                { financialPeriodLock: 'EXCLUSIVE' }
              );
              res.status(201).json({ item });
            } catch (error) {
              sendFinanceCommandError(res, error);
            }
          });

          app.post('/api/finance/periods/:id/reopen', async (req: Request, res: Response) => {
            const principal = requireFinancePrincipal(req, res);
            if (!principal) return;

            const periodId = typeof req.params.id === 'string' ? req.params.id.trim() : '';
            const reason = typeof req.body?.reason === 'string' ? req.body.reason.trim() : '';
            if (!periodId || !reason || reason.length > 1000) {
              res.status(400).json({ error: 'Invalid financial period reopen request' });
              return;
            }

            try {
              const item = await UnitOfWork.run(
                principal.companyId,
                async (txContext) => FinancialPeriodService.reopenPeriod(
                  {
                    companyId: principal.companyId,
                    periodId,
                    reason,
                    userId: principal.userId,
                    userName: principal.name,
                  },
                  txContext
                ),
                { financialPeriodLock: 'EXCLUSIVE' }
              );
              res.json({ item });
            } catch (error) {
              sendFinanceCommandError(res, error);
            }
          });

"""
          server = replace_once(
              server,
              "  // SECURITY-2G8: security-deposit read/receipt are server-authoritative.\n",
              period_routes + "  // SECURITY-2G8: security-deposit read/receipt are server-authoritative.\n",
              'server financial period route anchor',
          )

          for route, service in [
              ("app.post('/api/finance/receivables',", 'ReceivableService.create'),
              ("app.post('/api/finance/payables',", 'PayableService.create'),
          ]:
              start = server.find(route)
              if start < 0:
                  raise SystemExit(f'{route}: route not found')
              end = server.find("\n  });", start)
              if end < 0:
                  raise SystemExit(f'{route}: route end not found')
              block = server[start:end]
              if service not in block:
                  raise SystemExit(f'{route}: expected service call not found')
              old_tail = "          txContext\n        )\n      );"
              if block.count(old_tail) != 1:
                  raise SystemExit(f'{route}: expected exactly one UOW tail, found {block.count(old_tail)}')
              block = block.replace(
                  old_tail,
                  "          txContext\n        ),\n        { financialPeriodLock: 'SHARED' }\n      );",
                  1,
              )
              server = server[:start] + block + server[end:]

          server_path.write_text(server)
          PY

          git diff --check
          git diff -- src/domain/finance/FinanceEngine.ts server.ts

      - name: Commit exact R15 patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/finance/FinanceEngine.ts server.ts
          test -n "$(git diff --cached --name-only)"
          git commit -m "FINANCE-R15 wire authoritative period API and locks [skip ci]"
          git push origin HEAD:finance-r15-financial-period-authority
