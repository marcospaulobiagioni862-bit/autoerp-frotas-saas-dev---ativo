name: SECURITY-2I2 implementation validation

on:
  pull_request:
    branches:
      - ci-validate-security-2i2-implementation

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoerp_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d autoerp_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoerp_ci
      NODE_ENV: test
      ALLOW_MOCK_AUTH: 'true'
    steps:
      - name: Checkout exact I2 candidate
        uses: actions/checkout@v4
        with:
          ref: 83cef21a08e74f3521787f7da5cc5a3ec2a76648
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Candidate identity and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "83cef21a08e74f3521787f7da5cc5a3ec2a76648"
          test "$(git merge-base 4eae042609e4bae49733f129dde291ef99b3f4db HEAD)" = "4eae042609e4bae49733f129dde291ef99b3f4db"
          changed="$(git diff --name-only 4eae042609e4bae49733f129dde291ef99b3f4db..HEAD | sort)"
          expected="$(printf '%s\n' \
            drizzle/0010_driver_core_authority.sql \
            drizzle/meta/_journal.json \
            src/api/__tests__/driverClientTestRunner.ts \
            src/api/driverClient.ts \
            src/components/drivers/DriverDetailsModal.tsx \
            src/components/drivers/DriverFormModal.tsx \
            src/components/drivers/DriverLegacyDetailsBridge.ts \
            src/components/drivers/DriversManagement.tsx \
            src/db/repositories/postgresDriverRepository.ts \
            src/db/uow.ts \
            src/domain/finance/ITransactionContext.ts \
            src/server/__tests__/driverAuthorityIntegration.ts \
            src/server/driverRoutes.ts \
            src/server/vehicleRoutes.ts | sort)"
          printf 'I2_CHANGED:\n%s\n' "$changed"
          test "$changed" = "$expected"

      - name: Static Driver authority gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F '0010_driver_core_authority' drizzle/meta/_journal.json >/dev/null
          grep -F 'ALTER TABLE drivers FORCE ROW LEVEL SECURITY' drizzle/0010_driver_core_authority.sql >/dev/null
          grep -F 'AS PERMISSIVE' drizzle/0010_driver_core_authority.sql >/dev/null
          grep -F 'WITH CHECK' drizzle/0010_driver_core_authority.sql >/dev/null
          grep -F 'getDriverRepo()' src/domain/finance/ITransactionContext.ts >/dev/null
          grep -F 'getDriverRepo: () => new PostgresDriverRepository(tx)' src/db/uow.ts >/dev/null
          grep -F 'class PostgresDriverRepository' src/db/repositories/postgresDriverRepository.ts >/dev/null
          grep -F 'jsonb_array_elements_text' src/db/repositories/postgresDriverRepository.ts >/dev/null
          grep -F "app.get('/api/drivers'" src/server/driverRoutes.ts >/dev/null
          grep -F "app.post('/api/drivers'" src/server/driverRoutes.ts >/dev/null
          grep -F "app.patch('/api/drivers/:id/status'" src/server/driverRoutes.ts >/dev/null
          grep -F "app.post('/api/drivers/:id/archive'" src/server/driverRoutes.ts >/dev/null
          grep -F "code === '23505'" src/server/driverRoutes.ts >/dev/null
          grep -F 'registerDriverRoutes(app)' src/server/vehicleRoutes.ts >/dev/null
          grep -F 'static async list' src/api/driverClient.ts >/dev/null
          grep -F 'static async archive' src/api/driverClient.ts >/dev/null

          if grep -E 'DriverRepository|VehicleRepository|DriverService' src/components/drivers/DriversManagement.tsx; then
            echo 'Forbidden local core authority in DriversManagement'; exit 1
          fi
          if grep -E 'DriverService|companyId|usr-admin|Administrador' src/components/drivers/DriverFormModal.tsx; then
            echo 'Forbidden browser authority in DriverFormModal'; exit 1
          fi
          if grep -E 'DriverService|DriverRepository|VehicleRepository' src/components/drivers/DriverDetailsModal.tsx; then
            echo 'Forbidden local core authority in DriverDetailsModal'; exit 1
          fi
          if grep -E '^[[:space:]]*(DriverRepository|VehicleRepository)[,;]?$' src/components/drivers/DriverLegacyDetailsBridge.ts; then
            echo 'Forbidden core repository import in DriverLegacyDetailsBridge'; exit 1
          fi

          grep -F 'DriverClient.list' src/components/drivers/DriversManagement.tsx >/dev/null
          grep -F 'VehicleClient.list' src/components/drivers/DriversManagement.tsx >/dev/null
          grep -F 'DriverClient.get' src/components/drivers/DriverDetailsModal.tsx >/dev/null
          grep -F 'DriverHealthClient.get' src/components/drivers/DriverDetailsModal.tsx >/dev/null

      - name: Install
        run: npm install --no-package-lock --no-audit --no-fund

      - name: TypeScript
        run: npm run lint

      - name: Build
        run: npm run build

      - name: DriverClient transport
        run: npx tsx -e "import('./src/api/__tests__/driverClientTestRunner.ts').then(async (m) => { await m.DriverClientTestRunner.runAllTests(); console.log('DriverClient PASS'); })"

      - name: PostgreSQL16 migrations 0000..0009
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find drizzle -maxdepth 1 -name '*.sql' ! -name '0010_driver_core_authority.sql' | sort); do
            echo "Applying $file"
            psql -h localhost -U postgres -d autoerp_ci -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Seed legacy Driver before 0010
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          psql -h localhost -U postgres -d autoerp_ci -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO drivers (id, company_id, name, cpf, cnh, active)
          VALUES ('legacy-driver-i2', 'legacy-company', 'Legacy Driver I2', '39053344705', '24681357982', false);
          SQL

      - name: Apply 0010 and prove schema/RLS/backfill
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d autoerp_ci -v ON_ERROR_STOP=1 -f drizzle/0010_driver_core_authority.sql
          psql -h localhost -U postgres -d autoerp_ci -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            missing integer;
            rls_enabled boolean;
            rls_forced boolean;
            policy_using text;
            policy_check text;
            legacy_status text;
            legacy_archived boolean;
          BEGIN
            SELECT count(*) INTO missing
            FROM (VALUES
              ('rg'),('birth_date'),('phone'),('whatsapp'),('email'),
              ('address_street'),('address_number'),('address_complement'),('address_neighborhood'),
              ('address_city'),('address_state'),('address_zip_code'),('cnh_category'),('cnh_expiration'),
              ('app_platforms'),('status'),('photo_url'),('notes'),('is_archived')
            ) AS expected(column_name)
            WHERE NOT EXISTS (
              SELECT 1 FROM information_schema.columns c
              WHERE c.table_schema='public' AND c.table_name='drivers' AND c.column_name=expected.column_name
            );
            IF missing <> 0 THEN RAISE EXCEPTION 'missing Driver core columns: %', missing; END IF;

            SELECT status, is_archived INTO legacy_status, legacy_archived
            FROM drivers WHERE id='legacy-driver-i2';
            IF legacy_status IS DISTINCT FROM 'INACTIVE' OR legacy_archived IS DISTINCT FROM false THEN
              RAISE EXCEPTION 'legacy Driver backfill failed: %, %', legacy_status, legacy_archived;
            END IF;

            SELECT relrowsecurity, relforcerowsecurity INTO rls_enabled, rls_forced
            FROM pg_class WHERE oid='public.drivers'::regclass;
            IF NOT rls_enabled OR NOT rls_forced THEN RAISE EXCEPTION 'drivers RLS/FORCE gate failed'; END IF;

            SELECT qual, with_check INTO policy_using, policy_check
            FROM pg_policies WHERE schemaname='public' AND tablename='drivers' AND policyname='tenant_isolation_dr';
            IF policy_using IS NULL OR policy_using NOT LIKE '%app.current_tenant%' THEN RAISE EXCEPTION 'USING gate failed'; END IF;
            IF policy_check IS NULL OR policy_check NOT LIKE '%app.current_tenant%' THEN RAISE EXCEPTION 'WITH CHECK gate failed'; END IF;
          END $$;
          SQL

      - name: Driver authority PostgreSQL integration
        run: npx tsx src/server/__tests__/driverAuthorityIntegration.ts

      - name: Required regressions
        env:
          NODE_ENV: test
          USE_PGLITE: 'true'
          ALLOW_MOCK_AUTH: 'false'
          JWT_SECRET: security-2i2-regression-secret-at-least-32-bytes
          JWT_ISSUER: autoerp-ci
          JWT_AUDIENCE: autoerp-users
        shell: bash
        run: |
          set -euo pipefail
          npx tsx src/api/__tests__/driverHealthClientTestRunner.ts
          npx tsx src/api/__tests__/vehicleClientTestRunner.ts
          npx tsx src/api/__tests__/financeDepositClientTestRunner.ts
          npx tsx src/api/__tests__/financeReportingClientTestRunner.ts
          npx tsx src/api/__tests__/financeOverviewClientTestRunner.ts
          npx tsx src/api/__tests__/financeObligationClientTestRunner.ts
          npx tsx src/api/__tests__/financeSettlementClientTestRunner.ts
          npx tsx src/api/__tests__/financeTransactionClientTestRunner.ts
          npx tsx src/api/__tests__/financeRenegotiationClientTestRunner.ts
          npx tsx src/domain/services/__tests__/contractTestRunner.ts
          npx tsx src/domain/finance/__tests__/financeTestRunner.ts
          npx tsx src/domain/services/__tests__/securityTestRunner.ts
          npx tsx src/auth/__tests__/authSessionTestRunner.ts
          npx tsx src/server/__tests__/bootstrapTestRunner.ts
          npx tsx src/server/__tests__/sessionLoginTestRunner.ts
          npx tsx src/server/__tests__/passwordTestRunner.ts
          npx tsx src/server/__tests__/authTestRunner.ts

      - name: Diff and candidate immutability
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git rev-parse HEAD)" = "83cef21a08e74f3521787f7da5cc5a3ec2a76648"

      - name: Validation report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'AUTOERP_SECURITY_2I2_IMPLEMENTATION_VALIDATION_REPORT',
              `STATUS=${{ job.status }}`,
              `RUN_ID=${context.runId}`,
              'CANDIDATE=83cef21a08e74f3521787f7da5cc5a3ec2a76648',
              'BASE=4eae042609e4bae49733f129dde291ef99b3f4db',
              'PostgreSQL16/RLS/RBAC/Driver+Health atomicity required',
              'DriverClient + DriverHealthClient + VehicleClient regressions required',
              'Contract/Finance/Security/auth/session regressions required'
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });