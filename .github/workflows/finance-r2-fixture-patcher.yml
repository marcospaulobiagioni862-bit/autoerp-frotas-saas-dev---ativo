name: FINANCE-R2 Fixture Patcher

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'finance-r2-canonical-manual-categories'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finance-r2-canonical-manual-categories
          fetch-depth: 0
      - name: Align legacy fixtures with canonical category validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('src/server/__tests__/contractAuthorityIntegration.ts'),
              Path('src/server/__tests__/recurringAuthorityIntegration.ts'),
          ]

          for path in paths:
              text = path.read_text()
              signature = "('cat-rent-inc', ${companyA}, 'Aluguel de Veículos', 'INCOME'"
              if signature in text:
                  continue

              vehicle_pos = text.find('INSERT INTO vehicles')
              if vehicle_pos < 0:
                  raise SystemExit(f'vehicle fixture marker missing: {path}')
              statement_pos = text.rfind('await db.execute(sql`', 0, vehicle_pos)
              if statement_pos < 0:
                  raise SystemExit(f'db fixture marker missing: {path}')
              line_start = text.rfind('\n', 0, statement_pos) + 1
              indent = text[line_start:statement_pos]
              block = (
                  f"{indent}await db.execute(sql`\n"
                  f"{indent}  INSERT INTO financial_categories (id, company_id, name, type, active, created_at, updated_at) VALUES\n"
                  f"{indent}    ('cat-rent-inc', ${{companyA}}, 'Aluguel de Veículos', 'INCOME', true, NOW(), NOW())\n"
                  f"{indent}  ON CONFLICT (id) DO NOTHING\n"
                  f"{indent}`);\n"
              )
              text = text[:line_start] + block + text[line_start:]
              path.write_text(text)
          PY

          rm .github/workflows/finance-r2-fixture-patcher.yml
          grep -q "('cat-rent-inc', \${companyA}, 'Aluguel de Veículos', 'INCOME'" src/server/__tests__/contractAuthorityIntegration.ts
          grep -q "('cat-rent-inc', \${companyA}, 'Aluguel de Veículos', 'INCOME'" src/server/__tests__/recurringAuthorityIntegration.ts
          test ! -e .github/workflows/finance-r2-fixture-patcher.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/__tests__/contractAuthorityIntegration.ts src/server/__tests__/recurringAuthorityIntegration.ts .github/workflows/finance-r2-fixture-patcher.yml
          git diff --cached --check
          git commit -m "test(finance-r2): align contract and recurring category fixtures"
          git push origin HEAD:finance-r2-canonical-manual-categories
