name: AutoERP PR Gates

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autoerp-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoerp_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autoerp_phase1_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      USE_PGLITE: "false"
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_HOST: 127.0.0.1
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/autoerp_phase1_test
      RECURRING_SCHEDULER_ENABLED: "false"
      JWT_SECRET: autoerp-pr-gates-test-jwt-secret-that-is-long-enough
      JWT_ISSUER: autoerp-pr-gates-test
      JWT_AUDIENCE: autoerp-pr-gates-test-client

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies once
        run: npm install --ignore-scripts --package-lock=false

      - name: FINANCE-R12 source invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l | tr -d ' ')" -eq 1
          grep -F "finance_late_charge_rules" drizzle/0023_finance_overdue_authority.sql
          grep -F "UNIQUE (company_id, obligation_type)" drizzle/0023_finance_overdue_authority.sql
          if grep -Eq "DEFAULT (2|0\.033)|INSERT INTO finance_late_charge_rules.*SELECT|DEFAULT_RULE" drizzle/0023_finance_overdue_authority.sql src/server/financeOverdueAuthority.ts; then
            echo "FAIL: R12 must not invent or seed business late-charge rates"
            exit 1
          fi
          grep -F "FINANCIAL_OVERDUE_PROCESS" src/domain/finance/FinancialAuthorizationService.ts
          grep -F "FINANCIAL_LATE_CHARGE_RULE_MANAGE" src/domain/finance/FinancialAuthorizationService.ts
          grep -F "financialPeriodLock: 'SHARED'" src/server/financeOverdueAuthority.ts
          grep -F "FOR UPDATE" src/server/financeOverdueAuthority.ts
          grep -F "AUTHORITATIVE_OVERDUE_RECALCULATION" src/server/financeOverdueAuthority.ts
          grep -F "const allowed = new Set(['type', 'processingDate']);" src/server/financeOverdueRoutes.ts
          grep -F "registerFinanceOverdueRoutes" src/server/recurringRoutes.ts
          if grep -Fq "localRepositories" src/server/financeOverdueAuthority.ts; then
            echo "FAIL: R12 authoritative overdue processing references local/browser repositories"
            exit 1
          fi
          echo "FINANCE-R12 source invariants: PASS"

      - name: FINANCE-R13 source invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l | tr -d ' ')" -eq 1
          grep -F "FOR UPDATE SKIP LOCKED" src/server/recurringAuthority.ts
          grep -F "MAX_GENERATIONS_PER_RULE_PER_CYCLE = 52" src/server/recurringAuthority.ts
          grep -F "financialPeriodLock:'SHARED'" src/server/recurringAuthority.ts
          grep -F "startRecurringScheduler();" src/server/recurringRoutes.ts
          grep -F "UNIQUE(company_id, rule_id, period_ref)" drizzle/0015_recurring_scheduler_notifications.sql
          grep -F "uq_receivable_contract_period" drizzle/0015_recurring_scheduler_notifications.sql
          if grep -Fq "localRepositories" src/server/recurringAuthority.ts; then
            echo "FAIL: R13 authoritative recurring processing references local/browser repositories"
            exit 1
          fi
          if grep -Fq "processTenant(" src/server/recurringRoutes.ts; then
            echo "FAIL: R13 recurring money generation must not be exposed as a browser-triggered route"
            exit 1
          fi
          echo "FINANCE-R13 source invariants: PASS"

      - name: FINANCE-R14 source invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l | tr -d ' ')" -eq 1
          grep -F "uq_bank_statement_entry_dedup" drizzle/0024_finance_bank_reconciliation_authority.sql
          grep -F "uq_bank_statement_match_scope" drizzle/0024_finance_bank_reconciliation_authority.sql
          grep -F "tenant_access_bank_statement_entries" drizzle/0024_finance_bank_reconciliation_authority.sql
          grep -F "class PostgresBankStatementRepository" src/db/repositories/postgresBankStatementRepository.ts
          grep -F "class BankReconciliationAuthority" src/server/bankReconciliationAuthority.ts
          grep -F "findFinancialTransactionByIdWithLock" src/server/bankReconciliationAuthority.ts
          grep -F "registerBankReconciliationRoutes" src/server/recurringRoutes.ts
          grep -F "const allowed = new Set(['financialAccountId', 'entries']);" src/server/bankReconciliationRoutes.ts
          if grep -Fq "localRepositories" src/server/bankReconciliationAuthority.ts src/db/repositories/postgresBankStatementRepository.ts src/server/bankReconciliationRoutes.ts; then
            echo "FAIL: R14 server reconciliation authority references local/browser repositories"
            exit 1
          fi
          if grep -Fq "updateBalance" src/server/bankReconciliationAuthority.ts; then
            echo "FAIL: R14 reconciliation authority must never mutate financial account balances"
            exit 1
          fi
          if grep -Fq "getTransactionRepo().create" src/server/bankReconciliationAuthority.ts; then
            echo "FAIL: R14 reconciliation authority must never create financial transactions"
            exit 1
          fi
          echo "FINANCE-R14 source invariants: PASS"

      - name: FINANCE-R16 source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "security_deposit_commands" drizzle/0025_finance_security_deposit_lifecycle_authority.sql
          grep -F "FOR UPDATE" src/server/securityDepositLifecycleAuthority.ts
          grep -F "financialPeriodLock: 'SHARED'" src/server/securityDepositLifecycleAuthority.ts
          grep -F "registerSecurityDepositLifecycleRoutes" src/server/recurringRoutes.ts
          grep -F "/api/finance/security-deposits/return" src/server/securityDepositLifecycleRoutes.ts
          grep -F "/api/finance/security-deposits/compensate" src/server/securityDepositLifecycleRoutes.ts
          if grep -Fq "localRepositories" src/server/securityDepositLifecycleAuthority.ts src/server/securityDepositLifecycleRoutes.ts; then
            echo "FAIL: R16 lifecycle authority references browser/local repositories"
            exit 1
          fi
          echo "FINANCE-R16 source invariants: PASS"

      - name: FINANCE-R17 source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "/api/finance/payables/renegotiate" src/server/financePayableRenegotiationRoutes.ts
          grep -F "type: 'PAYABLE'" src/server/financePayableRenegotiationRoutes.ts
          grep -F "registerFinancePayableRenegotiationRoutes" src/server/recurringRoutes.ts
          grep -F "pg_advisory_xact_lock" src/domain/finance/RenegotiationService.ts
          grep -F "findPayableByIdWithLock" src/domain/finance/RenegotiationService.ts
          grep -F "saldo devedor autoritativo" src/domain/finance/RenegotiationService.ts
          grep -F "renegotiatePayables" src/api/financeRenegotiationClient.ts
          if grep -Fq "companyId: req.body" src/server/financePayableRenegotiationRoutes.ts || grep -Fq "userId: req.body" src/server/financePayableRenegotiationRoutes.ts; then
            echo "FAIL: R17 payable renegotiation trusts browser tenant/actor identity"
            exit 1
          fi
          echo "FINANCE-R17 source invariants: PASS"

      - name: FINANCE-R23 source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "tenant_access_financial_accounts" drizzle/0026_finance_master_data_authority.sql
          grep -F "tenant_access_financial_categories" drizzle/0026_finance_master_data_authority.sql
          grep -F "FINANCIAL_MASTER_DATA_MANAGE" src/domain/finance/FinancialAuthorizationService.ts
          grep -F "registerFinanceMasterDataRoutes" src/server/recurringRoutes.ts
          grep -F "/api/finance/master-data/accounts" src/server/financeMasterDataRoutes.ts
          grep -F "/api/finance/master-data/payment-methods" src/server/financeMasterDataRoutes.ts
          grep -F "/api/finance/master-data/categories" src/server/financeMasterDataRoutes.ts
          grep -F "openingBalancePolicy: 'INITIAL_EQUALS_CURRENT_AT_CREATION'" src/server/financeMasterDataAuthority.ts
          grep -F "pg_advisory_xact_lock" src/server/financeMasterDataAuthority.ts
          if grep -Fq "currentBalance" src/server/financeMasterDataRoutes.ts; then
            echo "FAIL: R23 route contract must never accept direct currentBalance mutation"
            exit 1
          fi
          if grep -Fq "localRepositories" src/server/financeMasterDataAuthority.ts src/server/financeMasterDataRoutes.ts src/api/financeMasterDataClient.ts; then
            echo "FAIL: R23 master-data authority references browser/local repositories"
            exit 1
          fi
          echo "FINANCE-R23 source invariants: PASS"

      - name: FINANCE-R24 source invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l | tr -d ' ')" -eq 1
          grep -F "/api/finance/reports/cash-flow" src/server/financeCashFlowRoutes.ts
          grep -F "UnitOfWork.run(actor.companyId" src/server/financeCashFlowRoutes.ts
          grep -F "CashFlowService.getCashFlowReport(" src/server/financeCashFlowRoutes.ts
          grep -F "registerFinanceCashFlowRoutes" src/server/recurringRoutes.ts
          grep -F "getCashFlow(periodStart" src/api/financeReportingClient.ts
          grep -F "account.initialBalance" src/domain/finance/CashFlowService.ts
          grep -F "TransactionType.TRANSFER" src/domain/finance/CashFlowService.ts
          grep -F "TransactionType.REVERSAL" src/domain/finance/CashFlowService.ts
          grep -F "balanceAmount" src/domain/finance/CashFlowService.ts
          if grep -Fq "localRepositories" src/server/financeCashFlowRoutes.ts src/api/financeReportingClient.ts src/components/finance/CashFlowView.tsx; then
            echo "FAIL: R24 production cash-flow path references browser/local repositories"
            exit 1
          fi
          if grep -Eq "companyId=|userId=|userName=" src/api/financeReportingClient.ts; then
            echo "FAIL: R24 reporting client must not send browser tenant/actor authority"
            exit 1
          fi
          echo "FINANCE-R24 source invariants: PASS"

      - name: WHATSAPP-1A source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "FORCE ROW LEVEL SECURITY" drizzle/0033_whatsapp_consent_outbox.sql
          grep -F "UNIQUE (company_id, idempotency_key)" drizzle/0033_whatsapp_consent_outbox.sql
          grep -F "status text NOT NULL DEFAULT 'HELD_PROVIDER_DISABLED'" drizzle/0033_whatsapp_consent_outbox.sql
          grep -F "const body = exactObject(req.body, new Set(['driverId', 'templateKey']));" src/server/whatsappRoutes.ts
          grep -F "providerCallApplied: false" src/server/whatsappRoutes.ts
          if grep -Fq "sql.raw" src/server/whatsappRoutes.ts; then
            echo "FAIL: WhatsApp authority must use parameterized SQL"
            exit 1
          fi
          if grep -Fq "fetch(" src/server/whatsappRoutes.ts; then
            echo "FAIL: foundation must not call a WhatsApp provider"
            exit 1
          fi
          echo "WHATSAPP-1A source invariants: PASS"

      - name: WHATSAPP-1B client source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "WhatsappClient.decideConsent" src/components/drivers/DriverDetailsModal.tsx
          grep -F "Preparar lembrete — sem enviar" src/components/drivers/DriverDetailsModal.tsx
          grep -F "providerCallApplied: false" src/api/whatsappClient.ts
          if grep -Fq "wa.me/" src/components/drivers/DriverDetailsModal.tsx; then
            echo "FAIL: driver UI must not bypass consent/outbox through wa.me"
            exit 1
          fi
          if grep -Fq "window.open" src/components/drivers/DriverDetailsModal.tsx; then
            echo "FAIL: driver UI must not open an external WhatsApp destination"
            exit 1
          fi
          echo "WHATSAPP-1B client source invariants: PASS"

      - name: WHATSAPP-1B2 template catalog invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "ALTER TABLE whatsapp_template_catalog FORCE ROW LEVEL SECURITY" drizzle/0035_whatsapp_template_catalog.sql
          grep -F "FOREIGN KEY (company_id, template_key, template_version)" drizzle/0035_whatsapp_template_catalog.sql
          grep -F "CREATE TRIGGER trg_whatsapp_template_immutable" drizzle/0035_whatsapp_template_catalog.sql
          grep -F "templateVersion: Number(row.template_version)" src/server/whatsappRoutes.ts
          grep -F "const body = exactObject(req.body, new Set(['driverId', 'templateKey']));" src/server/whatsappRoutes.ts
          if grep -Fq "fetch(" src/server/whatsappRoutes.ts; then
            echo "FAIL: template catalog must not call a WhatsApp provider"
            exit 1
          fi
          echo "WHATSAPP-1B2 template catalog invariants: PASS"

      - name: WHATSAPP-1C1 dispatch policy invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "providerEnabled: env.WHATSAPP_PROVIDER_ENABLED === 'true'" src/server/whatsappDispatchPolicy.ts
          grep -F "decision: 'PROVIDER_DISABLED'" src/server/whatsappDispatchPolicy.ts
          grep -F "rateLimitPerMinute" src/server/whatsappDispatchPolicy.ts
          grep -F "retryScheduleSeconds" src/server/whatsappDispatchPolicy.ts
          if grep -Eq "fetch\\(|https?://|phone_e164|template_parameters" src/server/whatsappDispatchPolicy.ts; then
            echo "FAIL: dispatch policy must remain provider-free and sanitized"
            exit 1
          fi
          if grep -R -Eq "WhatsappDispatchPolicy|planWhatsappDispatch" src/server --exclude='whatsappDispatchPolicy.ts' --exclude='whatsappDispatchPolicyTestRunner.ts'; then
            echo "FAIL: policy must not be wired to a production dispatcher before provider authorization"
            exit 1
          fi
          echo "WHATSAPP-1C1 dispatch policy invariants: PASS"

      - name: WHATSAPP-1D authenticated webhook invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "CONSTRAINT uq_whatsapp_webhook_nonce UNIQUE (company_id, nonce)" drizzle/0038_whatsapp_webhook_replay.sql
          grep -F "ALTER TABLE whatsapp_webhook_events FORCE ROW LEVEL SECURITY" drizzle/0038_whatsapp_webhook_replay.sql
          grep -F "createHmac('sha256'" src/server/whatsappWebhookAuth.ts
          grep -F "timingSafeEqual" src/server/whatsappWebhookAuth.ts
          grep -F "ON CONFLICT (company_id,nonce) DO NOTHING" src/server/whatsappWebhookAuth.ts
          grep -F "ON CONFLICT (company_id,provider_event_id) DO NOTHING" src/server/whatsappWebhookAuthority.ts
          grep -F "/api/whatsapp/webhooks/synthetic" src/server/whatsappRoutes.ts
          grep -F "new Set(['providerEventId', 'outboxId', 'eventType', 'occurredAt', 'replyText'])" src/server/whatsappRoutes.ts
          if grep -R -F "WHATSAPP_SYNTHETIC_WEBHOOK_KEYS_JSON" src --exclude='whatsappWebhookAuth.ts' --exclude='whatsappWebhookAuthIntegration.ts'; then
            echo "FAIL: WhatsApp webhook secrets must remain in the dedicated server boundary"
            exit 1
          fi
          if grep -Eq "UPDATE[[:space:]]+whatsapp_outbox|account_payables|contracts|vehicle_documents" src/server/whatsappWebhookAuth.ts src/server/whatsappWebhookAuthority.ts; then
            echo "FAIL: synthetic WhatsApp webhook must not apply business effects"
            exit 1
          fi
          echo "WHATSAPP-1D authenticated webhook invariants: PASS"

      - name: WHATSAPP-1E human-reviewed task proposal invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "ALTER TABLE whatsapp_inbound_task_proposals FORCE ROW LEVEL SECURITY" drizzle/0039_whatsapp_inbound_task_proposals.sql
          grep -F "UNIQUE (company_id, webhook_event_id)" drizzle/0039_whatsapp_inbound_task_proposals.sql
          grep -F "rawReplyPersisted: false" src/server/whatsappInboundTaskProposalAuthority.ts
          grep -F "OperationalAuthorityService.createTask" src/server/whatsappInboundTaskProposalAuthority.ts
          grep -F "/api/whatsapp/task-proposals/:proposalId/review" src/server/whatsappRoutes.ts
          grep -F "new Set(['decision', 'reason'])" src/server/whatsappRoutes.ts
          if grep -Fq "reply_text" drizzle/0039_whatsapp_inbound_task_proposals.sql; then
            echo "FAIL: raw WhatsApp reply text must not be persisted"
            exit 1
          fi
          if grep -Eq "account_payables|contracts|vehicle_documents|UPDATE[[:space:]]+vehicles" src/server/whatsappInboundTaskProposalAuthority.ts; then
            echo "FAIL: WhatsApp reply review must not mutate protected business records"
            exit 1
          fi
          echo "WHATSAPP-1E human-reviewed task proposal invariants: PASS"

      - name: WHATSAPP-1E2 proposal review client invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "WhatsappClient.listTaskProposalsForDriver" src/components/drivers/DriverDetailsModal.tsx
          grep -F "WhatsappClient.reviewTaskProposal" src/components/drivers/DriverDetailsModal.tsx
          grep -F "O conteúdo bruto não é armazenado nem exibido." src/components/drivers/DriverDetailsModal.tsx
          grep -F "exactRecord(value, [" src/api/whatsappClient.ts
          grep -F "body: JSON.stringify({ decision, reason: cleanReason })" src/api/whatsappClient.ts
          if grep -Eq "replyText|replyDigest|phoneE164|companyId" src/components/drivers/DriverDetailsModal.tsx; then
            echo "FAIL: proposal review UI must not consume raw WhatsApp or tenant authority"
            exit 1
          fi
          echo "WHATSAPP-1E2 proposal review client invariants: PASS"

      - name: WHATSAPP-1F read-only observability invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "resolveWhatsappObservabilityWindowDays" src/server/whatsappObservabilityAuthority.ts
          grep -F "/api/whatsapp/observability" src/server/whatsappRoutes.ts
          grep -F "providerEnabled: false" src/server/whatsappObservabilityAuthority.ts
          grep -F "automaticBusinessMutationApplied: false" src/server/whatsappObservabilityAuthority.ts
          if grep -Eq "app\.(post|patch|put|delete).*whatsapp/observability" src/server/whatsappRoutes.ts; then
            echo "FAIL: WhatsApp observability must remain read-only"
            exit 1
          fi
          if grep -Eq "INSERT|UPDATE|DELETE|reply_digest|phone_e164|raw_payload" src/server/whatsappObservabilityAuthority.ts; then
            echo "FAIL: WhatsApp observability must not mutate or expose protected data"
            exit 1
          fi
          echo "WHATSAPP-1F read-only observability invariants: PASS"

      - name: TELEMETRY-1A source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "FORCE ROW LEVEL SECURITY" drizzle/0034_telemetry_synthetic_authority.sql
          grep -F "UNIQUE (company_id, tracker_id, source_event_id)" drizzle/0034_telemetry_synthetic_authority.sql
          grep -F "registerTelemetryRoutes(app)" src/server/recurringRoutes.ts
          grep -F "ODOMETER_REGRESSION" src/server/telemetryAuthority.ts
          if grep -Fq "fetch(" src/server/telemetryAuthority.ts src/server/telemetryRoutes.ts; then
            echo "FAIL: TELEMETRY-1A must not call a provider"
            exit 1
          fi
          if grep -Eq "getPayableRepo|FinancialAuthorizationService|current_km.*UPDATE" src/server/telemetryAuthority.ts; then
            echo "FAIL: TELEMETRY-1A must not create financial or vehicle side effects"
            exit 1
          fi
          echo "TELEMETRY-1A source invariants: PASS"

      - name: TELEMETRY-1B sanitized client invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "TrackerClient.listTelemetry" src/components/fleet/FleetComplianceManagement.tsx
          grep -F "Consulta e triagem humana; nenhuma decisão altera KM, manutenção, contratos ou financeiro." src/components/fleet/FleetComplianceManagement.tsx
          grep -F "Unsafe telemetry response" src/api/trackerClient.ts
          grep -F "credentials:'include'" src/api/trackerClient.ts
          if grep -Fq "rawPayload" src/components/fleet/FleetComplianceManagement.tsx; then
            echo "FAIL: sanitized telemetry UI must not consume raw payload"
            exit 1
          fi
          echo "TELEMETRY-1B sanitized client invariants: PASS"

      - name: TELEMETRY-1C server-derived health invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "deriveTelemetryHealthStatus" src/server/telemetryAuthority.ts
          grep -F "/api/trackers/:trackerId/telemetry/health" src/server/telemetryRoutes.ts
          grep -F "TrackerClient.getTelemetryHealth" src/components/fleet/FleetComplianceManagement.tsx
          grep -F "O odômetro exibido não altera a quilometragem oficial do veículo." src/components/fleet/FleetComplianceManagement.tsx
          grep -F "Unsafe telemetry health response" src/api/trackerClient.ts
          if grep -Eq "POST.+telemetry/health|PATCH.+telemetry/health|PUT.+telemetry/health|DELETE.+telemetry/health" src/api/trackerClient.ts src/server/telemetryRoutes.ts; then
            echo "FAIL: TELEMETRY-1C health must remain read-only"
            exit 1
          fi
          echo "TELEMETRY-1C server-derived health invariants: PASS"

      - name: TELEMETRY-1D auditable quarantine review invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "tracker_telemetry_events_review_state_chk" drizzle/0036_telemetry_quarantine_review.sql
          grep -F "status = 'QUARANTINED' AND review_status = 'PENDING'" drizzle/0036_telemetry_quarantine_review.sql
          grep -F "FOR UPDATE" src/server/telemetryAuthority.ts
          grep -F "/api/trackers/:trackerId/telemetry/:eventId/review" src/server/telemetryRoutes.ts
          grep -F "exact(req.body,['decision','reason'])" src/server/telemetryRoutes.ts
          grep -F "A triagem apenas registra a análise humana; não altera KM nem financeiro." src/components/fleet/FleetComplianceManagement.tsx
          grep -F "Unsafe telemetry review response" src/api/trackerClient.ts
          if grep -Eq "writeRoles=.*READONLY" src/server/telemetryRoutes.ts; then
            echo "FAIL: READONLY role must not review telemetry"
            exit 1
          fi
          if grep -Eq "getPayableRepo|FinancialAuthorizationService|UPDATE[[:space:]]+vehicles|current_km[[:space:]]*=" src/server/telemetryAuthority.ts src/server/telemetryRoutes.ts; then
            echo "FAIL: telemetry review must not apply operational or financial effects"
            exit 1
          fi
          echo "TELEMETRY-1D auditable quarantine review invariants: PASS"

      - name: TELEMETRY-1E authenticated synthetic webhook invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "CONSTRAINT uq_telemetry_webhook_nonce UNIQUE (company_id, nonce)" drizzle/0037_telemetry_webhook_replay.sql
          grep -F "ALTER TABLE telemetry_webhook_nonces FORCE ROW LEVEL SECURITY" drizzle/0037_telemetry_webhook_replay.sql
          grep -F "createHmac('sha256'" src/server/telemetryWebhookAuth.ts
          grep -F "timingSafeEqual" src/server/telemetryWebhookAuth.ts
          grep -F "ON CONFLICT (company_id,nonce) DO NOTHING" src/server/telemetryWebhookAuth.ts
          grep -F "/api/telemetry/webhooks/synthetic" src/server/telemetryRoutes.ts
          grep -F "exact(req.body,['trackerId','sourceEventId','eventType','occurredAt','payload'])" src/server/telemetryRoutes.ts
          if grep -R -F "TELEMETRY_SYNTHETIC_WEBHOOK_KEYS_JSON" src --exclude='telemetryWebhookAuth.ts' --exclude='telemetryWebhookAuthIntegration.ts'; then
            echo "FAIL: webhook secrets must remain in the dedicated server boundary"
            exit 1
          fi
          if grep -Eq "getPayableRepo|FinancialAuthorizationService|UPDATE[[:space:]]+vehicles|current_km[[:space:]]*=" src/server/telemetryWebhookAuth.ts src/server/telemetryRoutes.ts; then
            echo "FAIL: webhook authentication must not apply operational or financial effects"
            exit 1
