          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'dist/assets';
          const files = fs.readdirSync(root).filter((file) => fs.statSync(path.join(root, file)).isFile());
          const chunks = files.map((file) => ({ file, text: fs.readFileSync(path.join(root, file), 'utf8') }));
          const bundle = chunks.map(({ text }) => text).join('\n');
          const forbidden = [
            ['AutoERP_DB', 'legacy StorageAdapter/IndexedDB graph'],
            ['__autoerp_executive_decisions_v1_', 'browser-local decision authority'],
            ['__autoerp_goals_v1_', 'browser-local goals authority'],
            ['usr-sre-admin', 'simulated SRE admin identity'],
            ['usr-exec-1', 'simulated workflow identity'],
            ['usr-admin-default', 'simulated execution/release admin identity'],
            ['comp-main-tenant-360', 'simulated performance tenant'],
            ['admin-consolidator', 'simulated consolidation identity'],
            ['EnterpriseWorkflowTestRunner', 'workflow browser test runner'],
            ['EnterpriseExecutionTestRunner', 'execution browser test runner'],
            ['EnterprisePerformanceTestRunner', 'performance browser test runner'],
            ['42/42', 'fabricated production test badge'],
          ];
          for (const [marker, label] of forbidden) if (chunks.some(({ text }) => text.includes(marker))) { console.error(`FAIL: ${label} found in production frontend bundle (${marker})`); process.exit(1); }
          const required = [
            ['COCKPIT SERVER AUTHORITY', 'trusted production navigation'],
            ['Server authority required', 'fail-closed experimental cockpit boundary'],
            ['/api/operations/tasks', 'task authority'],
            ['/api/operations/incidents', 'incident authority'],
            ['/api/operations/executive/snapshot', 'executive authority'],
            ['/api/admin/users', 'user administration authority'],
            ['/api/admin/tenant-profile', 'tenant profile administration authority'],
            ['BROWSER_WRITE_DISABLED_SERVER_AUTHORITY_REQUIRED', 'legacy write fail-closed bridge'],
          ];
          for (const [marker, label] of required) if (!bundle.includes(marker)) { console.error(`FAIL: ${label} missing from production frontend bundle (${marker})`); process.exit(1); }
          console.log('PASS: AutoERP consolidated production trust boundary');
          NODE
