name: SECURITY-2I2 implementation gate
on:
  pull_request:
    branches: [ci-implement-security-2i2]
permissions:
  contents: write
  pull-requests: write
jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: autoerp_ci }
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d autoerp_ci"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout production candidate
        uses: actions/checkout@v4
        with: { ref: security-2i2-driver-core-switchover, fetch-depth: 0 }
      - name: Checkout CI controls
        uses: actions/checkout@v4
        with:
          ref: ci-implement-security-2i2
          path: .ci-control
          sparse-checkout: |
            .ci
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Exact base gate
        run: |
          test "$(git rev-parse HEAD)" = "4eae042609e4bae49733f129dde291ef99b3f4db"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Install
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Apply I2 patch
        run: |
          python .ci-control/.ci/apply-security-2i2-backend.py
          python .ci-control/.ci/apply-security-2i2-hardening.py
          python .ci-control/.ci/apply-security-2i2-ui.py
          python .ci-control/.ci/apply-security-2i2-tests.py
      - name: Exact scope gate
        shell: bash
        run: |
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | grep -v '^\.ci-control/' | sort -u)"
          expected="$(printf '%s\n' \
            drizzle/0010_driver_core_authority.sql \
            drizzle/meta/_journal.json \
            server.ts \
            src/api/__tests__/driverClientTestRunner.ts \
            src/api/driverClient.ts \
            src/components/drivers/DriverDetailsModal.tsx \
            src/components/drivers/DriverFormModal.tsx \
            src/components/drivers/DriversManagement.tsx \
            src/db/repositories/postgresRepositories.ts \
            src/db/schema.ts \
            src/db/uow.ts \
            src/domain/finance/ITransactionContext.ts \
            src/domain/services/DriverLegacyDetailsBridge.ts \
            src/server/driverRoutes.ts \
            src/shared/utils/driverValidation.ts | sort)"
          printf 'CHANGED:\n%s\n' "$changed"
          test "$changed" = "$expected"
      - name: I2 authority static gate
        shell: bash
        run: |
          grep -F '0010_driver_core_authority' drizzle/meta/_journal.json >/dev/null
          grep -F 'ALTER TABLE drivers FORCE ROW LEVEL SECURITY' drizzle/0010_driver_core_authority.sql >/dev/null
          grep -F 'AS PERMISSIVE' drizzle/0010_driver_core_authority.sql >/dev/null
          grep -F 'WITH CHECK' drizzle/0010_driver_core_authority.sql >/dev/null
          grep -F 'WHERE status IS NULL' drizzle/0010_driver_core_authority.sql >/dev/null
          grep -F 'getDriverRepo' src/domain/finance/ITransactionContext.ts >/dev/null
          grep -F 'PostgresDriverRepository' src/db/uow.ts >/dev/null
          grep -F "app.get('/api/drivers'" src/server/driverRoutes.ts >/dev/null
          grep -F "app.post('/api/drivers'" src/server/driverRoutes.ts >/dev/null
          grep -F "app.patch('/api/drivers/:id'" src/server/driverRoutes.ts >/dev/null
          grep -F "app.patch('/api/drivers/:id/status'" src/server/driverRoutes.ts >/dev/null
          grep -F "app.post('/api/drivers/:id/archive'" src/server/driverRoutes.ts >/dev/null
          ! grep -F "app.delete('/api/drivers" src/server/driverRoutes.ts
          grep -F "'cause' in cur" src/server/driverRoutes.ts >/dev/null
          grep -F "code==='23505'" src/server/driverRoutes.ts >/dev/null
          test "$(grep -c 'getDriverRepo().findByIdForCompany' server.ts)" -ge 2
          grep -F 'registerDriverRoutes(app)' server.ts >/dev/null
          grep -F 'static async archive' src/api/driverClient.ts >/dev/null
          ! grep -E 'DriverRepository|VehicleRepository|DriverService' src/components/drivers/DriversManagement.tsx
          ! grep -E 'DriverService|companyId|usr-admin|Administrador' src/components/drivers/DriverFormModal.tsx
          ! grep -F 'DriverService' src/components/drivers/DriverDetailsModal.tsx
          grep -F 'DriverClient.get' src/components/drivers/DriverDetailsModal.tsx >/dev/null
          grep -F 'VehicleClient.get' src/components/drivers/DriverDetailsModal.tsx >/dev/null
          grep -F 'DriverHealthClient' src/components/drivers/DriverDetailsModal.tsx >/dev/null
          ! grep -E 'DriverRepository|VehicleRepository' src/domain/services/DriverLegacyDetailsBridge.ts
          python - <<'PY'
          from pathlib import Path
          text=Path('src/api/driverClient.ts').read_text()
          create=text.split('export interface DriverCreateInput{',1)[1].split('export type DriverUpdateInput',1)[0]
          for forbidden in ['companyId','userId','userName','role','status','isArchived','currentVehicleId','currentContractId','healthAndEmergency']:
              assert forbidden not in create, forbidden
          PY
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Driver client transport
        run: npx tsx src/api/__tests__/driverClientTestRunner.ts
      - name: Vehicle and health transport regressions
        run: |
          npx tsx src/api/__tests__/vehicleClientTestRunner.ts
          npx tsx src/api/__tests__/driverHealthClientTestRunner.ts
      - name: PostgreSQL16 Driver authority validation
        shell: bash
        run: |
          mkdir -p .ci
          cp .ci-control/.ci/security-2i2-validation.ts .ci/security-2i2-validation.ts
          npx tsx .ci/security-2i2-validation.ts
          rm -rf .ci
      - name: Core regressions
        env:
          NODE_ENV: test
          USE_PGLITE: 'true'
          ALLOW_MOCK_AUTH: 'false'
          JWT_SECRET: security-2i2-regression-secret-at-least-32-bytes
          JWT_ISSUER: autoerp-ci
          JWT_AUDIENCE: autoerp-users
        run: |
          npx tsx src/api/__tests__/financeDepositClientTestRunner.ts
          npx tsx src/api/__tests__/financeReportingClientTestRunner.ts
          npx tsx src/api/__tests__/financeOverviewClientTestRunner.ts
          npx tsx src/api/__tests__/financeObligationClientTestRunner.ts
          npx tsx src/api/__tests__/financeSettlementClientTestRunner.ts
          npx tsx src/api/__tests__/financeTransactionClientTestRunner.ts
          npx tsx src/api/__tests__/financeRenegotiationClientTestRunner.ts
          npx tsx src/domain/services/__tests__/contractTestRunner.ts
          npx tsx src/domain/finance/__tests__/financeTestRunner.ts
          npx tsx src/domain/services/__tests__/securityTestRunner.ts
          npx tsx src/auth/__tests__/authSessionTestRunner.ts
          npx tsx src/server/__tests__/bootstrapTestRunner.ts
          npx tsx src/server/__tests__/sessionLoginTestRunner.ts
          npx tsx src/server/__tests__/passwordTestRunner.ts
          npx tsx src/server/__tests__/authTestRunner.ts
      - name: Diff safety
        run: |
          git diff --check
          ! git diff --name-only | grep -E '^package(-lock)?\.json$'
          ! git diff | grep -E '@ts-ignore|ts-ignore'
          test -z "$(git status --porcelain | grep '^?? \.ci/' || true)"
      - name: Commit validated candidate
        shell: bash
        run: |
          git config user.name 'autoerp-security-controller'
          git config user.email 'actions@users.noreply.github.com'
          git add drizzle/0010_driver_core_authority.sql drizzle/meta/_journal.json server.ts src/api/__tests__/driverClientTestRunner.ts src/api/driverClient.ts src/components/drivers/DriverDetailsModal.tsx src/components/drivers/DriverFormModal.tsx src/components/drivers/DriversManagement.tsx src/db/repositories/postgresRepositories.ts src/db/schema.ts src/db/uow.ts src/domain/finance/ITransactionContext.ts src/domain/services/DriverLegacyDetailsBridge.ts src/server/driverRoutes.ts src/shared/utils/driverValidation.ts
          git commit -m 'feat(security): switch driver core to server authority'
          git push origin HEAD:security-2i2-driver-core-switchover
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: CI report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body=['AUTOERP_SECURITY_2I2_IMPLEMENTATION_REPORT',`STATUS=${{ job.status }}`,`RUN_ID=${context.runId}`,`CANDIDATE_SHA=${process.env.CANDIDATE_SHA||'not-published'}`,'BASE=4eae042609e4bae49733f129dde291ef99b3f4db','DriverClient=10/10 required','VehicleClient=12/12 + DriverHealth regressions required','PostgreSQL16/RLS/RBAC/health existence/audit rollback required','Contract=20/20, Finance=46/46, Security=35/35 required'].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
