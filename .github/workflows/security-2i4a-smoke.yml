name: SECURITY-2I4A smoke gate

on:
  pull_request:
    branches:
      - ci-implement-security-2i4a

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: 48cd608ddaa36e9bd7bb160f048234272673491e
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify candidate
        run: test "$(git rev-parse HEAD)" = "48cd608ddaa36e9bd7bb160f048234272673491e"
      - name: Install
        run: npm install --no-package-lock --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Attachment client tests
        run: npx tsx src/api/__tests__/attachmentClientTestRunner.ts
