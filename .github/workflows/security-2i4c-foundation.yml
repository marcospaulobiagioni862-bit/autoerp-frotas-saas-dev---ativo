name: SECURITY-2I4C foundation implementation

on:
  pull_request:
    branches:
      - ci-implement-security-2i4c-foundation

permissions:
  contents: write

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoerp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d autoerp_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoerp_ci
      NODE_ENV: test
      ALLOW_MOCK_AUTH: 'true'
      ATTACHMENT_STORAGE_DIR: /tmp/autoerp-attachments-ci
    steps:
      - name: Checkout exact I4C candidate
        uses: actions/checkout@v4
        with:
          ref: 8d763d616e551664ba92505635badd9194156285
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify immutable candidate
        run: |
          test "$(git rev-parse HEAD)" = "8d763d616e551664ba92505635badd9194156285"
          test "$(git merge-base 68b2ab0315bfb9e77cacb760b8f1bffdb4034357 HEAD)" = "68b2ab0315bfb9e77cacb760b8f1bffdb4034357"

      - name: Apply foundation alignment patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          replacements = [
            ["src/types/entities/contract.ts", "ICBzaWduZWRDb250cmFjdFVybD86IHN0cmluZzsKICBub3Rlcz86IHN0cmluZzs=", "ICBzaWduZWRDb250cmFjdFVybD86IHN0cmluZzsKICBzaWduYXR1cmVSZXF1aXJlZD86IGJvb2xlYW47CiAgbm90ZXM/OiBzdHJpbmc7"],
            ["src/types/entities/contract.ts", "ZXhwb3J0IGludGVyZmFjZSBDb250cmFjdFRlbXBsYXRlIHsKICBpZDogc3RyaW5nOyAvLyBVVUlECiAgY29tcGFueUlkOiBzdHJpbmc7CiAgdGl0bGU6IHN0cmluZzsKICBjb250ZW50TWFya2Rvd246IHN0cmluZzsKICBhY3RpdmU6IGJvb2xlYW47CiAgY3JlYXRlZEF0OiBzdHJpbmc7CiAgdXBkYXRlZEF0OiBzdHJpbmc7Cn0K", ""],
            ["src/db/schema.ts", "", ""],
            ["src/domain/finance/ITransactionContext.ts", "ICBDb250cmFjdCwKfSBmcm9tICcuLi8uLi90eXBlcy9lbnRpdGllcyc7", "ICBDb250cmFjdCwKICBDb250cmFjdFRlbXBsYXRlLAogIENvbnRyYWN0QXJ0aWZhY3QsCiAgQ29udHJhY3RBcnRpZmFjdFR5cGUsCn0gZnJvbSAnLi4vLi4vdHlwZXMvZW50aXRpZXMnOw=="],
            ["src/domain/finance/ITransactionContext.ts", "ZXhwb3J0IGludGVyZmFjZSBJVHJhbnNhY3Rpb25Db250ZXh0IHsK", ""],
            ["src/domain/finance/ITransactionContext.ts", "ICBnZXRDb250cmFjdFJlcG8oKTogSVRyYW5zYWN0aW9uQ29udHJhY3RSZXBvc2l0b3J5Owo=", "ICBnZXRDb250cmFjdFJlcG8oKTogSVRyYW5zYWN0aW9uQ29udHJhY3RSZXBvc2l0b3J5OwogIGdldENvbnRyYWN0VGVtcGxhdGVSZXBvKCk6IElUcmFuc2FjdGlvbkNvbnRyYWN0VGVtcGxhdGVSZXBvc2l0b3J5OwogIGdldENvbnRyYWN0QXJ0aWZhY3RSZXBvKCk6IElUcmFuc2FjdGlvbkNvbnRyYWN0QXJ0aWZhY3RSZXBvc2l0b3J5Owo="],
            ["src/db/uow.ts", "aW1wb3J0IHsgUG9zdGdyZXNDb250cmFjdFJlcG9zaXRvcnkgfSBmcm9tICcuL3JlcG9zaXRvcmllcy9wb3N0Z3Jlc0NvbnRyYWN0UmVwb3NpdG9yeSc7Cg==", ""],
            ["src/db/uow.ts", "ICAgICAgICBnZXRDb250cmFjdFJlcG86ICgpID0+IG5ldyBQb3N0Z3Jlc0NvbnRyYWN0UmVwb3NpdG9yeSh0eCksCg==", ""],
            ["src/db/repositories/postgresContractRepository.ts", "ICAgICAgc2lnbmVkQ29udHJhY3RVcmw6IHJvdy5zaWduZWRfY29udHJhY3RfdXJsIHx8IHVuZGVmaW5lZCwKICAgICAgbm90ZXM6IHJvdy5ub3RlcyB8fCB1bmRlZmluZWQs", "ICAgICAgc2lnbmVkQ29udHJhY3RVcmw6IHJvdy5zaWduZWRfY29udHJhY3RfdXJsIHx8IHVuZGVmaW5lZCwKICAgICAgc2lnbmF0dXJlUmVxdWlyZWQ6IEJvb2xlYW4ocm93LnNpZ25hdHVyZV9yZXF1aXJlZCksCiAgICAgIG5vdGVzOiByb3cubm90ZXMgfHwgdW5kZWZpbmVkLA=="],
            ["src/db/repositories/postgresContractRepository.ts", "ICAgICAgICBwYXltZW50X21ldGhvZF9pZCwgdGVtcGxhdGVfaWQsIGdlbmVyYXRlZF9wZGZfdXJsLCBzaWduZWRfY29udHJhY3RfdXJsLAogICAgICAgIG5vdGVzLCBpc19hcmNoaXZlZCwgY3JlYXRlZF9hdCwgdXBkYXRlZF9hdA==", "ICAgICAgICBwYXltZW50X21ldGhvZF9pZCwgdGVtcGxhdGVfaWQsIGdlbmVyYXRlZF9wZGZfdXJsLCBzaWduZWRfY29udHJhY3RfdXJsLCBzaWduYXR1cmVfcmVxdWlyZWQsCiAgICAgICAgbm90ZXMsIGlzX2FyY2hpdmVkLCBjcmVhdGVkX2F0LCB1cGRhdGVkX2F0"],
            ["src/db/repositories/postgresContractRepository.ts", "", ""],
            ["src/db/repositories/postgresContractRepository.ts", "ICAgICAgICBzaWduZWRfY29udHJhY3RfdXJsID0gJHtpdGVtLnNpZ25lZENvbnRyYWN0VXJsIHx8IG51bGx9LAogICAgICAgIG5vdGVzID0gJHtpdGVtLm5vdGVzIHx8IG51bGx9LA==", "ICAgICAgICBzaWduZWRfY29udHJhY3RfdXJsID0gJHtpdGVtLnNpZ25lZENvbnRyYWN0VXJsIHx8IG51bGx9LAogICAgICAgIHNpZ25hdHVyZV9yZXF1aXJlZCA9ICR7aXRlbS5zaWduYXR1cmVSZXF1aXJlZCA/PyB0cnVlfSwKICAgICAgICBub3RlcyA9ICR7aXRlbS5ub3RlcyB8fCBudWxsfSw="],
            ["src/server/contractRoutes.ts", "ICAgICAgICAgIHRlbXBsYXRlSWQ6IG9wdGlvbmFsVGV4dChib2R5LnRlbXBsYXRlSWQpLAogICAgICAgICAgbm90ZXM6IG9wdGlvbmFsVGV4dChib2R5Lm5vdGVzKSwKICAgICAgICAgIGlzQXJjaGl2ZWQ6IGZhbHNlLA==", "ICAgICAgICAgIHRlbXBsYXRlSWQ6IG9wdGlvbmFsVGV4dChib2R5LnRlbXBsYXRlSWQpLAogICAgICAgICAgc2lnbmF0dXJlUmVxdWlyZWQ6IHRydWUsCiAgICAgICAgICBub3Rlczogb3B0aW9uYWxUZXh0KGJvZHkubm90ZXMpLAogICAgICAgICAgaXNBcmNoaXZlZDogZmFsc2Us"],
            ["drizzle/meta/_journal.json", "ICAgIHsiaWR4IjoxMywidmVyc2lvbiI6IjciLCJ3aGVuIjoxNzg3MTUyMjAwMDAwLCJ0YWciOiIwMDEzX2RvY3VtZW50X3NlbWFudGljcyIsImJyZWFrcG9pbnRzIjp0cnVlfQo=", "ICAgIHsiaWR4IjoxMywidmVyc2lvbiI6IjciLCJ3aGVuIjoxNzg3MTUyMjAwMDAwLCJ0YWciOiIwMDEzX2RvY3VtZW50X3NlbWFudGljcyIsImJyZWFrcG9pbnRzIjp0cnVlfSwKICAgIHsiaWR4IjoxNCwidmVyc2lvbiI6IjciLCJ3aGVuIjoxNzg3MTU3NjAwMDAwLCJ0YWciOiIwMDE0X2NvbnRyYWN0X2V4ZWN1dGlvbl9hdXRob3JpdHkiLCJicmVha3BvaW50cyI6dHJ1ZX0K"]
          ]
          def dec(v):
              return base64.b64decode(v).decode()
          for path, old64, new64 in replacements:
              p = Path(path)
              text = p.read_text()
              old, new = dec(old64), dec(new64)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: replacement count={count}")
              p.write_text(text.replace(old, new))
          PY

      - name: Scope gate
        run: |
          git diff --name-only | sort | tee /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          drizzle/meta/_journal.json
          src/db/repositories/postgresContractRepository.ts
          src/db/schema.ts
          src/db/uow.ts
          src/domain/finance/ITransactionContext.ts
          src/server/contractRoutes.ts
          src/types/entities/contract.ts
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - name: Install
        run: npm ci

      - name: TypeScript
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Apply migrations 0000 through 0013
        env:
          PGPASSWORD: postgres
        run: |
          for f in $(ls drizzle/[0-9][0-9][0-9][0-9]_*.sql | sort | grep -v '0014_contract_execution_authority.sql'); do
            echo "APPLY $f"
            psql -h localhost -U postgres -d autoerp_ci -v ON_ERROR_STOP=1 -f "$f" >/dev/null
          done

      - name: Seed legacy contract before 0014
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d autoerp_ci -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO companies(id, document, name, status) VALUES ('tenant-legacy','00','Legacy Co','ACTIVE');
          INSERT INTO contracts(
            id, company_id, driver_id, vehicle_id, status, contract_number, start_date,
            rental_amount, billing_periodicity, billing_due_day_of_week, billing_due_day_of_month,
            security_deposit_amount, franchise_km, excess_km_rate, is_archived
          ) VALUES (
            'legacy-contract','tenant-legacy','legacy-driver','legacy-vehicle','DRAFT','LEGACY-I4C','2026-08-01',
            700,'WEEKLY',1,1,0,0,0,false
          );
          SQL

      - name: Apply migration 0014
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d autoerp_ci -v ON_ERROR_STOP=1 -f drizzle/0014_contract_execution_authority.sql

      - name: Validate migration semantics and RLS
        env:
          PGPASSWORD: postgres
        run: |
          test "$(psql -h localhost -U postgres -d autoerp_ci -Atc "SELECT signature_required FROM contracts WHERE id='legacy-contract'")" = "f"
          psql -h localhost -U postgres -d autoerp_ci -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO contracts(
            id, company_id, driver_id, vehicle_id, status, contract_number, start_date,
            rental_amount, billing_periodicity, billing_due_day_of_week, billing_due_day_of_month,
            security_deposit_amount, franchise_km, excess_km_rate, is_archived
          ) VALUES (
            'new-contract','tenant-legacy','driver-new','vehicle-new','DRAFT','NEW-I4C','2026-08-19',
            700,'WEEKLY',1,1,0,0,0,false
          );
          DO $$
          BEGIN
            IF (SELECT signature_required FROM contracts WHERE id='new-contract') IS DISTINCT FROM true THEN
              RAISE EXCEPTION 'new contracts must default signature_required=true';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_class c WHERE c.relname='contract_templates' AND c.relrowsecurity AND c.relforcerowsecurity
            ) THEN RAISE EXCEPTION 'contract_templates RLS/FORCE missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_class c WHERE c.relname='contract_artifacts' AND c.relrowsecurity AND c.relforcerowsecurity
            ) THEN RAISE EXCEPTION 'contract_artifacts RLS/FORCE missing'; END IF;
          END $$;
          DROP ROLE IF EXISTS autoerp_i4c_rls;
          CREATE ROLE autoerp_i4c_rls LOGIN PASSWORD 'rls-pass';
          GRANT USAGE ON SCHEMA public TO autoerp_i4c_rls;
          GRANT SELECT, INSERT, UPDATE ON contract_templates, contract_artifacts TO autoerp_i4c_rls;
          SQL

          PGPASSWORD=rls-pass psql -h localhost -U autoerp_i4c_rls -d autoerp_ci -v ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('app.current_tenant','tenant-a',false);
          INSERT INTO contract_templates(
            id,company_id,template_key,title,content_markdown,version_number,is_current,is_active,is_archived,created_by
          ) VALUES ('tpl-a','tenant-a','rental','Rental','Hello',1,true,true,false,'user-a');
          INSERT INTO contract_artifacts(
            id,company_id,contract_id,artifact_type,attachment_id,template_id,snapshot_json,snapshot_hash,is_current,is_archived,created_by
          ) VALUES (
            'art-a','tenant-a','contract-a','GENERATED_PDF','att-a','tpl-a','{}',
            'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',true,false,'user-a'
          );
          SELECT set_config('app.current_tenant','tenant-b',false);
          DO $$
          BEGIN
            IF (SELECT count(*) FROM contract_templates) <> 0 THEN RAISE EXCEPTION 'template RLS leak'; END IF;
            IF (SELECT count(*) FROM contract_artifacts) <> 0 THEN RAISE EXCEPTION 'artifact RLS leak'; END IF;
          END $$;
          SQL

          set +e
          PGPASSWORD=rls-pass psql -h localhost -U autoerp_i4c_rls -d autoerp_ci -v ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('app.current_tenant','tenant-b',false);
          INSERT INTO contract_templates(
            id,company_id,template_key,title,content_markdown,version_number,is_current,is_active,is_archived,created_by
          ) VALUES ('tpl-forged','tenant-a','forged','Forged','No',1,true,true,false,'user-x');
          SQL
          rc=$?
          set -e
          test "$rc" -ne 0

      - name: Static foundation checks
        run: |
          grep -q "contractTemplates = pgTable" src/db/schema.ts
          grep -q "contractArtifacts = pgTable" src/db/schema.ts
          grep -q "signatureRequired: true" src/server/contractRoutes.ts
          grep -q "getContractTemplateRepo" src/db/uow.ts
          grep -q "getContractArtifactRepo" src/db/uow.ts
          git diff --check

      - name: Publish validated alignment
        run: |
          git config user.name "ChatGPT AutoERP"
          git config user.email "actions@users.noreply.github.com"
          git add drizzle/meta/_journal.json src/types/entities/contract.ts src/db/schema.ts src/domain/finance/ITransactionContext.ts src/db/uow.ts src/db/repositories/postgresContractRepository.ts src/server/contractRoutes.ts
          git commit -m "feat(contract): wire I4C execution authority foundation"
          git push origin HEAD:security-2i4c-contract-execution-authority
